# Read-only reuse of 317 exact-source Lean artifacts; no CI reruns or repo mutation.
name: RH global prime Arch consolidated join V1

on:
  pull_request:
    paths:
      - 'AEGISOverlay/RHGlobalPrimeArchConsolidatedJoinV1.lean'
      - '.github/workflows/rh-global-prime-arch-consolidated-join-v1.yml'
      - 'AEGISOverlay/RHGlobalPrimeArchFrontierV1.lean'
      - 'research/rh/consolidated_v1/manifest.json'
      - 'research/rh/consolidated_v1/src/RHConsolidatedV1.lean'

permissions:
  contents: read
  actions: read

env:
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LI_PROVIDER_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  SOURCE_HEAD: 273619f69d28ac4d83c7bcb5e81094db684dce32
  SOURCE_RUN: '44286595120'

jobs:
  exact-source-kernel-join:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout exact PR snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify original 317-module source run provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object AEGISOverlay/RHGlobalPrimeArchFrontierV1.lean)" = fb9df99e309a18ac3cc565762808cf377ce5ee84
          test "$(git hash-object research/rh/consolidated_v1/src/RHConsolidatedV1.lean)" = 7fdaa9f5afe72cf8ba28516114fb774c71636038
          actual_sha="$(gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN" --jq .head_sha)"
          conclusion="$(gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN" --jq .conclusion)"
          test "$actual_sha" = "$SOURCE_HEAD"
          test "$conclusion" = success
          echo "EXACT_SOURCE_RUN_REUSED=$SOURCE_RUN"

      - name: Checkout pinned Li criterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_PROVIDER_SHA }}
          path: .li
          persist-credentials: false

      - name: Apply the exact pinned provider patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .li rev-parse HEAD)" = "$LI_PROVIDER_SHA"
          (cd .li && patch -p0 < ../research/rh/consolidated_v1/li-provider.patch)

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"

      - name: Extract exact-source files (only, no rebuild of 133 batch cells)
        shell: bash
        run: |
          set -euo pipefail
          cat research/rh/consolidated_v1/sources.b64.[0-9] | base64 -d | xz -d | tar -x
          test "$(ls research/rh/consolidated_v1/src/RHKreinL105Batch[0-9]*.lean | wc -l)" = 133

      - name: Recover compiled 317-module objects from exact successful run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44286595120
          github-token: ${{ github.token }}
          pattern: rhc-*
          merge-multiple: true
          path: ${{ runner.temp }}/rhc

      - name: Verify 317 source hashes and native objects (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          entries=json.loads(Path('research/rh/consolidated_v1/manifest.json').read_text())
          root=Path(os.environ['RUNNER_TEMP'])/'rhc'
          assert len(entries)==317
          actual=list(root.rglob('*.olean'))
          assert len(actual)==317, f'expected 317 olean objects, got {len(actual)}'
          contexts=set()
          for e in entries:
              src=Path(e['path'])
              assert hashlib.sha256(src.read_bytes()).hexdigest()==e['sha256'], f'source mismatch {e["module"]}'
              mod=e['module'].replace('.', '/')+'.olean'
              obj=root/mod
              assert obj.is_file(), f'olean missing {mod}'
              assert hashlib.sha256(obj.read_bytes()).hexdigest()==Path(str(obj)+'.sha256').read_text().strip(), f'binary hash {mod}'
              assert Path(str(obj)+'.source.sha256').read_text().strip()==e['sha256'], f'source stamp {mod}'
              contexts.add(Path(str(obj)+'.context.sha256').read_text().strip())
          assert len(contexts)==1, f'context drift {contexts}'
          print('SOURCE_BOUND_317_OLEANS_VERIFIED')
          PY

      - name: Compile actual global frontier and new consolidated join with Lean trust zero
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$RUNNER_TEMP/rhc:${LEAN_PATH:-}"
          mkdir -p "$RUNNER_TEMP/rhc/AEGISOverlay"
          lake env lean --trust=0 -R "$PWD" -o "$RUNNER_TEMP/rhc/AEGISOverlay/RHGlobalPrimeArchFrontierV1.olean" AEGISOverlay/RHGlobalPrimeArchFrontierV1.lean | tee global-frontier.log
          lake env lean --trust=0 -R "$PWD" -o "$RUNNER_TEMP/rhc/AEGISOverlay/RHGlobalPrimeArchConsolidatedJoinV1.olean" AEGISOverlay/RHGlobalPrimeArchConsolidatedJoinV1.lean | tee global-join.log
          python3 - <<'PY'
          from pathlib import Path
          output=Path('global-join.log').read_text()
          roots=[
            'prime_arch_domination_on_certified_windows',
            'global_prime_arch_iff_remaining_windows',
            'global_prime_arch_iff_riemannHypothesis',
          ]
          for root in roots:
              key=f"'AEGIS.RHGlobalPrimeArchConsolidatedJoinV1.{root}' depends on axioms:"
              assert key in output, f'kernel declaration not audited: {root}'
              after=output.split(key,1)[1]
              atoms=after.split('[',1)[1].split(']',1)[0].replace('\n','')
              used={x.strip() for x in atoms.split(',') if x.strip()}
              assert used <= {'propext','Classical.choice','Quot.sound'}, f'nonstandard axiom in {root}: {used}'
          assert 'sorryAx' not in output
          assert 'error:' not in output
          print('GLOBAL_WEIL_CONSOLIDATED_JOIN_KERNEL_PASS_3_OF_3')
          PY

      - name: Preserve kernel audit log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-global-prime-arch-consolidated-join-v1-log
          path: |
            global-frontier.log
            global-join.log
          if-no-files-found: warn
          retention-days: 30