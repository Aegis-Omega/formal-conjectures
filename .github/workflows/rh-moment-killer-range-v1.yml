name: RH moment-killer range V1

# Compiles AegisRH/PR606/WeilMomentKillerConstructionV1.lean and WeilMomentKillerRangeV1.lean from
# source against the pinned Mathlib, with warnings as errors, and fails unless both range theorems
# depend on exactly propext, Classical.choice and Quot.sound. Not RH.

on:
  pull_request:
    paths:
      - .github/workflows/rh-moment-killer-range-v1.yml
      - AegisRH/PR606/WeilMomentKillerConstructionV1.lean
      - AegisRH/PR606/WeilMomentKillerRangeV1.lean
  workflow_dispatch:

concurrency:
  group: rh-moment-killer-range-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -F "$MATHLIB_SHA" lake-manifest.json

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      - name: Compile from source and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          D=AegisRH/PR606
          if grep -nE '\bsorry\b|\badmit\b|^axiom ' "$D/WeilMomentKillerRangeV1.lean"; then exit 1; fi
          out="$RUNNER_TEMP/mkr"; mkdir -p "$out"
          export LEAN_PATH="$out:$(lake env printenv LEAN_PATH)"
          lean -DwarningAsError=true -o "$out/WeilMomentKillerConstructionV1.olean" \
            "$D/WeilMomentKillerConstructionV1.lean" > construction.log 2>&1 || { cat construction.log; exit 1; }
          lean -DwarningAsError=true -o "$out/WeilMomentKillerRangeV1.olean" \
            "$D/WeilMomentKillerRangeV1.lean" > range.log 2>&1 || { cat range.log; exit 1; }
          cat range.log
          python3 - <<'PY'
          import re, sys
          log = open('range.log').read()
          want = {'propext', 'Classical.choice', 'Quot.sound'}
          for t in ('exists_momentKiller_eq_of_vanish', 'exists_momentKiller_eq'):
              m = re.search(r"'AEGIS\.WeilMomentKillerRangeV1\." + t + r"' depends on axioms: \[([^\]]*)\]", log)
              got = {a.strip() for a in m.group(1).split(',')} if m else None
              if got != want:
                  sys.exit(f'AXIOM_AUDIT_FAIL {t} {got}')
          print('MOMENT_KILLER_RANGE_PASS')
          PY
