name: AEGIS RH Gap Ten Shift Exact Replay

on:
  push:
    branches:
      - 'evidence/rh-gap10-shift-8ac-replay-v1'
    paths:
      - '.github/workflows/rh-gap10-shift-8ac-replay.yml'
  pull_request:
    paths:
      - '.github/workflows/rh-gap10-shift-8ac-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 8ac133a165f6d9da7a306d9b9840711cffa80ff2
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  TARGET: RHGapTenShiftTransportV1

jobs:
  verify:
    name: exact-head rational gap-ten replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source and compute local closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p evidence .lake/build/lib/lean
          python3 - "$ROOT" "$TARGET" evidence/modules.txt <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); target=sys.argv[2]; out=pathlib.Path(sys.argv[3])
          mods={p.stem:p for p in root.glob("*.lean")}
          deps={}
          for m,p in mods.items():
              ds=[]
              for line in p.read_text(encoding="utf-8").splitlines():
                  s=line.strip()
                  if not s.startswith("import "): continue
                  for token in s[len("import "):].split():
                      local=token.split(".")[0]
                      if local in mods: ds.append(local)
              deps[m]=ds
          seen=set(); active=set(); order=[]
          def visit(m):
              if m in seen: return
              if m in active: raise SystemExit("cycle:"+m)
              if m not in mods: raise SystemExit("missing:"+m)
              active.add(m)
              for d in deps[m]: visit(d)
              active.remove(m); seen.add(m); order.append(m)
          visit(target)
          out.write_text("\n".join(order)+"\n")
          print("LOCAL_CLOSURE_COUNT",len(order))
          print("\n".join(order))
          PY
          : > evidence/source-sha256.log
          while IFS= read -r m; do
            cp "$ROOT/$m.lean" "$m.lean"
            sha256sum "$m.lean" >> evidence/source-sha256.log
          done < evidence/modules.txt

      - name: Obtain exact Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version | tee evidence/lean-version.log

      - name: Compile exact local closure
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r m; do
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 |
              tee "evidence/$m.log"
          done < evidence/modules.txt

      - name: Audit gap-ten shift axioms
        shell: bash
        run: |
          set -euo pipefail
          cat > RHGapTenShiftTransportAudit.lean <<'LEAN'
          import RHGapTenShiftTransportV1
          #print axioms AEGIS.RHGapTenShiftTransportV1.qNineShift_gap_ten_eq_v1
          #print axioms AEGIS.RHGapTenShiftTransportV1.shift_gap_ten_B_norm_v1
          #print axioms AEGIS.RHGapTenShiftTransportV1.canonical_endpoint_gap_ten_B_norm_v1
          LEAN
          lake env lean RHGapTenShiftTransportAudit.lean 2>&1 | tee evidence/axioms.log
          ! grep -F 'sorryAx' evidence/axioms.log

      - name: Emit bounded disposition
        if: always()
        shell: bash
        run: |
          count="$(wc -l < evidence/modules.txt 2>/dev/null || echo 0)"
          cat > evidence/DISPOSITION.txt <<EOF
          SOURCE_SHA=$SOURCE_SHA
          TARGET=$TARGET
          MODULE_COUNT=$count
          SPACING_BASE=33/16
          TARGET_GAP=10
          TARGET_SHIFT_TRANSPORT=ALL_I
          PRIME_SAMPLE=1399
          PRIME_BOUND=8/37
          ARCH_BOUND=1/100
          B_NORM_BOUND=837/3700
          ELEVEN_PACKET=NOT_PROVEN
          RH=NOT_PROVEN
          AUTHORITY_EFFECT=NONE
          EOF

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-gap10-shift-8ac-exact-replay
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
