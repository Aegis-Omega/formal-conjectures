name: AEGIS RH Eleven Block Bridge Exact Replay

on:
  push:
    branches:
      - 'evidence/rh-eleven-block-bridge-4d83-replay-v1'
    paths:
      - '.github/workflows/rh-eleven-block-bridge-4d83-replay.yml'
  pull_request:
    paths:
      - '.github/workflows/rh-eleven-block-bridge-4d83-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 2b9da4e3a4029c7eca3cc3f0db88831c01743eca
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  verify:
    name: exact eleven-block conditional bridge replay
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          mkdir -p evidence .lake/build/lib/lean
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          cp "$ROOT/RHElevenBlockComparisonV1.lean" .
          cp "$ROOT/RHElevenBlockActualBridgeV1.lean" .
          sha256sum RHElevenBlockComparisonV1.lean RHElevenBlockActualBridgeV1.lean             | tee evidence/source-sha256.log

      - name: Obtain exact Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version | tee evidence/lean-version.log

      - name: Compile exact bridge chain
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -o ".lake/build/lib/lean/RHElevenBlockComparisonV1.olean"             RHElevenBlockComparisonV1.lean 2>&1 | tee evidence/comparison.log
          lake env lean -o ".lake/build/lib/lean/RHElevenBlockActualBridgeV1.olean"             RHElevenBlockActualBridgeV1.lean 2>&1 | tee evidence/bridge.log

      - name: Audit axioms
        shell: bash
        run: |
          set -euo pipefail
          cat > RHElevenBlockBridgeAudit.lean <<'LEAN'
          import RHElevenBlockActualBridgeV1
          #print axioms AEGIS.RHElevenBlockComparisonV1.diagonal_5671_over_3200_margin_eleven_v1
          #print axioms AEGIS.RHElevenBlockActualBridgeV1.pair_re_le_eleven_v1
          #print axioms AEGIS.RHElevenBlockActualBridgeV1.eleven_value_bound_v1
          LEAN
          lake env lean RHElevenBlockBridgeAudit.lean 2>&1 | tee evidence/axioms.log
          ! grep -F 'sorryAx' evidence/axioms.log

      - name: Emit bounded disposition
        shell: bash
        run: |
          cat > evidence/DISPOSITION.txt <<EOF
          SOURCE_SHA=$SOURCE_SHA
          PRODUCER=RHElevenBlockActualBridgeV1
          DIAGONAL=5671/3200
          GAPS_1_8=1/100
          GAP_9=57/100
          GAP_10=837/3700
          MARGIN=106083/118400
          CONCRETE_ELEVEN_PACKET=NOT_PROVEN
          RH=NOT_PROVEN
          AUTHORITY_EFFECT=NONE
          EOF

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-eleven-block-bridge-4d83-exact-replay
          path: evidence/
          if-no-files-found: error
          retention-days: 30
