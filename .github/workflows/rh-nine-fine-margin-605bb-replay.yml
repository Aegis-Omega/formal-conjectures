name: AEGIS RH Fine Nine Packet Exact Replay

on:
  push:
    branches:
      - 'evidence/rh-nine-fine-margin-605bb-replay-v1'
    paths:
      - '.github/workflows/rh-nine-fine-margin-605bb-replay.yml'
  pull_request:
    paths:
      - '.github/workflows/rh-nine-fine-margin-605bb-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-nine-fine-margin-605bb-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  SOURCE_SHA: 9768a496f4fb489045226f4c5ebb8af8f29e9a33
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  verify:
    name: exact-head nine-packet prime-window replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source and module inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p evidence .lake/build/lib/lean
          modules=(
            WeilCriterionCompactSmoothV1
            WeilPrimeSummabilityV1
            WeilArchimedeanConvergenceV1
            WeilAutocorrelationRealityV1
            WeilAutocorrelationClosureV1
            WeilFiniteSourceCalculusV1
            WeilArchSineKernelV1
            WeilArchSineKernelIntegerV1
            WeilArchFiniteQuadraticV1
            WeilArchTailIntegralV1
            WeilThreeBlockRationalV1
            WeilMixedClosureV2
            WeilThreeBlockComplexV2
            WeilMixedAlgebraV2
            WeilDisjointEnergyV2
            WeilThreeBlockAnalyticConstantsV21
            WeilLogCoordinateIsometryV21
            WeilThreeBlockNormBridgeV21
            WeilThreeBlockTranslatedPacketsV22
            WeilWidthPrimeVanishingV23
            WeilDiagonalKernelReductionV21
            WeilArchimedeanCothTailV1
            WeilWidthDiagonalArchFrontierV24
            WeilWidthArchCorrelationV25
            WeilWidthArchBudgetV26
            WeilWidthArchIntegralV27
            WeilThreeBlockCrossPrimeV28
            WeilThreeBlockCrossPrimeWindowV29
            WeilThreeBlockPrimeEvaluationV30
            WeilThreeBlockCrossAssemblyV30
            WeilSeparatedArchBridgeV31
            RHNarrowDiagonalUpgradeV2
            WeilMomentKillerConstructionV1
            WeilLogTransportCanonicalV1
            RHFineMomentPacketV3
            RHRationalNinePacketPrimeWindowV1
            RHNineBlockComparisonV1
            RHNineBlockActualBridgeV1
            RHNineBlockActualExpansionV1
            RHRationalNinePacketConcreteV1
            RHFineDiagonalUpgradeV3
            RHFineNinePacketCoercivityV1
          )
          : > evidence/modules.txt
          : > evidence/exact-source.log
          for m in "${modules[@]}"; do
            test -f "$ROOT/$m.lean"
            cp "$ROOT/$m.lean" "$m.lean"
            sha256sum "$m.lean" >> evidence/exact-source.log
            echo "$m" >> evidence/modules.txt
          done
          printf 'SOURCE_SHA=%s\nMATHLIB_SHA=%s\nLEAN_TOOLCHAIN=%s\nMODULE_COUNT=%s\n'             "$SOURCE_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN" "${#modules[@]}" >> evidence/exact-source.log

      - name: Obtain exact Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version | tee evidence/lean-version.log

      - name: Compile exact producer chain
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r m; do
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 |
              tee "evidence/$m.log"
          done < evidence/modules.txt

      - name: Audit exact fine-nine-packet axioms
        shell: bash
        run: |
          set -euo pipefail
          cat > RHFineNinePacketAudit.lean <<'LEAN'
          import RHFineNinePacketCoercivityV1
          #print axioms AEGIS.RHFineNinePacketCoercivityV1.nine_value_bound_fine_v1
          #print axioms AEGIS.RHFineNinePacketCoercivityV1.actual_nine_block_bound_fine_v1
          #print axioms AEGIS.RHFineNinePacketCoercivityV1.translated_fine_diagonal_v1
          #print axioms AEGIS.RHFineNinePacketCoercivityV1.nine_packet_coercive_fine_v1
          #print axioms AEGIS.RHFineNinePacketCoercivityV1.canonical_nine_packet_coercive_fine_v1
          #print axioms AEGIS.RHFineNinePacketCoercivityV1.canonical_nine_packet_sign_fine_v1
          LEAN
          lake env lean RHFineNinePacketAudit.lean 2>&1 | tee evidence/fine-nine-packet-axioms.log
          ! grep -F 'sorryAx' evidence/fine-nine-packet-axioms.log

      - name: Emit exact replay disposition
        if: always()
        shell: bash
        run: |
          cat > evidence/DISPOSITION.txt <<EOF
          SOURCE_SHA=$SOURCE_SHA
          MODULE_COUNT=42
          PRODUCER=RHFineNinePacketCoercivityV1
          SUPPORT_RADIUS=1/256
          CORRELATION_RADIUS=1/128
          TARGET_MARGIN=1083/640
          PARENT_FINE_DIAGONAL_HEAD=ca24dfa466d5d4c5eaec1b269f2f0a21a64a5c5c
          UNIVERSAL_FINAL_SIGN=NOT_CLAIMED
          RH=NOT_PROVEN
          AUTHORITY_EFFECT=NONE
          EOF

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-nine-fine-margin-605bb-exact-replay
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
