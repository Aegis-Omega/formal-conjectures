name: AEGIS Digamma Closure Probe

on:
  push:
    branches:
      - 'proof/riemann-hypothesis-aegis-v1'
    paths:
      - '.github/workflows/aegis-digamma-probe.yml'
      - '.github/workflows/aegis-rh-fork-replay-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_SHA: 1bdc7abc06d44f39f1379503caabf7e66a708956

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact AEGIS head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          persist-credentials: false

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Apply standalone compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          P=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilDigammaSeriesRealV1.lean"
          python3 - "$P" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text(); original=s
          anchor="import Mathlib.MeasureTheory.Integral.Bochner.Basic\n"
          if anchor not in s:
              s=s.replace("import Mathlib.Analysis.SpecialFunctions.Log.Deriv\n",
                          "import Mathlib.Analysis.SpecialFunctions.Log.Deriv\n"+anchor,1)
          s=s.replace("exact norm_integral_le_integral_norm _",
                      "exact MeasureTheory.norm_integral_le_integral_norm _",1)
          s=s.replace("(deriv (Real.log ∘ Real.Gamma) x : ℂ)",
                      "((deriv (Real.log ∘ Real.Gamma) x : ℝ) : ℂ)",1)
          s=s.replace("(deriv Real.Gamma x : ℂ)",
                      "((deriv Real.Gamma x : ℝ) : ℂ)",1)
          old="have hmnonpos : -(m : ℝ) ≤ 0 := by positivity"
          assert s.count(old)==6, s.count(old)
          s=s.replace(old,"have hmnonpos : -(m : ℝ) ≤ 0 := neg_nonpos.mpr (Nat.cast_nonneg m)")
          assert s.count("← deriv_log,")==1
          s=s.replace("← deriv_log,","← Real.deriv_log y,",1)
          s=s.replace("differentiableAt_log hy.ne'","Real.differentiableAt_log hy.ne'")
          s=s.replace("Real.deriv.log hGreal hGne","deriv.log hGreal hGne")
          assert s.count("\n  push_cast\n") == 1
          s=s.replace("\n  push_cast\n","\n  push_cast\n  rfl\n",1)
          assert s.count("          push_cast\n") == 1
          s=s.replace("          push_cast\n","          push_cast\n          rfl\n",1)
          assert s != original
          p.write_text(s)
          PY

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Compile digamma dependency closure
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/aegis-digamma"
          mkdir -p "$OUT"
          python3 - "$SRC" "$GITHUB_WORKSPACE/.digamma-order.txt" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          target='WeilDigammaSeriesRealV1'
          mods={p.stem:p for p in src.glob('*.lean')}
          deps={}
          for m,p in mods.items():
              ds=[]
              for line in p.read_text().splitlines():
                  s=line.strip()
                  if s.startswith('import '):
                      for tok in s[7:].split():
                          root=tok.split('.')[0]
                          if root in mods: ds.append(root)
              deps[m]=ds
          seen=set(); temp=set(); order=[]
          def visit(m):
              if m in seen: return
              if m in temp: raise SystemExit('cycle:'+m)
              temp.add(m)
              for d in deps[m]: visit(d)
              temp.remove(m); seen.add(m); order.append(m)
          visit(target)
          out.write_text('\n'.join(order)+'\n')
          print('DIGAMMA_CLOSURE_COUNT',len(order))
          print('\n'.join(order))
          PY
          BASE_LEAN_PATH="$(lake env printenv LEAN_PATH)"
          export LEAN_PATH="$OUT:$SRC:$BASE_LEAN_PATH"
          while IFS= read -r MOD; do
            [ -z "$MOD" ] && continue
            echo "=== COMPILE $MOD ==="
            lean -o "$OUT/$MOD.olean" "$SRC/$MOD.lean"
          done < "$GITHUB_WORKSPACE/.digamma-order.txt"
