name: RH critical line v1

on:
  pull_request:
    paths:
      - 'research/rh/critical_line_v1/**'
      - '.github/workflows/rh-critical-line-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  critical-line:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"

      # Mathlib only: no external repositories, no edits to the build directory.
      # The three p = 192 check modules are independent and compile in parallel.
      - name: Compile the critical-line modules
        shell: bash
        run: |
          set -euo pipefail
          dir=research/rh/critical_line_v1
          out="$RUNNER_TEMP/clbuild"
          mkdir -p "$out" logs
          run() {
            lake env bash -c "LEAN_PATH=$out:\$LEAN_PATH lean -R $dir -o $out/$1.olean $dir/$1.lean" \
              > "logs/$1.log" 2>&1 || { cat "logs/$1.log"; return 1; }
          }
          for m in RHCriticalLineSignV1 RHRiemannThetaFormulaV1 RHLambdaLineV1 RHFixIntervalV1 \
                   RHThetaTailV1 RHMellinThreeTermsV1 RHCellBinomialV1 RHCellMomentsV1 RHPi40V1 RHPi80V1 \
                   RHExpEnclosureV1 RHLambdaCheckV1 RHCheckSoundV1 RHCheckLoopV1 RHCellSplitV1 \
                   RHFirstZeroV1 RHXiSignV1; do
            run "$m"
          done
          run RHZeroChecksAV1 & a=$!
          run RHZeroChecksBV1 & b=$!
          run RHZeroChecksCV1 & c=$!
          run RHSecondZeroV1
          run RHThirdZeroV1
          wait "$a"; wait "$b"; wait "$c"
          run RHNineZerosV1
          for m in RHCriticalLineSignV1 RHRiemannThetaFormulaV1 RHLambdaLineV1 RHFixIntervalV1 \
                   RHThetaTailV1 RHMellinThreeTermsV1 RHCellBinomialV1 RHCellMomentsV1 RHPi40V1 RHPi80V1 \
                   RHExpEnclosureV1 RHLambdaCheckV1 RHCheckSoundV1 RHCheckLoopV1 RHCellSplitV1 \
                   RHFirstZeroV1 RHXiSignV1 RHZeroChecksAV1 RHZeroChecksBV1 RHZeroChecksCV1 \
                   RHSecondZeroV1 RHThirdZeroV1 RHNineZerosV1; do
            echo "== $m"; cat "logs/$m.log"
          done > critical-line.log

      - name: Audit axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -F 'error:' critical-line.log; then exit 1; fi
          python3 - <<'PY'
          import re
          log = open('critical-line.log').read()
          lines = re.findall(r"depends on axioms: \[([^\]]*)\]", log)
          assert len(lines) >= 43, f"expected >= 43 axiom reports, got {len(lines)}"
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          for l in lines:
              ax = {a.strip() for a in l.split(',') if a.strip()}
              assert ax <= allowed, f"non-standard axioms: {ax - allowed}"
          assert "'AEGIS.RHFirstZeroV1.first_zero' depends on axioms: [propext, Classical.choice, Quot.sound]" in log
          assert "'AEGIS.RHSecondZeroV1.two_zeros' depends on axioms: [propext, Classical.choice, Quot.sound]" in log
          assert "'AEGIS.RHThirdZeroV1.three_zeros' depends on axioms: [propext, Classical.choice, Quot.sound]" in log
          assert "'AEGIS.RHNineZerosV1.nine_zeros' depends on axioms: [propext, Classical.choice, Quot.sound]" in log
          print(f"{len(lines)} theorems, all within {sorted(allowed)}")
          PY

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-critical-line-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            critical-line.log
            logs/
