name: RH Feshbach Schur lower bound V1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - 'proof/rh-feshbach-schur-v1'
    paths:
      - 'research/rh/feshbach_lean_v1/**'
      - 'research/rh/feasibility_v1/**'
      - '.github/workflows/rh-feshbach-schur-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2
  # Kernel-checked trigram closure (145 modules) from PR #89 run 39025722874, stage 7.
  CHECKPOINT_RUN_ID: '39025722874'
  CHECKPOINT_HEAD: 731727bcf8095e87c0efb6824e9bdf5b8d39ac6e

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -F "$MATHLIB_SHA" lake-manifest.json
          ! grep -rn -E '\bsorry\b|\badmit\b|^axiom ' research/rh/feshbach_lean_v1 research/rh/feasibility_v1 --include='*.lean'
          test "$(git hash-object research/rh/critical_line_v1/RHFixIntervalV1.lean)" = 0ee94b9be264c170986500bc95598eb5a7e365f6

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lean --version

      - name: Compile and audit Feshbach lower bound
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/.lake/feshbach"
          mkdir -p "$OUT"
          lake env lean -DwarningAsError=true -o "$OUT/CvSResidualCertificateV1.olean" research/rh/feshbach_lean_v1/CvSResidualCertificateV1.lean 2>&1 | tee residual.log
          lake env lean -DwarningAsError=true research/rh/feasibility_v1/SignedCliqueObstruction.lean 2>&1 | tee pilots.log
          lake env lean -DwarningAsError=true research/rh/feasibility_v1/ReciprocalPairObstruction.lean 2>&1 | tee -a pilots.log
          lake env lean -o "$OUT/FeshbachSchurV1.olean" research/rh/feshbach_lean_v1/FeshbachSchurV1.lean 2>&1 | tee feshbach.log
          export LEAN_PATH="$OUT:$(lake env printenv LEAN_PATH)"
          lean -DwarningAsError=true research/rh/feshbach_lean_v1/tests/CvSResidualCertificateTestV1.lean
          lean -o "$OUT/FeshbachSchurHermitianV1.olean" research/rh/feshbach_lean_v1/FeshbachSchurHermitianV1.lean 2>&1 | tee -a feshbach.log
          lean research/rh/feshbach_lean_v1/FeshbachComplementV1.lean 2>&1 | tee -a feshbach.log
          lean -o "$OUT/CvSPrimeBlockV1.olean" research/rh/feshbach_lean_v1/CvSPrimeBlockV1.lean 2>&1 | tee -a feshbach.log
          lean research/rh/feshbach_lean_v1/CvSMomentV1.lean 2>&1 | tee -a feshbach.log
          lean -o "$OUT/CvSArchLorentzV1.olean" research/rh/feshbach_lean_v1/CvSArchLorentzV1.lean 2>&1 | tee -a feshbach.log
          lean -o "$OUT/CvSArchSourceV1.olean" research/rh/feshbach_lean_v1/CvSArchSourceV1.lean 2>&1 | tee -a feshbach.log
          lean -o "$OUT/CvSArchDiagV1.olean" research/rh/feshbach_lean_v1/CvSArchDiagV1.lean 2>&1 | tee -a feshbach.log
          lean research/rh/feshbach_lean_v1/CvSArchIntegrableV1.lean 2>&1 | tee -a feshbach.log
          lean research/rh/feshbach_lean_v1/CvSMassV1.lean 2>&1 | tee -a feshbach.log
          lean research/rh/feshbach_lean_v1/CvSPrimePairV1.lean 2>&1 | tee -a feshbach.log
          lean -o "$OUT/RHFixIntervalV1.olean" research/rh/critical_line_v1/RHFixIntervalV1.lean 2>&1 | tee -a feshbach.log
          lean -o "$OUT/CvSPackedGramV1.olean" research/rh/feshbach_lean_v1/CvSPackedGramV1.lean 2>&1 | tee -a feshbach.log
          python3 research/rh/feshbach_lean_v1/tools/packed_gram_cert.py 140 1508 > "$RUNNER_TEMP/HilbCert140.lean"
          lean "$RUNNER_TEMP/HilbCert140.lean" 2>&1 | tee -a feshbach.log
          python3 - <<'PY'
          import re
          log = open('feshbach.log').read() + open('residual.log').read() + open('pilots.log').read()
          if 'sorryAx' in log:
              raise SystemExit('SORRY_AXIOM')
          names = ['FeshbachSchurV1.' + n for n in [
              'neg_two_mul_le_of_sq_le', 'feshbach_lower_bound', 'schur_of_matrix',
              'feshbach_lower_bound_hermitian', 'schur_of_matrix_hermitian',
              'cross_term_le', 'hermitian_quadratic_nonneg_of_real_part',
              'norm_inner_sq_le_of_mem_orthogonal', 'slack_le_trace_mul_norm_sq',
              'complement_lower_bound_of_slack', 'feshbach_of_krein_slack']]
          names += ['CvSResidualCertificateV1.' + n for n in [
              'residual_entry_le', 'abs_sub_le_of_enclosure', 'residual_quadratic_le',
              'actual_quadratic_nonneg', 'actual_hermitian_nonneg', 'exists_uniform_shifted_cutoff']]
          names += ['RouteC.SignedCliqueObstruction.' + n for n in [
              'clique_floor_le_weighted_ceiling', 'q16_clique_admission', 'signed_rank_one_nonpositive']]
          names += ['RouteD.' + n for n in [
              'reciprocal_pair_strict_negative', 'reciprocal_pair_nonnegative_iff_unit']]
          names += ['CvSPrimeBlockV1.' + n for n in [
              'trigAtom_mul_conj', 'trigAtom_autocorrelation', 'atom_exp_eq',
              'trigAtom_hermitian_block', 'trigAtom_mul_conj_integrable',
              'trigPoly_autocorrelation', 'trigPoly_autocorrelation_neg', 'trigPoly_prime_block']]
          names += ['CvSMomentV1.' + n for n in [
              'trigAtom_moment', 'trigPoly_moment', 'half_add_ne_zero']]
          names += ['CvSArchLorentzV1.' + n for n in [
              'expAbs_integrable', 'expAbs_fourier', 'lorentz_integrable',
              'expAbs_fourier_integrable', 'lorentz_exp_integral', 'lorentz_cos_integral',
              "sin_int_mul_two_pi'", 'sin_node', 'sin_exp_hasDerivAt', 'sin_exp_integral',
              'lorentz_source', 'lorentz_source_value']]
          names += ['CvSArchSourceV1.' + n for n in [
              'source_identity', 'sourceS_abs_le', 'sq_mul_sourceS_abs_le', 'sourceS_continuous',
              'sourceS_bound', 'sourceS_integrable', 'lorentz_total', 'inv_lorentz_integral',
              'eq_zero_of_abs_le_div', 'sourceS_integral_eq_zero', 'archTerm_split',
              'archTerm_abs_le', 'archTerm_summable', 'archTerm_source_integrable',
              'archTerm_source_integral', 'archTerm_source_norm_integral_le',
              'archTerm_source_summable', 'arch_series_source']]
          names += ['CvSArchDiagV1.' + n for n in [
              'cosT_continuous', 'lorentz_profile', 'integrable_of_bounds', 'archTerm_mul_integrable',
              'archTerm_mul_norm_integral_le', 'archTerm_mul_summable', 'arch_series_generic',
              'diag_hasDerivAt', 'diag_identity', 'diagD_abs_le', 'sq_mul_diagD_abs_le',
              'exp_trig_hasDerivAt', 'diag_exp_integral', 'lorentz_diag', 'eq_of_abs_sub_le_div',
              'diagD_integral', 'archTerm_diag_integral', 'summable_diag_tail', 'arch_series_diag']]
          names += ['CvSArchIntegrableV1.' + n for n in [
              'integrable_tsum_of_summable_integral_norm', 'arch_mul_integrable',
              'arch_mul_sourceS_integrable', 'arch_mul_diagD_integrable']]
          names += ['CvSMassV1.' + n for n in [
              'conjRefl_integrable', 'fourier_conjRefl', 'conv_conjRefl', 'normSq_fourier',
              'autocorr_integrable', 'mass_eq_cos', 'trigPoly_integrable', 'autocorr_trigPoly_eq_zero',
              'cos_autocorr_fold', 'mass_trigPoly']]
          names += ['CvSPrimePairV1.' + n for n in [
              'evenExt_continuous', 'evenExt_eq_indicator', 'evenExt_integrable', 'fourier_evenExt',
              'cosT_bound', 'fourier_evenExt_integrable', 'cos_pairing']]
          names += ['CvSPackedGramV1.' + n for n in [
              'pack_eq', 'packDot_core', 'packDot_eq', 'gramEntry_eq', 'rowErr_eq', 'rowsOk_spec',
              'check_spec', 'quad_lower', 'quad_lower_complex', 'hilbIv_mem', 'hilb8_check',
              'hilbert8_posDef', 'hilb_check']]
          for name in names:
              m = re.search(r"'AEGIS\." + re.escape(name) +
                            r"'\s+depends on axioms:\s*\[([^\]]*)\]", log)
              if not m:
                  raise SystemExit(f'AXIOM_AUDIT_MISSING {name}')
              axioms = {x.strip() for x in m.group(1).split(',') if x.strip()}
              if not axioms <= {'propext', 'Classical.choice', 'Quot.sound'}:
                  raise SystemExit(f'UNEXPECTED_AXIOMS {name}: {sorted(axioms)}')
              print(f'AXIOM_AUDIT_PASS {name}: {sorted(axioms)}')
          PY

  krein-slack:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -F "$MATHLIB_SHA" lake-manifest.json
          test "$(git hash-object research/rh/krein_L105_v1/RHKreinHatAtV1.lean)" = 06c59b97987c5b9745e3989181808e87f704ede4
          if grep -n -E '\bsorry\b|\badmit\b|^axiom ' research/rh/feshbach_lean_v1/KreinSlackV1.lean; then exit 1; fi

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      # Same provider recipe as rh-trigram-exact-head-v1.yml.
      - name: Checkout immutable PR51 source for the pinned provider recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e279d5765b2dc0cb8b4ec4f62b8db96b4dc69121
          path: .baseline
          persist-credentials: false
      - name: Checkout exact external provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          path: .li-provider
          persist-credentials: false
      - name: Restore pinned provider build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li-provider/.lake/build
          key: rh-li-provider-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.LI_CRITERION_SHA }}-${{ env.MATHLIB_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}
      - name: Build pinned LiCriterion/Hadamard provider with the PR53 recipe
        run: python3 research/rh/m8_kernel_v1/replay.py provider

      - name: Download kernel-checked trigram closure checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rh-trigram-stage-7-${{ env.CHECKPOINT_HEAD }}-${{ env.CHECKPOINT_RUN_ID }}
          path: trigram-checkpoint
          run-id: ${{ env.CHECKPOINT_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Validate checkpoint and install its oleans
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path('trigram-checkpoint')
          m = json.loads((root / 'manifest.json').read_text())
          assert m['schema'] == 'aegis.rh.trigram.checkpoint.v1', m['schema']
          assert m['head'] == os.environ['CHECKPOINT_HEAD'], m['head']
          assert m['stage'] == 7 and m['end'] == 145 and len(m['modules']) == 145
          oleans = root / 'oleans'
          expected = set()
          for rec in m['modules']:
              rel = pathlib.Path(*rec['name'].split('.')).with_suffix('.olean')
              f = oleans / rel
              expected.add(rel.as_posix())
              if hashlib.sha256(f.read_bytes()).hexdigest() != rec['olean_sha256'] or f.stat().st_size != rec['bytes']:
                  raise SystemExit(f'CHECKPOINT_OLEAN_MISMATCH {rec["name"]}')
              dest = pathlib.Path('.lake/build/lib/lean') / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(f, dest)
          actual = {p.relative_to(oleans).as_posix() for p in oleans.rglob('*.olean')}
          if actual != expected:
              raise SystemExit('CHECKPOINT_FILE_SET_MISMATCH')
          print('CHECKPOINT_VALIDATED', len(expected))
          PY

      - name: Compile and audit Krein certificate with slack and the archimedean digamma bridge
        shell: bash
        run: |
          set -euo pipefail
          lake env lean -o .lake/build/lib/lean/RHKreinHatAtV1.olean research/rh/krein_L105_v1/RHKreinHatAtV1.lean
          lake env lean research/rh/feshbach_lean_v1/KreinSlackV1.lean 2>&1 | tee slack.log
          lake env lean -o .lake/build/lib/lean/CvSArchLorentzV1.olean research/rh/feshbach_lean_v1/CvSArchLorentzV1.lean
          lake env lean -o .lake/build/lib/lean/CvSArchSourceV1.olean research/rh/feshbach_lean_v1/CvSArchSourceV1.lean
          for m in CvSArchDiagV1 CvSArchIntegrableV1 CvSPrimeBlockV1 CvSMassV1 CvSPrimePairV1; do
            lake env lean -o ".lake/build/lib/lean/$m.olean" "research/rh/feshbach_lean_v1/$m.lean"
          done
          lake env lean -o .lake/build/lib/lean/CvSDigammaSeriesV1.olean research/rh/feshbach_lean_v1/CvSDigammaSeriesV1.lean 2>&1 | tee -a slack.log
          lake env lean research/rh/feshbach_lean_v1/CvSArchDigammaV1.lean 2>&1 | tee -a slack.log
          lake env lean research/rh/feshbach_lean_v1/CvSQuadV1.lean 2>&1 | tee -a slack.log
          python3 - <<'PY'
          import re
          log = open('slack.log').read()
          if 'sorryAx' in log:
              raise SystemExit('SORRY_AXIOM')
          names = ['KreinSlackV1.' + n for n in [
              'actual_margin_with_slack', 'zero_quadratic_margin_with_slack',
              'zero_quadratic_margin_with_slack_from_genuine_certificate',
              'fourier_finset_sum', 'zero_quadratic_margin_with_slack_of_hats']]
          names += ['CvSDigammaSeriesV1.' + n for n in [
              'quarter_re_pos', 'seriesTerm_re', 'seriesTerm_im', 'hplus_eq_tsum', 'half_im_digamma',
              'summable_inv_width', 'hplus_source_integral', 'hplus_diag_integral',
              'hplus_mul_sourceS_integrable', 'hplus_mul_diagD_integrable']]
          names += ['CvSArchDigammaV1.' + n for n in [
              'archSymbol_eq_hplus', 'archSymbol_source_integral', 'archSymbol_diag_integral']]
          names += ['CvSQuadV1.' + n for n in [
              'blockFn_diag', 'blockFn_off', 'cosB_diag', 'cosB_off', 'blockFn_at_L', 'cosB_bounds',
              'cosB_integrable', 'cos_cosB', 'hplus_cosB_integrable', 'hplus_cosB_diag', 'hplus_cosB_off',
              'qsym_cosB_integrable', 'qsym_cosB_integral', 'quad_trigPoly']]
          for name in names:
              m = re.search(r"'AEGIS\." + re.escape(name) +
                            r"'\s+depends on axioms:\s*\[([^\]]*)\]", log)
              if not m:
                  raise SystemExit(f'AXIOM_AUDIT_MISSING {name}')
              axioms = {x.strip() for x in m.group(1).split(',') if x.strip()}
              if not axioms <= {'propext', 'Classical.choice', 'Quot.sound'}:
                  raise SystemExit(f'UNEXPECTED_AXIOMS {name}: {sorted(axioms)}')
              print(f'AXIOM_AUDIT_PASS {name}: {sorted(axioms)}')
          PY

  # krein_ring_v1 (symbol for every window, Krein certificate with slack) compiled from sources,
  # with the PR #693 WeilFixedLine*V10 versions; no checkpoint oleans are used in this job.
  krein-ring:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -F "$MATHLIB_SHA" lake-manifest.json

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      # Same provider recipe as rh-trigram-exact-head-v1.yml.
      - name: Checkout immutable PR51 source for the pinned provider recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e279d5765b2dc0cb8b4ec4f62b8db96b4dc69121
          path: .baseline
          persist-credentials: false
      - name: Checkout exact external provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          path: .li-provider
          persist-credentials: false
      - name: Restore pinned provider build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li-provider/.lake/build
          key: rh-li-provider-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.LI_CRITERION_SHA }}-${{ env.MATHLIB_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}
      - name: Build pinned LiCriterion/Hadamard provider with the PR53 recipe
        run: python3 research/rh/m8_kernel_v1/replay.py provider

      - name: Compile the krein_ring_v1 source closure and the CvS ring bridge
        shell: bash
        run: |
          set -euo pipefail
          RING="$GITHUB_WORKSPACE/.lake/ringout"
          export LEAN_PATH="$RING:$(lake env printenv LEAN_PATH)"
          python3 research/rh/feshbach_lean_v1/tools/build_krein_ring.py \
            research/rh/feshbach_lean_v1/tools/krein_ring_closure.json "$RING" ring.log
          for m in CvSArchLorentzV1 CvSArchSourceV1 CvSArchDiagV1 CvSArchIntegrableV1 CvSPrimeBlockV1 \
                   CvSMassV1 CvSPrimePairV1 CvSDigammaSeriesV1 CvSQuadV1; do
            lean -o "$RING/$m.olean" "research/rh/feshbach_lean_v1/$m.lean" 2>&1 | tee -a ring.log
          done
          lean -o "$RING/CvSRingBridgeV1.olean" research/rh/feshbach_lean_v1/CvSRingBridgeV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSRoughV1.olean" research/rh/feshbach_lean_v1/CvSRoughV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSKreinRoughV1.olean" research/rh/feshbach_lean_v1/CvSKreinRoughV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSPlancherelRoughV1.olean" research/rh/feshbach_lean_v1/CvSPlancherelRoughV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSTraceV1.olean" research/rh/feshbach_lean_v1/CvSTraceV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSFeshbachWindowV1.olean" research/rh/feshbach_lean_v1/CvSFeshbachWindowV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSWindowCertV1.olean" research/rh/feshbach_lean_v1/CvSWindowCertV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSLowBlockDecayV1.olean" research/rh/feshbach_lean_v1/CvSLowBlockDecayV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSMomentBasisV1.olean" research/rh/feshbach_lean_v1/CvSMomentBasisV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSLowBlockMatrixV1.olean" research/rh/feshbach_lean_v1/CvSLowBlockMatrixV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSCrossMatrixV1.olean" research/rh/feshbach_lean_v1/CvSCrossMatrixV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSCrossBoundV1.olean" research/rh/feshbach_lean_v1/CvSCrossBoundV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSFourierIntervalV1.olean" research/rh/feshbach_lean_v1/CvSFourierIntervalV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSCrossCertV1.olean" research/rh/feshbach_lean_v1/CvSCrossCertV1.lean 2>&1 | tee -a ring.log
          lean -DwarningAsError=true -o "$RING/CvSResidualCertificateV1.olean" research/rh/feshbach_lean_v1/CvSResidualCertificateV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSRowTailV1.olean" research/rh/feshbach_lean_v1/CvSRowTailV1.lean 2>&1 | tee -a ring.log
