              json.dumps({'sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'modules':[{'name':name,'path':str(path)} for name,path in order]},indent=2)+'\n')
          print(f'ROOT_SOURCE_CLOSURE_COUNT={len(order)}')
          PY
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess, sys
          STAGE=int(os.environ['TRIGRAM_STAGE'])
          STEP=27
          TOTAL=145
          source_order=pathlib.Path('evidence-trigram/ordered-modules.tsv').read_text().splitlines()
          if len(source_order)!=TOTAL: raise SystemExit(f'IMPORT_CLOSURE_DRIFT {len(source_order)} != {TOTAL}')
          entries=[]
