          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if head!=os.environ['EXPECTED_SOURCE_HEAD']: raise SystemExit('EXACT_HEAD_MISMATCH')
          recipe='research/rh/m8_kernel_v1/replay.py'
          if subprocess.check_output(['git','hash-object',recipe],text=True).strip()!='f9c96beeda7d7f1ed6b1297cb4539495c44bcfbc':
              raise SystemExit('PROVIDER_RECIPE_DRIFT')
          pins=dict(head=head,toolchain=pathlib.Path('lean-toolchain').read_text().strip(),
                    mathlib=os.environ['MATHLIB_SHA'],li_provider=os.environ['LI_CRITERION_SHA'],
                    factorization=os.environ['FACTORIZATION_SOURCE_BLOB'],
                    stage_plan='27x5+3x3+1-v4',source_order=entries)
          if pins['toolchain']!=os.environ['LEAN_TOOLCHAIN']: raise SystemExit('LEAN_TOOLCHAIN_DRIFT')
          if subprocess.check_output(['git','-C','.lake/packages/mathlib','rev-parse','HEAD'],text=True).strip()!=pins['mathlib']:
              raise SystemExit('MATHLIB_PIN_DRIFT')
          canonical=lambda v:json.dumps(v,sort_keys=True,separators=(',',':')).encode()
          plan_root=hashlib.sha256(canonical(pins)).hexdigest()
          checkpoint=pathlib.Path('trigram-checkpoint')
          oleans=checkpoint/'oleans'
          manifest=checkpoint/'manifest.json'
          sha256=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          start=STAGE*STEP if STAGE<5 else 135+(STAGE-5)*3
          stop=min(start+STEP,135) if STAGE<5 else min(start+3,TOTAL)
          records=[]
          if STAGE:
              if not manifest.is_file(): raise SystemExit('CHECKPOINT_MANIFEST_MISSING')
              old=json.loads(manifest.read_text())
              if old.get('schema')!='aegis.rh.trigram.checkpoint.v1' or old.get('plan_sha256')!=plan_root or old.get('end')!=start or old.get('stage')!=STAGE-1:
                  raise SystemExit('CHECKPOINT_IDENTITY_MISMATCH')
