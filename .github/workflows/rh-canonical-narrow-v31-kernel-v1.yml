name: RH canonical narrow witness V31 kernel

on:
  pull_request:
    paths:
      - '.github/workflows/rh-canonical-narrow-v31-kernel-v1.yml'
      - 'research/rh/checkpoints/20261117_signed_fixedwidth_v1/WeilCanonicalNarrowWitnessV1.lean'
      - 'research/rh/checkpoints/20261117_signed_fixedwidth_v1/WeilCanonicalMomentKillerPacketV1.lean'
      - 'research/rh/checkpoints/20261117_signed_fixedwidth_v1/WeilSignedPrimeKernelV1.lean'

permissions:
  contents: read

concurrency:
  group: rh-canonical-narrow-v31-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474

jobs:
  narrow-v31:
    if: github.event.pull_request.number == 92
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Pin exact source and mathlib
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -F "$MATHLIB_SHA" lake-manifest.json
          git diff --exit-code

      - name: Install Lean and exact Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      - name: Build existing V31 imports from source (no substituted stubs)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          BASE=research/rh/checkpoints/20261020_row_budget_bridge/window_l65_source
          python3 "$BASE/plan.py" WeilSeparatedArchBridgeV31 WeilLogTransportCanonicalV1
          python3 -u "$BASE/build.py" "$(pwd)/.lake/build/lib/lean" 1 || {
            cat .lake/real_status.json || true
            for f in .lake/reallogs/*.log; do tail -n 35 "$f"; done
            exit 1
          }

      - name: Compile canonical packet then narrow V31 theorem at trust zero
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          M=research/rh/checkpoints/20261117_signed_fixedwidth_v1
          RING="$(pwd)/.lake/ringout"
          export LEAN_PATH="$RING:$(lake env printenv LEAN_PATH)"
          for mod in WeilCanonicalMomentKillerPacketV1 WeilCanonicalNarrowWitnessV1; do
            if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^axiom ' "$M/$mod.lean"; then exit 1; fi
            lean --trust=0 -DwarningAsError=true -o "$RING/$mod.olean" "$M/$mod.lean" > "$RUNNER_TEMP/$mod.log" 2>&1 || {
              cat "$RUNNER_TEMP/$mod.log"
              exit 1
            }
            cat "$RUNNER_TEMP/$mod.log"
          done
          python3 - <<'PY'
          import os,re
          log=open(os.environ["RUNNER_TEMP"]+"/WeilCanonicalNarrowWitnessV1.log").read()
          allowed={"propext","Classical.choice","Quot.sound"}
          names=["gHalf_moments","gHalf_width","gHalf_ne_zero","gHalf_arch_dyadic"]
          for name in names:
              full="AEGIS.WeilCanonicalNarrowWitnessV1."+name
              match=re.search("'"+re.escape(full)+"' depends on axioms: \\[([^\\]]*)\\]",log)
              if match:
                  actual={x.strip() for x in match.group(1).split(",") if x.strip()}
              elif "'"+full+"' does not depend on any axioms" in log:
                  actual=set()
              else:
                  raise SystemExit("MISSING_AXIOM_AUDIT "+full)
              if not actual.issubset(allowed):
                  raise SystemExit("EXTRA_AXIOMS "+full+" "+str(actual))
          print("AEGIS_NARROW_CANONICAL_V31_KERNEL_T0_PASS",len(names))
          PY

      - name: Replay existing exact signed-prime identity in the Lean kernel
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          M=research/rh/checkpoints/20261117_signed_fixedwidth_v1/WeilSignedPrimeKernelV1.lean
          SOURCE=research/rh/assembly/exact-source-inputs/WeilSignedPrimeKernelV1.lean.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path("research/rh/checkpoints/20261117_signed_fixedwidth_v1/WeilSignedPrimeKernelV1.lean").read_bytes()
          b=Path("research/rh/assembly/exact-source-inputs/WeilSignedPrimeKernelV1.lean.txt").read_bytes()
          if not p.endswith(b):
              raise SystemExit("EXACT_SOURCE_COPY_MISMATCH")
          print("SIGNED_PRIME_EXACT_SOURCE_BYTES_PASS",len(b))
          PY
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^axiom ' "$M"; then exit 1; fi
          export LEAN_PATH="$(pwd)/.lake/ringout:$(lake env printenv LEAN_PATH)"
          lean --trust=0 -DwarningAsError=true -o "$(pwd)/.lake/ringout/WeilSignedPrimeKernelV1.olean" "$M" > "$RUNNER_TEMP/signed-prime-kernel.log" 2>&1 || {
            cat "$RUNNER_TEMP/signed-prime-kernel.log"
            exit 1
          }
          cat "$RUNNER_TEMP/signed-prime-kernel.log"
          python3 - <<'PY'
          import os,re
          log=open(os.environ["RUNNER_TEMP"]+"/signed-prime-kernel.log").read()
          allowed={"propext","Classical.choice","Quot.sound"}
          names=["mixed_translate_exp_eq_v1","prime_term_translate_eq_signed_correlation_v1",
                 "signed_prime_samples_summable_v1","prime_sum_translate_eq_signed_correlation_v1",
                 "continuum_prime_main_term_zero_v1"]
          for name in names:
              full="AEGIS.WeilSignedPrimeKernelV1."+name
              m=re.search("'"+re.escape(full)+"' depends on axioms: \\[([^\\]]*)\\]",log)
              if m:
                  got={x.strip() for x in m.group(1).split(",") if x.strip()}
              elif "'"+full+"' does not depend on any axioms" in log:
                  got=set()
              else:
                  raise SystemExit("MISSING_AXIOM_RECEIPT "+full)
              if not got.issubset(allowed):
                  raise SystemExit("UNEXPECTED_AXIOMS "+full+" "+str(got))
          print("AEGIS_SIGNED_PRIME_SOURCE_KERNEL_T0_PASS",len(names))
          PY
