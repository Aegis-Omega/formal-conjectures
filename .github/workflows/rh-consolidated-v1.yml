name: RH consolidated v1

on:
  pull_request:
    paths:
      - 'research/rh/consolidated_v1/**'
      - 'research/rh/critical_line_v1/**'
      - 'research/rh/krein_L105_v1/**'
      - 'research/rh/krein_reflective_v1/**'
      - 'AegisRH/**'
      - 'AEGISOverlay/**'
      - 'FormalConjectures/Millennium/RHSnowflakeLog23.lean'
      - '.github/workflows/rh-consolidated-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_PROVIDER_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87

jobs:
  consolidated:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The only source outside this repository: the Li criterion / Hadamard library
      # (Apache-2.0) at a fixed commit, with the three-line Mathlib API patch below.
      - name: Checkout Li criterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_PROVIDER_SHA }}
          path: .li
          persist-credentials: false

      - name: Apply the Mathlib API patch to the provider
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .li rev-parse HEAD)" = "$LI_PROVIDER_SHA"
          (cd .li && patch -p0 < ../research/rh/consolidated_v1/li-provider.patch)

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"

      # 177 source files are committed as one xz archive split into ten base64 parts;
      # build.py checks every unpacked file against its SHA-256 in manifest.json.
      - name: Unpack the archived sources
        shell: bash
        run: |
          set -euo pipefail
          cat research/rh/consolidated_v1/sources.b64.[0-9] \
            | base64 -d | xz -d | tar -x
          test "$(ls research/rh/consolidated_v1/src/RHKreinL105Batch[0-9]*.lean | wc -l)" = 133

      # Every module comes from the one file manifest.json names, checked by SHA-256.
      - name: Compile the consolidated development and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env python3 research/rh/consolidated_v1/build.py "$RUNNER_TEMP/rhc" consolidated.log 3

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-consolidated-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: consolidated.log
