# Reuse exactly 314 archived kernel objects, compile ONLY the three missing
# final modules, audit headline axioms. No protected-main or deployment changes.
name: RH final 3 oleans - historical source-bound recovery

on:
  push:
    branches:
      - 'fix/rh-live-evidence-provenance-20261024'
    paths:
      - '.github/workflows/rh-recover-final-oleans-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rh-final-314-to-317-${{ github.sha }}
  cancel-in-progress: false

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_PROVIDER_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87

jobs:
  source-bound-final-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout pinned Li criterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_PROVIDER_SHA }}
          path: .li
          persist-credentials: false

      - name: Verify source and apply pinned provider patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .li rev-parse HEAD)" = "$LI_PROVIDER_SHA"
          test "$(git hash-object research/rh/consolidated_v1/manifest.json)" = "214ecf7be2f62829a42a3991e2ccfddee5a6d7e5"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          (cd .li && patch -p0 < ../research/rh/consolidated_v1/li-provider.patch)

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"

      - name: Unpack source-identical 317-module manifest archive
        shell: bash
        run: |
          set -euo pipefail
          cat research/rh/consolidated_v1/sources.b64.[0-9] | base64 -d | xz -d | tar -x
          test "$(ls research/rh/consolidated_v1/src/RHKreinL105Batch[0-9]*.lean | wc -l)" = 133

      - name: Recover historical native base .olean objects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Aegis-Omega/formal-conjectures
          run-id: 42292998025
          github-token: ${{ github.token }}
          name: rhc-base
          path: ${{ runner.temp }}/rhc

      - name: Recover historical native batch .olean objects
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: Aegis-Omega/formal-conjectures
          run-id: 42292998025
          github-token: ${{ github.token }}
          pattern: rhc-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/rhc

      - name: Verify 314 historical .oleans then kernel-compile the 3 final objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-rhc-final
          lake env python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"rhc"
          manifest=json.loads((root/"research/rh/consolidated_v1/manifest.json").read_text())
          mods={r["module"]:r for r in manifest}
          targets={"RHKreinL105AllV1","RHWindowL105FinalV1","RHConsolidatedV1"}
          if len(mods)!=317 or len(manifest)!=317 or not targets<=mods.keys():
              sys.exit("RHC_MANIFEST_INCOMPLETE")
          for m, r in mods.items():
              source=root/r["path"]
              if hashlib.sha256(source.read_bytes()).hexdigest()!=r["sha256"]:
                  sys.exit("SOURCE_HASH_DRIFT:"+m)
          current={}
          for f in out.rglob("*.olean"):
              rel=f.relative_to(out).as_posix()
              module=rel.removesuffix(".olean").replace("/",".")
              if module in current or module not in mods:
                  sys.exit("UNEXPECTED_OR_DUPLICATE_OLEAN:"+module)
              with f.open("rb") as stream:
                  current[module]=hashlib.file_digest(stream,"sha256").hexdigest()
          if set(current)!=set(mods)-targets:
              sys.exit("HISTORICAL_IMPORT_SET_NOT_314")
          strings=[
              (("oleans/"+m.replace(".","/")+".olean"),h)
              for m,h in current.items()
          ]
          digest=hashlib.sha256("".join(
              f"{h}  {path}\n" for path,h in sorted(strings)
          ).encode()).hexdigest()
          if digest!="ffc4dc21ede33078fa863c373ddbe627d0ab95afec907dec642a03a013fad38d":
              sys.exit("HISTORICAL_314_OLEAN_SHA_MISMATCH:"+digest)
          print("HISTORICAL_NATIVE_314_OLEANS_SOURCE_BOUND",digest,flush=True)
          dep={}
          for m in targets:
              txt=(root/mods[m]["path"]).read_text()
              dep[m]=[d for line in txt.splitlines()
                      for d in (line.split("--",1)[0].strip()[7:].split()
                                if line.split("--",1)[0].strip().startswith("import ")
                                else [])
                      if d in targets]
          seen=set(); active=set(); order=[]
          def visit(m):
              if m in seen:return
              if m in active:sys.exit("FINAL_IMPORT_CYCLE:"+m)
              active.add(m)
              for d in dep[m]:visit(d)
              active.remove(m);seen.add(m);order.append(m)
          for m in sorted(targets):visit(m)
          env=dict(os.environ,LEAN_PATH=str(out)+":"+os.environ.get("LEAN_PATH",""))
          for m in order:
              r=mods[m]
              rel=m.replace(".","/")+".lean"
              if not r["path"].endswith(rel):
                  sys.exit("FINAL_IMPORT_ROOT_MISMATCH:"+m)
              base=r["path"][:-len(rel)] or "."
              obj=out/(m.replace(".","/")+".olean")
              obj.parent.mkdir(parents=True,exist_ok=True)
              obj.unlink(missing_ok=True)
              res=subprocess.run(["lean","--trust=0","-R",base,"-o",str(obj),r["path"]],
                                 env=env,text=True,capture_output=True)
              log=(res.stdout+res.stderr)
              (root/"evidence-rhc-final"/(m+".log")).write_text(log)
              if (res.returncode or not obj.is_file() or not obj.stat().st_size
                  or "sorryAx" in log
                  or re.search(r"declaration[^\n]*uses ['\"]sorry['\"]",log)
                  or re.search(r"(?m)^(?:[^:\n]*:\d+:\d+:\s*)?error:",log)):
                  sys.exit("FINAL_KERNEL_FAILURE:"+m+"\n"+log[-6000:])
              with obj.open("rb") as binary:
                  current[m]=hashlib.file_digest(binary,"sha256").hexdigest()
              print("FINAL_OLEAN_KERNEL_COMPILED",m,current[m],flush=True)
          if set(current)!=set(mods):sys.exit("FINAL_BINARY_SET_INCOMPLETE")
          checks="\n".join(
              f"#print axioms {name}" for name in (
                  "AEGIS.RHConsolidatedV1.rh_iff_all_windows",
                  "AEGIS.RHConsolidatedV1.windows_below_21_40",
                  "AEGIS.RHConsolidatedV1.rh_iff_windows_from_21_40",
                  "AEGIS.RHConsolidatedV1.consolidated"))+"\n"
          audit=root/"evidence-rhc-final/audit.lean"
          audit.write_text("import RHConsolidatedV1\n"+checks)
          chk=subprocess.run(["lean","--trust=0",str(audit)],
                  env=env,text=True,capture_output=True)
          log=chk.stdout+chk.stderr
          (root/"evidence-rhc-final/audit.log").write_text(log)
          reports=re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",log)
          names={x for x,_ in reports}
          names.update(re.findall(r"'([^']+)' does not depend on any axioms",log))
          expected={line.split()[-1] for line in checks.splitlines()}
          if (chk.returncode or names!=expected or "sorryAx" in log or
             any(not set(a.strip() for a in axs.split(",") if a.strip()) <=
                 {"propext","Classical.choice","Quot.sound"} for _,axs in reports)):
              sys.exit("FINAL_AXIOM_AUDIT_FAILED:"+log[-6000:])
          final=out/"rhc-final"
          final.mkdir(exist_ok=True)
          import shutil
          for m in sorted(targets):
              source=out/(m.replace(".","/")+".olean")
              dest=final/source.name
              shutil.copyfile(source,dest)
          receipt={"schema":"aegis.rh.final_native_replay.v1",
              "exact_head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
              "source_manifest_blob":"214ecf7be2f62829a42a3991e2ccfddee5a6d7e5",
              "historical_run_id":42292998025,
              "historical_314_binary_set_sha256":digest,
              "binary_count":len(current),"final_generated":{m:current[m] for m in sorted(targets)},
              "axiom_audit":"STANDARD_AXIOMS_ONLY",
              "rh_unconditional":None,"proof_admission":"NOT_ASSESSED"}
          all_hashes="".join(
              f"{current[m]}  oleans/{m.replace('.','/')}.olean\n"
              for m in sorted(current))
          all_digest=hashlib.sha256(all_hashes.encode()).hexdigest()
          receipt["all_317_binary_set_sha256"]=all_digest
          receipt["source_sha256"]={
              m:mods[m]["sha256"] for m in sorted(targets)}
          receipt["toolchain"]=os.environ["LEAN_TOOLCHAIN"]
          receipt["mathlib_sha"]=os.environ["MATHLIB_SHA"]
          receipt["li_provider_sha"]=os.environ["LI_PROVIDER_SHA"]
          (root/"evidence-rhc-final/oleans-317.sha256").write_text(all_hashes)
          (root/"evidence-rhc-final/receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          (final/"receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("RHC_NATIVE_OLEANS_317_OF_317",receipt["exact_head"],all_digest,flush=True)
          PY

      - name: Archive actual three final .olean objects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rhc-final-native-3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rhc/rhc-final/
            evidence-rhc-final/
          if-no-files-found: warn
          retention-days: 30
