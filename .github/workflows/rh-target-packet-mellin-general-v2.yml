name: RH target packet Mellin general v2

on:
  pull_request:
    paths:
      - 'AEGISOverlay/RHTargetPacketMellinGeneralV2.lean'
      - 'AEGISOverlay/RHNarrowFixedDetectorV1.lean'
      - 'AEGISOverlay/RHNarrowCenteredKernelV1.lean'
      - 'AEGISOverlay/RHNarrowEventualTailV1.lean'
      - '.github/workflows/rh-target-packet-mellin-general-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  AEGIS_SHA: 2c3d041b633147ec97c7ef753aa9d157a47bb9f5
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  target-packet-mellin-general:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked-out head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "EXACT_HEAD_BINDING=$EXPECTED_HEAD"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact LiCriterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          path: .li-provider
          fetch-depth: 1
          persist-credentials: false

      - name: Restore pinned LiCriterion provider build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li-provider/.lake/build
          key: rh-li-provider-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.LI_CRITERION_SHA }}-${{ env.MATHLIB_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}

      - name: Build and stage exact LiCriterion provider
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .li-provider rev-parse HEAD)" = "$LI_CRITERION_SHA"
          test "$(git -C .li-provider hash-object Hadamard/General/Factorization.lean)" = "$FACTORIZATION_SOURCE_BLOB"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path('.li-provider')
          p=root/'lakefile.lean'
          text=p.read_text()
          old=os.environ['LI_CRITERION_ORIGINAL_MATHLIB_SHA']
          new=os.environ['MATHLIB_SHA']
          assert old in text
          p.write_text(text.replace(old,new))
          fp=root/'Hadamard/General/Factorization.lean'
          text=fp.read_text()
          replacements=[
            ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
             'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
            ('have hgz : g z = Q z := ite_eq_left rfl',
             'have hgz : g z = Q z := by simp [g]'),
            ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
             'rw [if_neg heq, hQ_eq_div z (hz heq)]'),
          ]
          for old,new in replacements:
              assert text.count(old)==1
              text=text.replace(old,new)
          fp.write_text(text)
          PY
          rm -f .li-provider/lake-manifest.json
          printf '%s\n' "$LEAN_TOOLCHAIN" > .li-provider/lean-toolchain
          (
            cd .li-provider
            export PATH="$HOME/.elan/bin:$PATH"
            lake update mathlib
            lake exe cache get
            lake build Hadamard.OrderOne.LogDerivMultiplicity Lc.LiCriterion.XiGrowth Lc.LiCriterion.HadamardSummabilityBridge Lc.LiCriterion.HadamardBridge
          )
          cp -R .li-provider/Lc .
          cp -R .li-provider/Hadamard .
          cp -R .li-provider/FunctionsOfOneComplexVariable .
          mkdir -p .lake/build/lib/lean/Lc .lake/build/lib/lean/Hadamard .lake/build/lib/lean/FunctionsOfOneComplexVariable
          cp -R .li-provider/.lake/build/lib/lean/Lc/. .lake/build/lib/lean/Lc/
          cp -R .li-provider/.lake/build/lib/lean/Hadamard/. .lake/build/lib/lean/Hadamard/
          cp -R .li-provider/.lake/build/lib/lean/FunctionsOfOneComplexVariable/. .lake/build/lib/lean/FunctionsOfOneComplexVariable/

      - name: Restore pinned AEGIS Lean closure checkpoint
        id: aegis-closure-checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build/lib/lean/*.olean
          key: rh-aegis-narrow-closure-v1-${{ runner.os }}-lean4331-${{ env.AEGIS_SHA }}-${{ env.MATHLIB_SHA }}-${{ env.LI_CRITERION_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}

      - name: Compile exact AEGIS residue-witness dependency closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$AEGIS_SHA"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          mkdir -p evidence-target-mellin .lake/build/lib/lean
          python3 - "$ROOT" evidence-target-mellin/aegis-modules.txt <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          targets=["RestrictedWeilCriterionResidueCoefficientV11",
                   "WeilMomentAnnihilatorV1",
                   "WeilMellinInversionV1",
                   "RHRestrictedWeilBridgeV13",
                   "WeilZeroKernelHermitianV11",
                   "WeilTwoPointPositivityV1",
                   "WeilWindowExhaustionV1",
                   "RHThreeCellClassV13"]
          mods={p.stem:p for p in root.glob("*.lean")}
          for target in targets:
              if target not in mods:
                  raise SystemExit(f"missing target: {target}")
          deps={}
          for m,p in mods.items():
              ds=[]
              for line in p.read_text(encoding="utf-8").splitlines():
                  s=line.strip()
                  if not s.startswith("import "):
                      continue
                  for token in s[len("import "):].split():
                      local=token.split(".")[0]
                      if local in mods:
                          ds.append(local)
              deps[m]=ds
          seen=set(); active=set(); order=[]
          def visit(m):
              if m in seen: return
              if m in active: raise SystemExit("cycle:"+m)
              active.add(m)
              for d in deps[m]: visit(d)
              active.remove(m); seen.add(m); order.append(m)
          for target in targets: visit(target)
          out.write_text("\n".join(order)+"\n")
          print("NARROW_DETECTOR_AEGIS_CLOSURE_COUNT",len(order))
          print("\n".join(order))
          PY
          while IFS= read -r m; do
            cp "$ROOT/$m.lean" "$m.lean"
            if test -s ".lake/build/lib/lean/$m.olean"; then
              echo "PINNED_AEGIS_OLEAN_RESTORED=$m $AEGIS_SHA" | tee "evidence-target-mellin/source-$m.log"
            else
              lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee "evidence-target-mellin/source-$m.log"
            fi
          done < evidence-target-mellin/aegis-modules.txt
          while IFS= read -r m; do
            test -s ".lake/build/lib/lean/$m.olean" || { echo "AEGIS_OLEAN_MISSING=$m"; exit 1; }
          done < evidence-target-mellin/aegis-modules.txt

      - name: Save pinned AEGIS Lean closure checkpoint
        if: steps.aegis-closure-checkpoint.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build/lib/lean/*.olean
          key: rh-aegis-narrow-closure-v1-${{ runner.os }}-lean4331-${{ env.AEGIS_SHA }}-${{ env.MATHLIB_SHA }}-${{ env.LI_CRITERION_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}

      - name: Compile general target packet Mellin theorem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/AEGISOverlay evidence-target-mellin
          lake env lean -o .lake/build/lib/lean/AEGISOverlay/RHTargetPacketMellinGeneralV2.olean             AEGISOverlay/RHTargetPacketMellinGeneralV2.lean 2>&1 | tee evidence-target-mellin/compile.log
          ! grep -F 'sorryAx' evidence-target-mellin/compile.log
          ! grep -F 'error:' evidence-target-mellin/compile.log
          grep -F 'AEGIS.RHTargetPacketMellinGeneralV2.targetPacket_mellin_general_v2'             evidence-target-mellin/compile.log

      - name: Compile verified overlay dependencies and narrow detector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/AEGISOverlay evidence-target-mellin
          for m in RHGenericSpectralShiftV1 RHCompactMellinEntireV1 RHWeilTiltComplementarityV1 RHDetectingPacketV1 RHDetectingPacketCriterionV1 RHFixedPacketFourPhaseV1 RHNarrowFixedDetectorV1 RHNarrowCenteredKernelV1 RHNarrowEventualTailV1; do
            echo "COMPILE AEGISOverlay/$m"
            lake env lean -o ".lake/build/lib/lean/AEGISOverlay/$m.olean" "AEGISOverlay/$m.lean" 2>&1 | tee "evidence-target-mellin/compile-$m.log"
            ! grep -F 'sorryAx' "evidence-target-mellin/compile-$m.log"
            ! grep -F 'error:' "evidence-target-mellin/compile-$m.log"
          done
          grep -F 'AEGIS.RHNarrowFixedDetectorV1.exists_narrow_fixed_detecting_packet' evidence-target-mellin/compile-RHNarrowFixedDetectorV1.log

      - name: Audit exact narrow detector axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("evidence-target-mellin/compile-RHNarrowFixedDetectorV1.log").read_text()
          expected = {"propext", "Classical.choice", "Quot.sound"}
          theorems = (
              "exists_narrow_complementary_pair",
              "exists_narrow_mellin_detecting_packet",
              "exists_narrow_fixed_detecting_packet",
              "narrowDetectingPacket_moments",
              "narrowDetectingPacket_support",
              "narrowDetectingPacket_detects",
              "narrowDetectingPacket_logWindow",
              "narrowDetectingPacket_arithmetic_nonpositive",
              "narrowDetectingPacket_local_twoPoint_window",
              "narrowDetectingPacket_local_twoPoint_sign",
              "narrowDetectingPacket_local_kernel_norm_bound",
              "narrowDetectingPacket_local_zero_quadratic_nonnegative",
              "narrowDetectingPacket_local_kernel_components",
              "riemannHypothesis_of_narrow_kernel_bound",
              "riemannHypothesis_of_narrow_four_phase_sign",
          )
          for theorem in theorems:
              label = "'AEGIS.RHNarrowFixedDetectorV1." + theorem + "' depends on axioms:"
              pattern = re.escape(label) + r"\s*\[([^\]]*)\]"
              match = re.search(pattern, log, re.DOTALL)
              if match is None:
                  raise SystemExit("AXIOM_ENTRY_MISSING: " + theorem)
              observed = {a.strip() for a in match.group(1).split(",") if a.strip()}
              if observed != expected:
                  raise SystemExit(f"NONSTANDARD_AXIOMS: {theorem}: {sorted(observed)}")
          if "sorryAx" in log or "error:" in log:
              raise SystemExit("LEAN_LOG_ERROR_OR_SORRYAX")
          print("NARROW_DETECTOR_AXIOMS_STANDARD_ONLY=PASS")
          PY

      - name: Audit centered 3/8 kernel axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("evidence-target-mellin/compile-RHNarrowCenteredKernelV1.log").read_text()
          expected = {"propext", "Classical.choice", "Quot.sound"}
          for theorem in (
              "centered_twoPoint_halfWidth",
              "centered_twoPoint_arithmetic_nonpositive",
              "centered_twoPoint_zero_quadratic_nonnegative",
              "centered_kernel_components",
              "centered_kernel_norm_bound",
          ):
              label = "'AEGIS.RHNarrowCenteredKernelV1." + theorem + "' depends on axioms:"
              m = re.search(re.escape(label) + r"\s*\[([^\]]*)\]", log, re.DOTALL)
              if m is None:
                  raise SystemExit("AXIOM_ENTRY_MISSING:" + theorem)
              observed = {s.strip() for s in m.group(1).split(",") if s.strip()}
              if observed != expected:
                  raise SystemExit("NONSTANDARD_AXIOMS:" + theorem + ":" + repr(sorted(observed)))
          if "sorryAx" in log or "error:" in log:
              raise SystemExit("LEAN_ERROR_OR_SORRYAX")
          print("CENTERED_3_8_STANDARD_AXIOMS_ONLY=PASS")
          PY

      - name: Audit exact narrow eventual-tail bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path("evidence-target-mellin/compile-RHNarrowEventualTailV1.log").read_text()
          expected = {"propext", "Classical.choice", "Quot.sound"}
          for thm in (
              "packetKernelBound_of_eventuallyBounded",
              "riemannHypothesis_of_narrow_eventual_bound",
          ):
              label = "'AEGIS.RHNarrowEventualTailV1." + thm + "' depends on axioms:"
              m = re.search(re.escape(label) + r"\s*\[([^\]]*)\]", log, re.DOTALL)
              if m is None: raise SystemExit("MISSING_AX_PRINT: " + thm)
              got = {x.strip() for x in m.group(1).split(",") if x.strip()}
              if got != expected: raise SystemExit("AXIOM_DRIFT: " + thm + ": " + repr(sorted(got)))
          if "sorryAx" in log or "error:" in log: raise SystemExit("LEAN_LOG_ERROR")
          print("NARROW_EVENTUAL_TAIL_AXIOMS_STANDARD_ONLY=PASS")
          PY

      - name: Record exact-head receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > evidence-target-mellin/formal-conjectures-sha.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence-target-mellin/mathlib-sha.txt || true
          lean --version > evidence-target-mellin/lean-version.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-target-packet-mellin-general-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: evidence-target-mellin/
          if-no-files-found: warn
          retention-days: 30
