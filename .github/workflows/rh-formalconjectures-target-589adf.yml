name: AEGIS RH FormalConjectures Target V13 Replay

on:
  push:
    branches:
      - 'evidence/rh-formalconjectures-target-589adf-v1'
    paths:
      - '.github/workflows/rh-formalconjectures-target-589adf.yml'
  pull_request:
    paths:
      - '.github/workflows/rh-formalconjectures-target-589adf.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORMAL_CONJECTURES_SHA: 02da1ad1288b4881ea1f8e575fbe84af7db04364
  AEGIS_SHA: b998c98a356c69abe10e9101ede8841512a1a106
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  AEGIS_TARGET: WeilRHImpliesFinalSignV13
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  verify:
    name: run AEGIS through FormalConjectures RH target
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout exact FormalConjectures fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.FORMAL_CONJECTURES_SHA }}
          persist-credentials: false

      - name: Bind FormalConjectures / Mathlib pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FORMAL_CONJECTURES_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          mkdir -p evidence
          sha256sum FormalConjectures/Millennium/RiemannHypothesis.lean             | tee evidence/formalconjectures-target-sha256.log
          printf 'FORMAL_CONJECTURES_SHA=%s\nAEGIS_SHA=%s\nMATHLIB_SHA=%s\nLEAN_TOOLCHAIN=%s\n'             "$FORMAL_CONJECTURES_SHA" "$AEGIS_SHA" "$MATHLIB_SHA" "$LEAN_TOOLCHAIN"             | tee evidence/pins.txt

      - name: Obtain exact Lean and project cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          lake build FormalConjecturesUtil
          lean --version | tee evidence/lean-version.log
          actual_mathlib="$(git -C .lake/packages/mathlib rev-parse HEAD)"
          test "$actual_mathlib" = "$MATHLIB_SHA"
          printf 'ACTUAL_MATHLIB_SHA=%s\n' "$actual_mathlib" >> evidence/pins.txt

      - name: Bind exact FormalConjectures RH target signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("FormalConjectures/Millennium/RiemannHypothesis.lean")
          s=p.read_text(encoding="utf-8")
          needle="""theorem riemannHypothesis : RiemannHypothesis := by
            sorry"""
          if needle not in s:
              raise SystemExit("exact RH target declaration not found")
          print("FORMAL_CONJECTURES_RH_TARGET_SIGNATURE=RiemannHypothesis")
          print("FORMAL_CONJECTURES_RH_BODY=CURRENTLY_SORRY")
          PY
          cat > FormalConjecturesRHTargetSignature.lean <<'LEAN'
          import Mathlib.NumberTheory.LSeries.RiemannZeta

          namespace FormalConjecturesRHTargetSignature

          #check RiemannHypothesis

          /-- Exact proposition used by
          FormalConjectures/Millennium/RiemannHypothesis.lean at the pinned source. -/
          def ExactRHTargetV1 : Prop := RiemannHypothesis

          theorem exact_target_unfold_v1 :
              ExactRHTargetV1 ↔
                ∀ (s : ℂ), riemannZeta s = 0 →
                  (¬ ∃ n : ℕ, s = -2 * (n + 1)) →
                  s ≠ 1 → s.re = 1 / 2 := by
            rfl

          end FormalConjecturesRHTargetSignature

          #print axioms FormalConjecturesRHTargetSignature.exact_target_unfold_v1
          LEAN
          lake env lean FormalConjecturesRHTargetSignature.lean             2>&1 | tee evidence/formalconjectures-rh-target-signature.log
          ! grep -F 'sorryAx' evidence/formalconjectures-rh-target-signature.log

      - name: Build exact FormalConjectures RH module
        shell: bash
        run: |
          set -euo pipefail
          lake build FormalConjecturesUtil 2>&1 | tee evidence/formalconjectures-util-build.log
          mkdir -p .lake/build/lib/lean/FormalConjectures/Millennium
          lake env lean \
            -o ".lake/build/lib/lean/FormalConjectures/Millennium/RiemannHypothesis.olean" \
            FormalConjectures/Millennium/RiemannHypothesis.lean \
            2>&1 | tee evidence/formalconjectures-rh-module-build.log
          cat > FormalConjecturesRHModuleAudit.lean <<'LEAN'
          import FormalConjectures.Millennium.RiemannHypothesis
          #check RiemannHypothesis.riemannHypothesis
          #print axioms RiemannHypothesis.riemannHypothesis
          LEAN
          lake env lean FormalConjecturesRHModuleAudit.lean \
            2>&1 | tee evidence/formalconjectures-rh-module-axioms.log
          grep -F 'sorryAx' evidence/formalconjectures-rh-module-axioms.log

      - name: Checkout exact AEGIS RH source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Compute AEGIS target closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$AEGIS_SHA"
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          python3 - "$ROOT" "$AEGIS_TARGET" evidence/aegis-modules.txt <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); target=sys.argv[2]; out=pathlib.Path(sys.argv[3])
          mods={p.stem:p for p in root.glob("*.lean")}
          if target not in mods:
              raise SystemExit(f"missing target: {target}")
          deps={}
          for m,p in mods.items():
              ds=[]
              for line in p.read_text(encoding="utf-8").splitlines():
                  s=line.strip()
                  if not s.startswith("import "):
                      continue
                  for token in s[len("import "):].split():
                      local=token.split(".")[0]
                      if local in mods:
                          ds.append(local)
              deps[m]=ds
          seen=set(); active=set(); order=[]
          def visit(m):
              if m in seen: return
              if m in active: raise SystemExit("cycle:"+m)
              active.add(m)
              for d in deps[m]: visit(d)
              active.remove(m); seen.add(m); order.append(m)
          visit(target)
          out.write_text("\n".join(order)+"\n")
          print("AEGIS_LOCAL_CLOSURE_COUNT",len(order))
          print("\n".join(order))
          PY
          mkdir -p .lake/build/lib/lean
          : > evidence/aegis-source-sha256.log
          while IFS= read -r m; do
            cp "$ROOT/$m.lean" "$m.lean"
            sha256sum "$m.lean" >> evidence/aegis-source-sha256.log
          done < evidence/aegis-modules.txt

      - name: Checkout exact LiCriterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          path: .li-provider
          fetch-depth: 1
          persist-credentials: false

      - name: Build exact LiCriterion provider against pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .li-provider rev-parse HEAD)" = "$LI_CRITERION_SHA"
          test "$(git -C .li-provider hash-object Hadamard/General/Factorization.lean)" = "$FACTORIZATION_SOURCE_BLOB"

          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path('.li-provider')
          p=root/'lakefile.lean'
          text=p.read_text()
          old=os.environ['LI_CRITERION_ORIGINAL_MATHLIB_SHA']
          new=os.environ['MATHLIB_SHA']
          assert old in text
          p.write_text(text.replace(old,new))

          fp=root/'Hadamard/General/Factorization.lean'
          text=fp.read_text()
          replacements=[
            ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
             'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
            ('have hgz : g z = Q z := ite_eq_left rfl',
             'have hgz : g z = Q z := by simp [g]'),
            ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
             'rw [if_neg heq, hQ_eq_div z (hz heq)]'),
          ]
          for old,new in replacements:
            assert text.count(old)==1
            text=text.replace(old,new)
          fp.write_text(text)
          PY

          rm -f .li-provider/lake-manifest.json
          printf '%s\n' "$LEAN_TOOLCHAIN" > .li-provider/lean-toolchain
          (
            cd .li-provider
            export PATH="$HOME/.elan/bin:$PATH"
            lake update mathlib
            lake exe cache get
            lake build \
              Hadamard.OrderOne.LogDerivMultiplicity \
              Lc.LiCriterion.XiGrowth \
              Lc.LiCriterion.HadamardSummabilityBridge \
              Lc.LiCriterion.HadamardBridge
          )

          # Make the exact provider source and oleans visible to the FormalConjectures project.
          cp -R .li-provider/Lc .
          cp -R .li-provider/Hadamard .
          cp -R .li-provider/FunctionsOfOneComplexVariable .
          mkdir -p .lake/build/lib/lean/Lc .lake/build/lib/lean/Hadamard \
            .lake/build/lib/lean/FunctionsOfOneComplexVariable
          cp -R .li-provider/.lake/build/lib/lean/Lc/. .lake/build/lib/lean/Lc/
          cp -R .li-provider/.lake/build/lib/lean/Hadamard/. .lake/build/lib/lean/Hadamard/
          cp -R .li-provider/.lake/build/lib/lean/FunctionsOfOneComplexVariable/. \
            .lake/build/lib/lean/FunctionsOfOneComplexVariable/

          {
            printf 'LI_CRITERION_SHA=%s\n' "$LI_CRITERION_SHA"
            printf 'FACTORIZATION_SOURCE_BLOB=%s\n' "$FACTORIZATION_SOURCE_BLOB"
          } >> evidence/pins.txt

      - name: Compile exact AEGIS RH gate closure in FormalConjectures environment
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r m; do
            echo "=== COMPILE $m ==="
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean"               2>&1 | tee "evidence/aegis-$m.log"
          done < evidence/aegis-modules.txt
          cat > AEGISGateAudit.lean <<'LEAN'
          import WeilRHImpliesFinalSignV13
          #check AEGIS.RHMillenniumGateV10.UniversalZeroQuadraticNonnegativeV10
          #check AEGIS.RHRestrictedWeilBridgeV13.final_sign_implies_rh_v13
          #check AEGIS.RHRestrictedWeilBridgeV13.restricted_weil_criterion_kernel_bridge_v13
          #check AEGIS.WeilRHImpliesFinalSignV13.rh_iff_final_sign_v13
          #check AEGIS.WeilRHImpliesFinalSignV13.rh_iff_universal_v13
          #check AEGIS.WeilRHImpliesFinalSignV13.millennium_moment_iff_rh_v13
          #print axioms AEGIS.RHRestrictedWeilBridgeV13.final_sign_implies_rh_v13
          #print axioms AEGIS.RHRestrictedWeilBridgeV13.restricted_weil_criterion_kernel_bridge_v13
          #print axioms AEGIS.WeilRHImpliesFinalSignV13.rh_iff_universal_v13
          #print axioms AEGIS.WeilRHImpliesFinalSignV13.millennium_moment_iff_rh_v13
          LEAN
          lake env lean AEGISGateAudit.lean 2>&1 | tee evidence/aegis-gate-axioms.log
          ! grep -F 'sorryAx' evidence/aegis-gate-axioms.log

      - name: Run exact FormalConjectures RH target through V13 bridge
        shell: bash
        run: |
          set -euo pipefail

          cat > AEGISFormalConjecturesConditionalTarget.lean <<'LEAN'
          import FormalConjectures.Millennium.RiemannHypothesis
          import WeilRHImpliesFinalSignV13

          namespace AEGISFormalConjecturesConditionalTarget

          theorem rh_from_universal_v13
              (hU : AEGIS.RHMillenniumGateV10.UniversalZeroQuadraticNonnegativeV10) :
              RiemannHypothesis :=
            (AEGIS.WeilRHImpliesFinalSignV13.rh_iff_universal_v13).2 hU

          theorem rh_from_final_sign_v13
              (h : AEGIS.RHFinalClosureV1.FinalSignResidualV1) :
              RiemannHypothesis :=
            AEGIS.RHRestrictedWeilBridgeV13.final_sign_implies_rh_v13 h

          end AEGISFormalConjecturesConditionalTarget

          #print axioms AEGISFormalConjecturesConditionalTarget.rh_from_universal_v13
          #print axioms AEGISFormalConjecturesConditionalTarget.rh_from_final_sign_v13
          LEAN

          lake env lean AEGISFormalConjecturesConditionalTarget.lean \
            2>&1 | tee evidence/aegis-formalconjectures-conditional-target.log
          ! grep -F 'sorryAx' evidence/aegis-formalconjectures-conditional-target.log

          cp FormalConjectures/Millennium/RiemannHypothesis.lean \
            evidence/RiemannHypothesis.original.lean
          python3 - <<'PY'
          from pathlib import Path
          p=Path("FormalConjectures/Millennium/RiemannHypothesis.lean")
          s=p.read_text(encoding="utf-8")
          s=s.replace(
              "import FormalConjecturesUtil",
              "import FormalConjecturesUtil\nimport WeilRHImpliesFinalSignV13",
              1,
          )
          old="""theorem riemannHypothesis : RiemannHypothesis := by
            sorry"""
          new="""theorem riemannHypothesis : RiemannHypothesis := by
            apply AEGIS.RHRestrictedWeilBridgeV13.restricted_weil_criterion_kernel_bridge_v13"""
          if old not in s:
              raise SystemExit("pinned RH theorem body not found")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY

          set +e
          lake env lean FormalConjectures/Millennium/RiemannHypothesis.lean \
            > evidence/formalconjectures-rh-v13-direct.log 2>&1
          rc=$?
          set -e

          cat evidence/formalconjectures-rh-v13-direct.log
          test "$rc" -ne 0
          grep -F 'unsolved goals' evidence/formalconjectures-rh-v13-direct.log
          grep -F 'UniversalZeroQuadraticNonnegativeV10' \
            evidence/formalconjectures-rh-v13-direct.log
          ! grep -F 'unknown module' evidence/formalconjectures-rh-v13-direct.log
          ! grep -F 'unknown identifier' evidence/formalconjectures-rh-v13-direct.log

      - name: Run direct Mathlib zero-side target probe
        shell: bash
        run: |
          set -euo pipefail
          cat > AEGISMathlibZeroSideTargetProbe.lean <<'LEAN'
          import FormalConjectures.Millennium.RiemannHypothesis
          import WeilZeroSideIdentificationV1

          namespace AEGISMathlibZeroSideTargetProbe

          theorem riemannHypothesis_zero_side_target_v1 : RiemannHypothesis := by
            apply AEGIS.WeilZeroSideIdentificationV1.all_zeros_critical_implies_rh

          end AEGISMathlibZeroSideTargetProbe
          LEAN

          set +e
          lake env lean AEGISMathlibZeroSideTargetProbe.lean             > evidence/aegis-mathlib-zero-side-probe.log 2>&1
          rc=$?
          set -e

          cat evidence/aegis-mathlib-zero-side-probe.log
          test "$rc" -ne 0
          grep -F 'unsolved goals' evidence/aegis-mathlib-zero-side-probe.log
          grep -F 'WeilNontrivialZeroV1' evidence/aegis-mathlib-zero-side-probe.log
          ! grep -F 'unknown module' evidence/aegis-mathlib-zero-side-probe.log
          ! grep -F 'unknown identifier' evidence/aegis-mathlib-zero-side-probe.log

      - name: Emit exact diagnostic disposition
        if: always()
        shell: bash
        run: |
          if test -f evidence/aegis-modules.txt; then
            count="$(wc -l < evidence/aegis-modules.txt)"
          else
            count=0
          fi
          cat > evidence/DISPOSITION.txt <<EOF
          FORMAL_CONJECTURES_SHA=$FORMAL_CONJECTURES_SHA
          AEGIS_SHA=$AEGIS_SHA
          MATHLIB_SHA=$MATHLIB_SHA
          LEAN_TOOLCHAIN=$LEAN_TOOLCHAIN
          TARGET_FILE=FormalConjectures/Millennium/RiemannHypothesis.lean
          TARGET_THEOREM=RiemannHypothesis.riemannHypothesis
          AEGIS_GATE_TARGET=WeilRHImpliesFinalSignV13
          AEGIS_LOCAL_CLOSURE_COUNT=$count
          FORMAL_CONJECTURES_TARGET_SOURCE_BODY=CURRENTLY_SORRY\n          FORMAL_CONJECTURES_TARGET_SIGNATURE=RiemannHypothesis
          AEGIS_GATE_COMPILED_IN_FORMAL_CONJECTURES_ENV=REQUIRED
          DIRECT_RH_PROBE=EXPECTED_SINGLE_GOAL_UNIVERSAL_ZERO_QUADRATIC_NONNEGATIVITY
          RH_PROVEN=FALSE
          AUTHORITY_EFFECT=NONE
          EOF

      - name: Upload exact target evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-formalconjectures-target-v13
          path: evidence/
          if-no-files-found: error
          retention-days: 30
