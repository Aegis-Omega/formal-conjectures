name: AEGIS RH Small Window Unconditional Exact Replay

on:
  push:
    branches:
      - 'evidence/rh-small-window-unconditional-d9b9-v1'
    paths:
      - '.github/workflows/rh-small-window-unconditional-exact.yml'
  pull_request:
    paths:
      - '.github/workflows/rh-small-window-unconditional-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-small-window-unconditional-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  SOURCE_SHA: d9b9f805acda913e98bed9f8bbfd47c4d83566a7
  PARENT_SHA: 46807c98e13398fa884a399e3559e7a9e7f9d5c5
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1

jobs:
  verify:
    name: exact unconditional narrow-window replay
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: ${{ env.MATHLIB_SHA }}
          persist-credentials: false

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact source lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_SHA"
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C .aegis rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"

      - name: Obtain exact Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lean --version | tee lean-version.log

      - name: Compile exact 35-module local-sign chain
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.aegis/sovereign-omega-v2/formal/bridges/lean
          OUT=.lake/rh-small-window-unconditional
          mkdir -p "$OUT" evidence
          export LEAN_PATH="$GITHUB_WORKSPACE/$OUT:$GITHUB_WORKSPACE/$ROOT:$(lake env printenv LEAN_PATH)"
          modules=(
            WeilCriterionCompactSmoothV1
            WeilPrimeSummabilityV1
            WeilArchimedeanConvergenceV1
            WeilAutocorrelationRealityV1
            WeilAutocorrelationClosureV1
            WeilFiniteSourceCalculusV1
            WeilArchSineKernelV1
            WeilArchSineKernelIntegerV1
            WeilArchFiniteQuadraticV1
            WeilArchTailIntegralV1
            WeilThreeBlockRationalV1
            WeilMixedClosureV2
            WeilThreeBlockComplexV2
            WeilMixedAlgebraV2
            WeilDisjointEnergyV2
            WeilThreeBlockAnalyticConstantsV21
            WeilLogCoordinateIsometryV21
            WeilThreeBlockNormBridgeV21
            WeilThreeBlockTranslatedPacketsV22
            WeilWidthPrimeVanishingV23
            WeilDiagonalKernelReductionV21
            WeilArchimedeanCothTailV1
            WeilWidthDiagonalArchFrontierV24
            WeilWidthArchCorrelationV25
            WeilWidthArchBudgetV26
            WeilWidthArchIntegralV27
            WeilThreeBlockCrossPrimeV28
            WeilThreeBlockCrossPrimeWindowV29
            WeilThreeBlockPrimeEvaluationV30
            WeilThreeBlockCrossAssemblyV30
            WeilSeparatedArchBridgeV31
            RHNarrowDiagonalUpgradeV2
            WeilWindowExhaustionV1
            RHSmallWindowProducerV1
            RHSmallWindowUnconditionalV1
          )
          : > evidence/source-sha256.txt
          for m in "${modules[@]}"; do
            f="$ROOT/$m.lean"
            test -f "$f"
            sha256sum "$f" >> evidence/source-sha256.txt
            echo "=== COMPILE $m ==="
            lean -o "$OUT/$m.olean" "$f" 2>&1 | tee "evidence/$m.log"
          done

      - name: Audit unconditional local-sign theorems
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.aegis/sovereign-omega-v2/formal/bridges/lean"
          OUT="$GITHUB_WORKSPACE/.lake/rh-small-window-unconditional"
          export LEAN_PATH="$OUT:$ROOT:$(lake env printenv LEAN_PATH)"
          cat >/tmp/UnconditionalAudit.lean <<'LEAN'
          import RHSmallWindowUnconditionalV1
          #print axioms AEGIS.RHSmallWindowUnconditionalV1.narrowWindowArithmeticNonpositive_one_over_128_v1
          #print axioms AEGIS.RHSmallWindowUnconditionalV1.localized_packet_diagonal_nonpositive_v1
          #print axioms AEGIS.RHSmallWindowUnconditionalV1.localized_packet_diagonal_coercive_v1
          LEAN
          lean /tmp/UnconditionalAudit.lean 2>&1 | tee evidence/axioms.log
          ! grep -F 'sorryAx' evidence/axioms.log

      - name: Emit disposition
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cat > evidence/DISPOSITION.txt <<EOF
          SOURCE_SHA=$SOURCE_SHA
          PARENT_SHA=$PARENT_SHA
          CLAIM=UNCONDITIONAL_LOCAL_SIGN_RADIUS_1_OVER_128
          MOMENT_PREMISE_REQUIRED=NO
          COERCIVE_MARGIN=32_OVER_25_ENERGY
          ARBITRARY_WINDOW_GROWTH=OPEN
          RH=NOT_CLAIMED
          AUTHORITY_EFFECT=NONE
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-small-window-unconditional-d9b9
          path: |
            evidence/
            lean-version.log
          if-no-files-found: warn
          retention-days: 30
