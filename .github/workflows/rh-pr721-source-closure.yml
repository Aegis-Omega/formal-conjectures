name: RH PR721 exact-source closure and Lean SOS replay
on:
  pull_request:
    paths:
      - 'research/rh/aegis_pr721_fb983fd/**'
      - 'scripts/verify_rh_pr721_source_closure.py'
      - '.github/workflows/rh-pr721-source-closure.yml'
  workflow_dispatch:
# Do not throw away a pinned SOS replay when a different source file changes.
# This serializes overlapping runs without accepting stale source identities.
concurrency:
  group: rh-pr721-source-resume-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
env:
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
jobs:
  source-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify 183 original Git blobs (fail closed)
        run: |
          set -euo pipefail
          python3 scripts/verify_rh_pr721_source_closure.py --out /tmp/pr721-source
          grep -F '"source_identity": "PASS"' /tmp/pr721-source/receipt.json
      - name: Preserve machine-readable source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-pr721-183-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: /tmp/pr721-source/receipt.json
          if-no-files-found: warn
          retention-days: 30
  lean-sos:
    needs: source-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Lean and cached Mathlib
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version
      - name: Compile exact nine/ten/eleven block rational SOS producers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_rh_pr721_source_closure.py --out /tmp/pr721-kernel --compile-smoke
          grep -F '"kernel": "THREE_SOS_MODULES_PASS"' /tmp/pr721-kernel/receipt.json
          echo "PR721_SOURCE=SHA_VERIFIED; THREE_SOS=KERNEL_VERIFIED; RH_ADMISSION_SOURCE=SEPARATE_EXACT_HEAD_CANONICAL_KERNEL_AUDIT"
      - name: Compile original ten/eleven-block complex comparison bridges
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr721-ten-eleven-bridge .lake/build/lib/lean
          python3 - <<'PY'
          import json, pathlib, subprocess
          manifest=json.loads(pathlib.Path(
              'research/rh/aegis_pr721_fb983fd/source_manifest.json').read_text())
          for mod in ('RHTenBlockComparisonV1', 'RHTenBlockActualBridgeV1', 'RHElevenBlockComparisonV1', 'RHElevenBlockActualBridgeV1'):
              matches=[x for x in manifest['files'] if x['module']==mod]
              assert len(matches)==1, 'MISSING_OR_AMBIGUOUS_MODULE '+mod
              item=matches[0]
              src=pathlib.Path(item['archive'])
              assert src.is_file(), 'MISSING_ARCHIVED_SOURCE '+mod
              actual=subprocess.check_output(
                  ['git','hash-object',str(src)],text=True).strip()
              assert actual==item['sha'], 'SOURCE_BLOB_DRIFT '+mod
              dst=pathlib.Path(mod+'.lean')
              assert not dst.exists(), 'MODULE_IDENTITY_COLLISION '+mod
              dst.write_bytes(src.read_bytes())
              print('EXACT_SOURCE',mod,item['sha'],flush=True)
              out=pathlib.Path('.lake/build/lib/lean')/(mod+'.olean')
              log=pathlib.Path('/tmp/pr721-ten-eleven-bridge')/(mod+'.compile.log')
              with log.open('w') as fh:
                  p=subprocess.run(['lake','env','lean','-o',str(out),str(dst)],
                    stdout=fh,stderr=subprocess.STDOUT,text=True)
              print(log.read_text(),flush=True)
              if p.returncode!=0 or not out.is_file():
                  raise RuntimeError('ELEVEN_BRIDGE_LEAN_FAILURE '+mod)
          PY
          for mod in RHTenBlockComparisonV1 RHTenBlockActualBridgeV1 RHElevenBlockComparisonV1 RHElevenBlockActualBridgeV1; do
            python3 scripts/verify_rh_overlay_axioms.py \
              "research/rh/aegis_pr721_fb983fd/lean/$mod.lean.src" \
              "/tmp/pr721-ten-eleven-bridge/$mod.compile.log"
          done
          echo 'PR721_TEN_ELEVEN_COMPARISON_BRIDGES=KERNEL_PASS; RH_ADMISSION_SOURCE=SEPARATE_EXACT_HEAD_CANONICAL_KERNEL_AUDIT'
      - name: Preserve eleven-block complex bridge replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-pr721-ten-eleven-complex-bridges-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: /tmp/pr721-ten-eleven-bridge/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve exact-head evidence and compiler logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-pr721-sos-kernel-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: |
            /tmp/pr721-kernel/receipt.json
            /tmp/pr721-kernel/*.compile.log
          if-no-files-found: warn
          retention-days: 30
