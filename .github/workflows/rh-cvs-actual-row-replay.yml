          names += ['AEGIS.CvSActualRowInputL12V1.sourceZ_mem', 'AEGIS.CvSListIntervalDotV1.listDot_eq_dot', 'AEGIS.CvSListIntervalDotV1.listCongruence_eq', 'AEGIS.CvSListIntervalMixedV1.mixed_listCongruence_eq', 'AEGIS.RowBudgetStagedDotPilot.weighted_column_exact', 'AEGIS.RowBudgetStagedDotPilot.gram_source_dot', 'AEGIS.RowBudgetStagedDotPilot.gram_tau_weighted_dot', 'AEGIS.RowBudgetListCell0Pilot.gram_source_exact', 'AEGIS.RowBudgetListCell0Pilot.gram_weighted_exact', 'AEGIS.RowBudgetListCell0Pilot.stored_cell0_fast', 'AEGIS.RowBudgetListCell0Pilot.original_eq_fast', 'AEGIS.RowBudgetListCell0Pilot.stored_cell0_original', 'AEGIS.CvSColumnEnvelopeV1.envelope_pair_eq', 'AEGIS.CvSFirstColumnCheckerV1.check_sound', 'AEGIS.CvSRelativeRowCertificateL12V1.row_budget_check_true', 'AEGIS.CvSRelativeRowCertificateL12V1.row_budget_margin_positive', 'AEGIS.RowBudgetFirstColumnBatch0.checked', 'AEGIS.RowBudgetFirstColumnBatch0.target_source', 'AEGIS.RowBudgetFirstColumnBatch0.row_order', 'AEGIS.RowBudgetFirstColumnBatch1.checked', 'AEGIS.RowBudgetFirstColumnBatch1.target_source', 'AEGIS.RowBudgetFirstColumnBatch1.row_order', 'AEGIS.RowBudgetFirstColumnBatch2.checked', 'AEGIS.RowBudgetFirstColumnBatch2.target_source', 'AEGIS.RowBudgetFirstColumnBatch2.row_order', 'AEGIS.RowBudgetFirstColumnBatch3.checked', 'AEGIS.RowBudgetFirstColumnBatch3.target_source', 'AEGIS.RowBudgetFirstColumnBatch3.row_order', 'AEGIS.RowBudgetFirstColumnBatch4.checked', 'AEGIS.RowBudgetFirstColumnBatch4.target_source', 'AEGIS.RowBudgetFirstColumnBatch4.row_order', 'AEGIS.RowBudgetFirstColumnBatch5.checked', 'AEGIS.RowBudgetFirstColumnBatch5.target_source', 'AEGIS.RowBudgetFirstColumnBatch5.row_order', 'AEGIS.RowBudgetFirstColumnBatch6.checked', 'AEGIS.RowBudgetFirstColumnBatch6.target_source', 'AEGIS.RowBudgetFirstColumnBatch6.row_order', 'AEGIS.RowBudgetFirstColumnBatch7.checked', 'AEGIS.RowBudgetFirstColumnBatch7.target_source', 'AEGIS.RowBudgetFirstColumnBatch7.row_order', 'AEGIS.RowBudgetFirstColumnBatch8.checked', 'AEGIS.RowBudgetFirstColumnBatch8.target_source', 'AEGIS.RowBudgetFirstColumnBatch8.row_order', 'AEGIS.RowBudgetFirstColumnBatch9.checked', 'AEGIS.RowBudgetFirstColumnBatch9.target_source', 'AEGIS.RowBudgetFirstColumnBatch9.row_order', 'AEGIS.RowBudgetFirstColumnBatch10.checked', 'AEGIS.RowBudgetFirstColumnBatch10.target_source', 'AEGIS.RowBudgetFirstColumnBatch10.row_order', 'AEGIS.RowBudgetFirstColumnBatch11.checked', 'AEGIS.RowBudgetFirstColumnBatch11.target_source', 'AEGIS.RowBudgetFirstColumnBatch11.row_order', 'AEGIS.RowBudgetFirstColumnBatch12.checked', 'AEGIS.RowBudgetFirstColumnBatch12.target_source', 'AEGIS.RowBudgetFirstColumnBatch12.row_order', 'AEGIS.RowBudgetFirstColumnBatch13.checked', 'AEGIS.RowBudgetFirstColumnBatch13.target_source', 'AEGIS.RowBudgetFirstColumnBatch13.row_order', 'AEGIS.RowBudgetFirstColumnV1.checked', 'AEGIS.RowBudgetFirstColumnV1.target_source', 'AEGIS.RowBudgetFirstColumnV1.row_order', 'AEGIS.RowBudgetFirstColumnV1.first_column_contains', 'AEGIS.RowBudgetFirstColumnV1.all_rows_covered', 'AEGIS.RowBudgetFirstColumnV1.first_column_mem', 'AEGIS.CvSFirstColumnRejectV1.reject_missing_weighted', 'AEGIS.CvSFirstColumnRejectV1.reject_zero_target', 'AEGIS.CvSPackedGramV1.quad_lower', 'AEGIS.CvSPackedGramV1.quad_lower_complex']
          allowed = {'propext','Classical.choice','Quot.sound'}
          if re.search(r'sorryAx|\bsorry\b|\badmit\b', log):
            raise SystemExit('SORRYAX_OR_PROOF_HOLE')
          for name in names:
            decl = name
            h = re.search(r"'" + re.escape(decl) + r"' depends on axioms:\s*\[([^]]*)\]", log, re.S)
            h0 = re.search(r"'" + re.escape(decl) + r"' does not depend on any axioms", log)
            if h is None and h0 is None:
              raise SystemExit('MISSING_AXIOM_AUDIT '+decl)
            axioms = {x.strip() for x in h.group(1).split(',') if x.strip()} if h else set()
            if not axioms <= allowed:
              raise SystemExit('UNEXPECTED_AXIOMS '+decl+' '+repr(axioms))
            print('SOURCE_ROW_AXIOM_AUDIT_PASS',decl,sorted(axioms))
          print('ACTUAL_CVS_ROW_SOURCE_REPLAY_PASS; FIRST_COLUMN_OUTPUT_ENTRIES=139; FULL_Q80_ACTUAL_MEMBERSHIP=NOT_YET_PROVED')
          PY

      - name: Preserve exact replay state
        if: always()
        continue-on-error: true
        env:
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        shell: bash
        run: |
          python3 - <<'PY_SNAPSHOT'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          sources = subprocess.check_output(['git', 'ls-files', '--', '*.lean'], text=True).splitlines()
          objects = sorted((root / '.lake/ringout').rglob('*.olean'))
          logs = [root / n for n in ['ring.log', 'actual-row-bridge.log'] if (root / n).is_file()]
          receipt = {
            'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
            'math_step_outcome': os.environ.get('REPLAY_OUTCOME'),
            'lean_toolchain': (root / 'lean-toolchain').read_text().strip(),
            'mathlib_sha': os.environ['MATHLIB_SHA'],
            'li_criterion_sha': os.environ['LI_CRITERION_SHA'],
            'source_sha256': {n: digest(root / n) for n in sources},
            'binary_sha256': {str(p.relative_to(root)): digest(p) for p in objects},
            'log_sha256': {p.name: digest(p) for p in logs},
            'scope': 'Compilation state. Only the named axiom audits in actual-row-bridge.log are certified; failed replay state is evidence, not a PASS.'
          }
          (root / 'SOURCE_CROSS_ROW_CHECKPOINT.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('REPLAY_STATE_PRESERVED', receipt['math_step_outcome'], len(objects))
          PY_SNAPSHOT

      - name: Upload source-bound replay checkpoint
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-cross-row-${{ github.sha }}
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            SOURCE_CROSS_ROW_CHECKPOINT.json
            ring.log
            actual-row-bridge.log
            .lake/ringout/**/*.olean
