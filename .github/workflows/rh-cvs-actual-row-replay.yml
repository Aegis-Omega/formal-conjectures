name: RH CvS Actual Source Row Kernel Replay (isolated)

on:
  push:
    branches:
      - proof/rh-feshbach-schur-v1
    paths:
      - .github/workflows/rh-cvs-actual-row-replay.yml
      - research/rh/checkpoints/20261020_row_budget/CvSActualCrossRowL12V1.lean
      - research/rh/checkpoints/20261020_row_budget_bridge/*.lean
      - research/rh/checkpoints/20261020_row_budget_bridge/list_execution/*.lean
      - research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/*.lean
  workflow_dispatch:

concurrency:
  group: rh-cvs-actual-source-row-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  source-cross-row:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -F "$MATHLIB_SHA" lake-manifest.json

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      # Same provider recipe as rh-trigram-exact-head-v1.yml.
      - name: Checkout immutable PR51 source for the pinned provider recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e279d5765b2dc0cb8b4ec4f62b8db96b4dc69121
          path: .baseline
          persist-credentials: false
      - name: Checkout exact external provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          path: .li-provider
          persist-credentials: false
      - name: Restore pinned provider build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li-provider/.lake/build
          key: rh-li-provider-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.LI_CRITERION_SHA }}-${{ env.MATHLIB_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}
      - name: Build pinned LiCriterion/Hadamard provider with the PR53 recipe
        run: python3 research/rh/m8_kernel_v1/replay.py provider
      - name: Replay unchanged source DAG and actual row bridge
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          RING="$GITHUB_WORKSPACE/.lake/ringout"
          export LEAN_PATH="$RING:$(lake env printenv LEAN_PATH)"
          python3 research/rh/feshbach_lean_v1/tools/build_krein_ring.py \
            research/rh/feshbach_lean_v1/tools/krein_ring_closure.json "$RING" ring.log
          for m in CvSArchLorentzV1 CvSArchSourceV1 CvSArchDiagV1 CvSArchIntegrableV1 CvSPrimeBlockV1 \
                   CvSMassV1 CvSPrimePairV1 CvSDigammaSeriesV1 CvSQuadV1; do
            lean -o "$RING/$m.olean" "research/rh/feshbach_lean_v1/$m.lean" 2>&1 | tee -a ring.log
          done
          lean -o "$RING/CvSRingBridgeV1.olean" research/rh/feshbach_lean_v1/CvSRingBridgeV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSRoughV1.olean" research/rh/feshbach_lean_v1/CvSRoughV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSKreinRoughV1.olean" research/rh/feshbach_lean_v1/CvSKreinRoughV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSPlancherelRoughV1.olean" research/rh/feshbach_lean_v1/CvSPlancherelRoughV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSTraceV1.olean" research/rh/feshbach_lean_v1/CvSTraceV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSFeshbachWindowV1.olean" research/rh/feshbach_lean_v1/CvSFeshbachWindowV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSWindowCertV1.olean" research/rh/feshbach_lean_v1/CvSWindowCertV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSLowBlockDecayV1.olean" research/rh/feshbach_lean_v1/CvSLowBlockDecayV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSMomentBasisV1.olean" research/rh/feshbach_lean_v1/CvSMomentBasisV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSLowBlockMatrixV1.olean" research/rh/feshbach_lean_v1/CvSLowBlockMatrixV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSCrossMatrixV1.olean" research/rh/feshbach_lean_v1/CvSCrossMatrixV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSCrossBoundV1.olean" research/rh/feshbach_lean_v1/CvSCrossBoundV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSFourierIntervalV1.olean" research/rh/feshbach_lean_v1/CvSFourierIntervalV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSCrossCertV1.olean" research/rh/feshbach_lean_v1/CvSCrossCertV1.lean 2>&1 | tee -a ring.log
          lean -DwarningAsError=true -o "$RING/CvSResidualCertificateV1.olean" research/rh/feshbach_lean_v1/CvSResidualCertificateV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSRowTailV1.olean" research/rh/feshbach_lean_v1/CvSRowTailV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSArctanTailV1.olean" research/rh/feshbach_lean_v1/CvSArctanTailV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSTauSourceV1.olean" research/rh/feshbach_lean_v1/CvSTauSourceV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSTauL12V1.olean" research/rh/feshbach_lean_v1/CvSTauL12V1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSTauL12DataV1.olean" research/rh/feshbach_lean_v1/CvSTauL12DataV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSTauPrimeL12V1.olean" research/rh/feshbach_lean_v1/CvSTauPrimeL12V1.lean 2>&1 | tee -a ring.log
          lean -DwarningAsError=true -o "$RING/CvSTauR1SourceL12V1.olean" research/rh/feshbach_lean_v1/CvSTauR1SourceL12V1.lean 2>&1 | tee -a ring.log
          lean -DwarningAsError=true -o "$RING/CvSTauR1PrimeL12V1.olean" research/rh/feshbach_lean_v1/CvSTauR1PrimeL12V1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSDiagTelV1.olean" research/rh/feshbach_lean_v1/CvSDiagTelV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/RHFixIntervalV1.olean" research/rh/critical_line_v1/RHFixIntervalV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSPackedGramV1.olean" research/rh/feshbach_lean_v1/CvSPackedGramV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSDiagL12V1.olean" research/rh/feshbach_lean_v1/CvSDiagL12V1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSProjectedPackedCertificateL12V1.olean" research/rh/feshbach_lean_v1/CvSProjectedPackedCertificateL12V1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSProjectedSymmetryV1.olean" research/rh/feshbach_lean_v1/CvSProjectedSymmetryV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSSchurClosureFromBoundsV1.olean" research/rh/feshbach_lean_v1/CvSSchurClosureFromBoundsV1.lean 2>&1 | tee -a ring.log
          lean -DwarningAsError=true -o "$RING/CvSFiniteCongruenceV1.olean" research/rh/feshbach_lean_v1/CvSFiniteCongruenceV1.lean 2>&1 | tee -a ring.log
          lean -o "$RING/CvSProjectedSchurBridgeL12V1.olean" research/rh/feshbach_lean_v1/CvSProjectedSchurBridgeL12V1.lean 2>&1 | tee -a ring.log
          lean -DwarningAsError=true -o "$RING/CvSProjectedTransportL12V1.olean" research/rh/feshbach_lean_v1/CvSProjectedTransportL12V1.lean 2>&1 | tee -a ring.log
          lean -DwarningAsError=true -o "$RING/CvSActualCrossRowL12V1.olean" research/rh/checkpoints/20261020_row_budget/CvSActualCrossRowL12V1.lean 2>&1 | tee actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSMidpointRadiusV1.olean" research/rh/checkpoints/20261020_row_budget/CvSMidpointRadiusV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSOddSignedEnclosureV1.olean" research/rh/checkpoints/20261020_row_budget_bridge/CvSOddSignedEnclosureV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSRationalIntervalV1.olean" research/rh/checkpoints/20261020_row_budget_bridge/CvSRationalIntervalV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSIntervalMatrixProductV1.olean" research/rh/checkpoints/20261020_row_budget_bridge/CvSIntervalMatrixProductV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSRowBudgetEnvelopeV1.olean" research/rh/checkpoints/20261020_row_budget_bridge/CvSRowBudgetEnvelopeV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSTauSigned150L12V1.olean" research/rh/checkpoints/20261020_row_budget_bridge/CvSTauSigned150L12V1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSIntervalDivideV1.olean" research/rh/checkpoints/20261020_row_budget_bridge/CvSIntervalDivideV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSFrequencyIntervalV1.olean" research/rh/checkpoints/20261020_row_budget_bridge/CvSFrequencyIntervalV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSDividedDifferenceCollectionV1.olean" research/rh/checkpoints/20261019_transport/analytic_bridge/CvSDividedDifferenceCollectionV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSProjectedEntryL12V1.olean" research/rh/feshbach_lean_v1/CvSProjectedEntryL12V1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSGramTailV1.olean" research/rh/feshbach_lean_v1/CvSGramTailV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSActualRowInputL12V1.olean" research/rh/checkpoints/20261020_row_budget_bridge/CvSActualRowInputL12V1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSListIntervalDotV1.olean" research/rh/checkpoints/20261020_row_budget_bridge/list_execution/CvSListIntervalDotV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSListIntervalMixedV1.olean" research/rh/checkpoints/20261020_row_budget_bridge/list_execution/CvSListIntervalMixedV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetStagedDotPilot.olean" research/rh/checkpoints/20261020_row_budget_bridge/RowBudgetStagedDotPilot.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetListCell0Pilot.olean" research/rh/checkpoints/20261020_row_budget_bridge/list_execution/RowBudgetListCell0Pilot.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSColumnEnvelopeV1.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/CvSColumnEnvelopeV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSFirstColumnCheckerV1.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/CvSFirstColumnCheckerV1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/CvSRelativeRowCertificateL12V1.olean" research/rh/checkpoints/20261020_row_budget/CvSRelativeRowCertificateL12V1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch0.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch0.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch1.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch1.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch2.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch2.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch3.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch3.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch4.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch4.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch5.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch5.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch6.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch6.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch7.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch7.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch8.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch8.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch9.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch9.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch10.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch10.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch11.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch11.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch12.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch12.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnBatch13.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnBatch13.lean 2>&1 | tee -a actual-row-bridge.log
          lean -DwarningAsError=true -o "$RING/RowBudgetFirstColumnV1.olean" research/rh/checkpoints/20261020_row_budget_bridge/first_column_execution/RowBudgetFirstColumnV1.lean 2>&1 | tee -a actual-row-bridge.log
