name: RH cofinal actual Schur kernel join

on:
  pull_request:
    paths:
      - 'AEGISOverlay/RHMomentDecayCofinalJoinV1.lean'
      - 'AEGISOverlay/RHCofinalActualTerminalV1.lean'
      - 'AEGISOverlay/RHCofinalSchurAdapterV1.lean'
      - 'AEGISOverlay/RHTargetPacketMellinGeneralV2.lean'
      - 'AEGISOverlay/RHNarrowFixedDetectorV1.lean'
      - 'AEGISOverlay/RHCrossRepositoryFiveSpineV1.lean'
      - 'AEGISOverlay/RHFeshbachWeilClosureV2.lean'
      - 'AEGISOverlay/RHLocalKreinPartitionV1.lean'
      - 'AEGISOverlay/RHKreinMultiplicativeTransportV1.lean'
      - 'AEGISOverlay/RHFiniteActualGramJoinV1.lean'
      - 'AEGISOverlay/RHActualNarrowGramSignV1.lean'
      - 'AEGISOverlay/RHActualLocalGramCoercivityV1.lean'
      - 'AEGISOverlay/RHActualMixedDefectV1.lean'
      - 'AEGISOverlay/RHActualElevenLatticeV1.lean'
      - 'AEGISOverlay/RHFiniteFinePartitionV1.lean'
      - 'AEGISOverlay/RHActualUniversalFineGramV1.lean'
      - 'AEGISOverlay/RHScaleRowCompositionV1.lean'
      - 'AEGISOverlay/RHArchRow29V1.lean'
      - 'AEGISOverlay/RHGlobalizationChainV13.lean'
      - 'AEGISOverlay/AEGIS_RH_Unconditional.lean'
      - 'AEGISOverlay/RHFeshbachScaledErrorV1.lean'
      - 'AEGISOverlay/RHFeshbachScaledWeilV1.lean'
      - '.github/workflows/rh-cofinal-actual-schur-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  AEGIS_SHA: 2c3d041b633147ec97c7ef753aa9d157a47bb9f5
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  cofinal-actual-schur:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      - name: Construct and audit finite smooth local partitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-cofinal .lake/build/lib/lean/AEGISOverlay
          lake env lean -o .lake/build/lib/lean/AEGISOverlay/RHFiniteFinePartitionV1.olean \
            AEGISOverlay/RHFiniteFinePartitionV1.lean \
            2>&1 | tee evidence-cofinal/compile-AEGISOverlay_RHFiniteFinePartitionV1.log
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/RHFiniteFinePartitionV1.lean \
            evidence-cofinal/compile-AEGISOverlay_RHFiniteFinePartitionV1.log

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact LiCriterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          path: .li-provider
          fetch-depth: 1
          persist-credentials: false

      - name: Restore pinned LiCriterion provider build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li-provider/.lake/build
          key: rh-li-provider-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.LI_CRITERION_SHA }}-${{ env.MATHLIB_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}

      - name: Build and stage exact LiCriterion provider
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .li-provider rev-parse HEAD)" = "$LI_CRITERION_SHA"
          test "$(git -C .li-provider hash-object Hadamard/General/Factorization.lean)" = "$FACTORIZATION_SOURCE_BLOB"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path('.li-provider')
          p=root/'lakefile.lean'
          text=p.read_text()
          old=os.environ['LI_CRITERION_ORIGINAL_MATHLIB_SHA']
          new=os.environ['MATHLIB_SHA']
          assert old in text
          p.write_text(text.replace(old,new))
          fp=root/'Hadamard/General/Factorization.lean'
          text=fp.read_text()
          replacements=[
            ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
             'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
            ('have hgz : g z = Q z := ite_eq_left rfl',
             'have hgz : g z = Q z := by simp [g]'),
            ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
             'rw [if_neg heq, hQ_eq_div z (hz heq)]'),
          ]
          for old,new in replacements:
              assert text.count(old)==1
              text=text.replace(old,new)
          fp.write_text(text)
          PY
          # The pinned fork setup already verified Mathlib and fetched ALL
          # transitive dependencies. LiCriterion depends only on Mathlib:
          # reuse the exact same package store rather than cloning it twice.
          # This prevents intermittent GitHub DNS failures in provider setup.
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          cp lake-manifest.json .li-provider/lake-manifest.json
          printf '%s\n' "$LEAN_TOOLCHAIN" > .li-provider/lean-toolchain
          mkdir -p .li-provider/.lake
          if test -e .li-provider/.lake/packages; then
            test "$(readlink -f .li-provider/.lake/packages)" = "$GITHUB_WORKSPACE/.lake/packages"
          else
            ln -s "$GITHUB_WORKSPACE/.lake/packages" .li-provider/.lake/packages
          fi
          test "$(git -C .li-provider/.lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          (
            cd .li-provider
            export PATH="$HOME/.elan/bin:$PATH"
            lake build Hadamard.OrderOne.LogDerivMultiplicity Lc.LiCriterion.XiGrowth Lc.LiCriterion.HadamardSummabilityBridge Lc.LiCriterion.HadamardBridge
          )
          cp -R .li-provider/Lc .
          cp -R .li-provider/Hadamard .
          cp -R .li-provider/FunctionsOfOneComplexVariable .
          mkdir -p .lake/build/lib/lean/Lc .lake/build/lib/lean/Hadamard .lake/build/lib/lean/FunctionsOfOneComplexVariable
          cp -R .li-provider/.lake/build/lib/lean/Lc/. .lake/build/lib/lean/Lc/
          cp -R .li-provider/.lake/build/lib/lean/Hadamard/. .lake/build/lib/lean/Hadamard/
          cp -R .li-provider/.lake/build/lib/lean/FunctionsOfOneComplexVariable/. .lake/build/lib/lean/FunctionsOfOneComplexVariable/

      - name: Restore existing source-locked signed-prime and Abel imports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence-cofinal
          cat > evidence-cofinal/archived-source-lock.txt <<'PINS'
          RHNarrowFourBlockV2 36d07b81dbb67a765b4f3a37c50b16ee87ad1982
          RHNarrowArchV1 705f5524d644bdbbf8fa777dbf2e8810edd4e883
          WeilSignedPrimeKernelV1 4ef031bb4ff987de2687964b92649988acbfbc12
          WeilSignedKernelReductionV1 5c62344e0c659624e30e3843bbda4b4dc5f5a462
          WeilGeneralSignedKernelBoundV1 3cd1cfd5ea2659452aea4b963824e8b08aff6b88
          WeilSignedPrimeEventualBridgeV1 e342ba5a694f58dd59e88818f07637f9a1ec53cd
          RHBoundedKernelLaplaceV14 c1307d86bab3d6a2febcec613a4b00e6a5e03087
          RHBoundedKernelCriterionV14 476eba8d560fba42bef9bce93efd857a82e7bad8
          PINS
          while read -r module blob; do
            source="research/rh/assembly/exact-source-inputs/$module.lean.txt"
            test -f "$source"
            test "$(git hash-object "$source")" = "$blob"
            if test -e "$module.lean"; then
              test "$(git hash-object "$module.lean")" = "$blob"
            fi
            cp "$source" "$module.lean"
          done < evidence-cofinal/archived-source-lock.txt
          archive=research/rh/integration/AEGIS_PR63_ARCHIVED_ABEL_SOURCES_V6.tar.gz
          printf '%s  %s\n' dafcf849489f9b5f5ed7275ca74c53e4d0e6740d14bddbe51b62332d79a40801 "$archive" | sha256sum -c -
          test "$(tar -tzf "$archive" | wc -l)" -eq 4
          tar -xzf "$archive" -C .

      - name: Validate assembly evidence scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/rh/assembly/export_evidence.py
          bash -n research/rh/assembly/RH_EXACT_HEAD_REPLAY.sh

      - name: Stage exact V14 and fine-localization sources from PR721 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          base = pathlib.Path("research/rh/aegis_pr721_fb983fd")
          manifest = json.loads((base / "source_manifest.json").read_text())
          entries = manifest if isinstance(manifest, list) else (
              manifest.get("files") or manifest.get("sources") or manifest.get("modules") or manifest.get("entries"))
          if not isinstance(entries, list):
              raise RuntimeError("UNKNOWN_PR721_MANIFEST_SCHEMA")
          expected = {
              "RHMomentNumericsV14": "98db31d2bb9305bdf4ab4062ed982304e1a8005e",
              "RHWindowNineOver64GlobalizationV14": "a9be154062cf131dd0c07cf6405babffc6b2290c",
              "RHFineMomentPacketV3": "709bd274400ec98c85756c33d002ae88bf0323f7",
              "RHRationalNinePacketPrimeWindowV1": "7175f243640df980d9c2effc610cbb6748ffc29b",
              "RHFineDiagonalUpgradeV3": "576d1f3a17851b20d6a5008d79f45e7c067f3e11",
              "RHRationalGapNinePrimeBoundV1": "6f0ce19532bb422649d764a0bea930e3756a8c59",
              "RHRationalGapTenPrimeBoundV1": "c1771ca493a3292d962b77332437c2de3a693ac2",
          }
          for name, sha in expected.items():
              matches = [row for row in entries if row.get("module") == name]
              if len(matches) != 1 or matches[0].get("sha") != sha:
                  raise RuntimeError("ORIGINAL_SOURCE_MANIFEST_MISMATCH " + name)
              src = pathlib.Path(matches[0]["archive"])
              if not src.is_file():
                  raise RuntimeError("MISSING_ARCHIVED_SOURCE " + name)
              actual = subprocess.check_output(["git", "hash-object", str(src)],
                  text=True).strip()
              if actual != sha:
                  raise RuntimeError("SOURCE_BLOB_DRIFT " + name)
              dst = pathlib.Path(name + ".lean")
              if dst.exists() and dst.read_bytes() != src.read_bytes():
                  raise RuntimeError("MODULE_IDENTITY_COLLISION " + name)
              dst.write_bytes(src.read_bytes())
              print("EXACT_ORIGINAL_V14_SOURCE", name, sha)
          PY

      - name: Compile exact source import DAG and all three joined theorems
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-cofinal .lake/build/lib/lean
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root=pathlib.Path(".aegis/sovereign-omega-v2/formal/bridges/lean")
          overlay=pathlib.Path("AEGISOverlay")
          targets=["AEGISOverlay.AEGIS_RH_Unconditional","RHMomentDecayCofinalJoinV1","RHCofinalActualTerminalV1","RHCofinalSchurAdapterV1","RHLocalKreinPartitionV1","AEGISOverlay.RHKreinMultiplicativeTransportV1","AEGISOverlay.RHFiniteActualGramJoinV1","AEGISOverlay.RHActualNarrowGramSignV1","AEGISOverlay.RHActualLocalGramCoercivityV1","AEGISOverlay.RHActualElevenLatticeV1","AEGISOverlay.RHActualMixedDefectV1","AEGISOverlay.RHActualUniversalFineGramV1","AEGISOverlay.RHScaleRowCompositionV1","AEGISOverlay.RHArchRow29V1","AEGISOverlay.RHGlobalizationChainV13","AEGISOverlay.RHCrossRepositoryFiveSpineV1","RHFeshbachScaledErrorV1","RHFeshbachScaledWeilV1"]
          deps={}; paths={}; seen=set(); active=set(); order=[]
          def locate(m):
              if m.startswith("AEGISOverlay."):
                  p=pathlib.Path(m.replace(".","/")+".lean")
                  return p if p.is_file() else None
              p=pathlib.Path(m.replace(".","/")+".lean")
              if m == "RHNarrowMomentPacketV1":
                  return pathlib.Path("AegisRH/Overlay/RHNarrowMomentPacketV1.lean")
              if m == "RHFeshbachCoreV1":
                  return pathlib.Path("research/rh/krein_ring_v1/RHFeshbachCoreV1.lean")
              # Reuse existing kernel-correct PR606 proof of translatePacket g 0 = g.
              # The earlier AEGIS exact source ends in sorryAx on diagonal equality.
              if m == "WeilTranslationGapInvariantV10":
                  return pathlib.Path("AegisRH/PR606/Source/WeilTranslationGapInvariantV10.lean")
              # Reuse the existing corrected PR606 Mellin filter, preserving the
              # exact archived AEGIS source and checking both Git blob identities.
              # The original AEGIS V10 fails under pinned Lean 4.33.1 at
              # mellin sum grouping, norm of cpow, and multiplier at zero.
              if m == "WeilFiniteDilationFilterV10":
                  return pathlib.Path("AegisRH/PR606/Source/WeilFiniteDilationFilterV10.lean")
              if m in ("RHMomentDecayCofinalJoinV1","RHCofinalActualTerminalV1",
                       "RHCofinalSchurAdapterV1","RHFeshbachWeilClosureV2",
                       "RHExistingProofFusionV1"):
                  return overlay/(m+".lean")
              # PR721 exact SHA-staged source takes precedence over older
              # AEGIS checkout ONLY for these manifest-pinned modules.
              # Stage above already verifies each source Git blob.
              if m in ("RHMomentNumericsV14", "RHWindowNineOver64GlobalizationV14",
                       "RHFineMomentPacketV3", "RHRationalNinePacketPrimeWindowV1",
                       "RHFineDiagonalUpgradeV3", "RHRationalGapNinePrimeBoundV1",
                       "RHRationalGapTenPrimeBoundV1") and p.is_file():
                  return p
              if (root/(m+".lean")).is_file():
                  return root/(m+".lean")
              if (overlay/(m+".lean")).is_file():
                  return overlay/(m+".lean")
              if p.is_file(): return p
              return None
          def visit(m):
              if m in seen: return
              if m in active: raise RuntimeError("import cycle: "+m)
              p=locate(m)
              if p is None:
                  if m in targets: raise RuntimeError("missing target: "+m)
                  return
              if not p.is_file(): raise RuntimeError("missing pinned source: "+str(p))
              active.add(m); paths[m]=str(p)
              ids=[]
              for line in p.read_text(encoding="utf-8").splitlines():
                  s=line.strip()
                  if s.startswith("import "):
                      ids.extend(s[7:].split())
              deps[m]=ids
              for d in ids: visit(d)
              active.remove(m); seen.add(m); order.append(m)
          for m in targets: visit(m)
          if len(order)>380: raise RuntimeError("source closure exceeds bounded replay")
          original=pathlib.Path("AEGISOverlay/RHMomentDecayCofinalJoinV1.lean").read_bytes()
          hdr_end=original.find(b"-/\n\n")
          if hdr_end<0: raise RuntimeError("missing source wrapper")
          archived=original[hdr_end+4:]
          assert hashlib.sha256(archived).hexdigest()=="b5c8c8ee464027694d711a9882135fa76b0e8261e5dcfda8259dae98915196f1", "archived Lean text changed"
          def git_blob(path):
              return subprocess.check_output(["git","hash-object",str(path)],text=True).strip()
          pinned={
              "AEGISOverlay/RHTargetPacketMellinGeneralV2.lean":"9d87f75caa8711fc858bc594d4701fa8cab8ab17",
              "AEGISOverlay/RHNarrowFixedDetectorV1.lean":"21ea9492a375e45526f2be0d7076a7ba09661e57",
              "AegisRH/PR606/Source/WeilTranslationGapInvariantV10.lean":"45b6d528d6bb85e04da115dac85c4a897ae2d432",
              "AegisRH/PR606/Source/WeilFiniteDilationFilterV10.lean":"3fac46ae976087f75248662af12966dd04ea6770",
              ".aegis/sovereign-omega-v2/formal/bridges/lean/WeilFiniteDilationFilterV10.lean":"6970c598b8af0e25cc051567359f46cff63244bc",
              ".aegis/sovereign-omega-v2/formal/bridges/lean/RHNineFacesV13.lean":"19da141ee9d81c490555364a687fccdca6ae21b5",
          }
          for path, sha in pinned.items():
              actual=git_blob(path)
              if actual!=sha:
                  raise RuntimeError(f"SOURCE_BLOB_DRIFT {path}: {actual} != {sha}")
          print("CROSS_REPOSITORY_SOURCE_BLOBS=PASS")
          records=[]
          for m in order:
              src=pathlib.Path(paths[m])
              dst=pathlib.Path(m.replace(".","/")+".lean")
              payload=src.read_bytes()
              if src != dst:
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  if dst.exists() and dst.read_bytes()!=payload:
                      raise RuntimeError("conflicting module identity: "+str(dst))
                  if not dst.exists(): shutil.copy2(src,dst)
              records.append({"module":m,"source":str(src),"sha256":hashlib.sha256(payload).hexdigest()})
          pathlib.Path("evidence-cofinal/source-manifest.json").write_text(json.dumps(records,indent=2)+"\n")
          pathlib.Path("evidence-cofinal/module-order.txt").write_text("\n".join(order)+"\n")
          print("EXACT_COFINAL_SOURCE_IDENTITY=PASS")
          print("SOURCE_DAG_MODULE_COUNT",len(order))
          for m in order: print("MODULE",m,paths[m])
          PY
          while IFS= read -r m; do
            case "$m" in
              *.*) path="${m//.//}" ;;
              *) path="$m" ;;
            esac
            mkdir -p ".lake/build/lib/lean/$(dirname "$path")"
            echo "COMPILE $m"
            lake env lean -o ".lake/build/lib/lean/$path.olean" "$path.lean" \
              2>&1 | tee "evidence-cofinal/compile-${m//./_}.log"
            ! grep -F 'sorryAx' "evidence-cofinal/compile-${m//./_}.log"
            ! grep -F 'error:' "evidence-cofinal/compile-${m//./_}.log"
          done < evidence-cofinal/module-order.txt
          for thm in corrected_packet_moments_and_decay corrected_autocorrelation_zero_summable \
            scaled_error_of_cofinal_norm_convergence actual_zero_quadratic_nonnegative_of_cofinal_lower_bound; do
            grep -F "AEGIS.RHMomentDecayCofinalJoinV1.$thm" evidence-cofinal/compile-RHMomentDecayCofinalJoinV1.log
          done
          for thm in universal_of_cofinal_lower_certificates riemannHypothesis_of_cofinal_lower_certificates; do
            grep -F "AEGIS.RHCofinalActualTerminalV1.$thm" evidence-cofinal/compile-RHCofinalActualTerminalV1.log
          done
          for thm in cofinal_certificate_of_packet_schur every_packet_certificate_of_schur_norm_families \
            riemannHypothesis_of_schur_norm_families; do
            grep -F "AEGIS.RHCofinalSchurAdapterV1.$thm" evidence-cofinal/compile-RHCofinalSchurAdapterV1.log
          done
          for thm in narrow_packet_moments_and_detection narrow_packet_local_actual_arithmetic_sign \
            narrow_packet_actual_zero_of_cofinal three_nine_faces_of_cofinal; do
            grep -F "AEGIS.RHCrossRepositoryFiveSpineV1.$thm" \
              evidence-cofinal/compile-AEGISOverlay_RHCrossRepositoryFiveSpineV1.log
          done
          grep -F "AEGIS.RHLocalKreinPartitionV1.actual_packet_has_supported_krein_factor" evidence-cofinal/compile-RHLocalKreinPartitionV1.log
          grep -F "AEGIS.RHLocalKreinPartitionV1.actual_packet_finite_krein_decomposition" evidence-cofinal/compile-RHLocalKreinPartitionV1.log
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/RHKreinMultiplicativeTransportV1.lean \
            evidence-cofinal/compile-AEGISOverlay_RHKreinMultiplicativeTransportV1.log
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/AEGIS_RH_Unconditional.lean \
            evidence-cofinal/compile-AEGISOverlay_AEGIS_RH_Unconditional.log
          for thm in every_moment_zero_packet_two_actual_weil_packets \
            every_packet_actual_two_block_zero_quadratic; do
            grep -F "AEGIS.RHKreinMultiplicativeTransportV1.$thm" \
              evidence-cofinal/compile-AEGISOverlay_RHKreinMultiplicativeTransportV1.log
          done
          for thm in packetSum_one_apply every_packet_actual_finite_gram localized_actual_weil_krein_atom localized_actual_weil_diagonal_32_over_25; do
            grep -F "AEGIS.RHFiniteActualGramJoinV1.$thm" \
              evidence-cofinal/compile-AEGISOverlay_RHFiniteActualGramJoinV1.log
          done
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/RHActualNarrowGramSignV1.lean \
            evidence-cofinal/compile-AEGISOverlay_RHActualNarrowGramSignV1.log
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/RHActualMixedDefectV1.lean \
            evidence-cofinal/compile-AEGISOverlay_RHActualMixedDefectV1.log
          python3 scripts/verify_rh_overlay_axioms.py \
            research/rh/aegis_pr721_fb983fd/lean/RHMomentNumericsV14.lean.src \
            evidence-cofinal/compile-RHMomentNumericsV14.log
          python3 scripts/verify_rh_overlay_axioms.py \
            research/rh/aegis_pr721_fb983fd/lean/RHWindowNineOver64GlobalizationV14.lean.src \
            evidence-cofinal/compile-RHWindowNineOver64GlobalizationV14.log
          for theorem in quantitative_lower_of_diagonal every_packet_actual_mixed_defect_bound actual_zero_sign_of_paid_mixed_defect; do
            grep -F "AEGIS.RHActualMixedDefectV1.$theorem" \
              evidence-cofinal/compile-AEGISOverlay_RHActualMixedDefectV1.log
          done
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/RHFiniteFinePartitionV1.lean \
            evidence-cofinal/compile-AEGISOverlay_RHFiniteFinePartitionV1.log
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/RHActualUniversalFineGramV1.lean \
            evidence-cofinal/compile-AEGISOverlay_RHActualUniversalFineGramV1.log
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/RHScaleRowCompositionV1.lean \
            evidence-cofinal/compile-AEGISOverlay_RHScaleRowCompositionV1.log
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/RHArchRow29V1.lean \
            evidence-cofinal/compile-AEGISOverlay_RHArchRow29V1.log
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/RHActualElevenLatticeV1.lean \
            evidence-cofinal/compile-AEGISOverlay_RHActualElevenLatticeV1.log
          # Keep unchanged SHA-locked originals and their complete compiler
          # logs. Audit their compiled declarations in a fresh import-only
          # Lean invocation; historical source linter warnings remain in the
          # raw logs. The strict axiom checker and new-source warning gate
          # are unchanged.
          for original in RHFineMomentPacketV3 RHRationalNinePacketPrimeWindowV1 RHFineDiagonalUpgradeV3 RHRationalGapNinePrimeBoundV1 RHRationalGapTenPrimeBoundV1; do
            python3 - "$original" <<'PY'
          import pathlib, re, sys
          mod = sys.argv[1]
          source = pathlib.Path("research/rh/aegis_pr721_fb983fd/lean") / (mod + ".lean.src")
          names = re.findall(r"^#print axioms (\S+)$", source.read_text(), re.M)
          assert names and len(names) == len(set(names)), "INVALID_AXIOM_PROBES " + mod
          pathlib.Path("RHOriginalAxiomAudit.lean").write_text(
              "import " + mod + "\n\n" +
              "\n".join("#print axioms " + name for name in names) + "\n")
          PY
            lake env lean RHOriginalAxiomAudit.lean \
              2>&1 | tee "evidence-cofinal/axioms-$original.log"
            python3 scripts/verify_rh_overlay_axioms.py \
              "research/rh/aegis_pr721_fb983fd/lean/$original.lean.src" \
              "evidence-cofinal/axioms-$original.log"
          done
          grep -F "AEGIS.RHActualLocalGramCoercivityV1.every_packet_actual_fine_coercive_gram" \
            evidence-cofinal/compile-AEGISOverlay_RHActualLocalGramCoercivityV1.log
          grep -F "AEGIS.RHActualLocalGramCoercivityV1.every_packet_actual_narrow_coercive_gram" \
            evidence-cofinal/compile-AEGISOverlay_RHActualLocalGramCoercivityV1.log
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/RHActualLocalGramCoercivityV1.lean \
            evidence-cofinal/compile-AEGISOverlay_RHActualLocalGramCoercivityV1.log
          grep -F "AEGIS.RHActualNarrowGramSignV1.every_narrow_packet_actual_full_gram_nonpositive" \
            evidence-cofinal/compile-AEGISOverlay_RHActualNarrowGramSignV1.log
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/RHGlobalizationChainV13.lean \
            evidence-cofinal/compile-AEGISOverlay_RHGlobalizationChainV13.log
          grep -F "AEGIS.RHGlobalizationChainV13.rh_of_vanishing_error_on_exhaustion" \
            evidence-cofinal/compile-AEGISOverlay_RHGlobalizationChainV13.log
          grep -F "AEGIS.RHFeshbachScaledErrorV1.nonneg_of_invFourth_scaled_error" \
            evidence-cofinal/compile-RHFeshbachScaledErrorV1.log
          for thm in packet_zero_quadratic_nonnegative packet_weil_nonpositive riemannHypothesis_of_window_scaled_schur_families; do
            grep -F "AEGIS.RHFeshbachScaledWeilV1.$thm" evidence-cofinal/compile-RHFeshbachScaledWeilV1.log
          done
          echo "SCALED_WEIL_JOIN=KERNEL_PASS; RH_UNCONDITIONAL=NOT_CLAIMED"

      - name: Export actual proof dependencies and observed closure test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-cofinal/assembly
          lake env lean research/rh/assembly/RHProofGraphExport.lean \
            2>&1 | tee evidence-cofinal/assembly/graph-export.log
          ! grep -F 'error:' evidence-cofinal/assembly/graph-export.log
          python3 research/rh/assembly/export_evidence.py

      - name: Record exact-head receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-cofinal
          git rev-parse HEAD > evidence-cofinal/formal-conjectures-sha.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence-cofinal/mathlib-sha.txt || true
          lean --version > evidence-cofinal/lean-version.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-cofinal-actual-schur-${{ github.sha }}-${{ github.run_id }}
          path: evidence-cofinal/
          if-no-files-found: warn
          retention-days: 30
