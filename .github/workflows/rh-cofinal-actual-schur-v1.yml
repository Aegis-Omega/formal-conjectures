        run: |
          set -euo pipefail
          python3 scripts/test_rh_submission_from_checkpoint.py
          python3 scripts/rh_submission_from_checkpoint.py

      - name: Preserve completed source-bound cofinal modules
        id: cofinal-checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root=pathlib.Path("evidence-cofinal")
          manifest=root/"source-manifest.json"
          done=root/"completed-modules.txt"
          if not manifest.is_file() or not done.is_file():
              print("NO_COMPLETED_COFINAL_CHECKPOINT")
              raise SystemExit(0)
          rows=json.loads(manifest.read_text())
          completed=set(done.read_text().splitlines())
          available={row["module"] for row in rows}
          cache=pathlib.Path(".rh-cofinal-checkpoint")
          if cache.exists():
              shutil.rmtree(cache)
          (cache/"oleans").mkdir(parents=True)
          blobs=[]; hashes=[]; accepted=set()
          for row in rows:
              module=row["module"]
              if module not in completed:
                  continue
              src=pathlib.Path(row["source"])
              if hashlib.sha256(src.read_bytes()).hexdigest()!=row["sha256"]:
                  raise RuntimeError("CHECKPOINT_SOURCE_DRIFT "+module)
              deps=set()
              for line in src.read_text().splitlines():
                  if line.strip().startswith("import "):
                      deps.update(line.strip()[7:].split())
              if not (deps & available)<=accepted:
                  continue
              olean=pathlib.Path(".lake/build/lib/lean")/(module.replace(".","/")+".olean")
              if not olean.is_file():
                  raise RuntimeError("CHECKPOINT_OLEAN_MISSING "+module)
              blob=subprocess.check_output(["git","hash-object",str(src)],text=True).strip()
              rel="oleans/"+module+".olean"
              shutil.copyfile(olean,cache/rel)
              digest=hashlib.sha256((cache/rel).read_bytes()).hexdigest()
              blobs.append(module+" "+blob+"\n")
              hashes.append(digest+"  "+rel+"\n")
              accepted.add(module)
          (cache/"source-blobs.txt").write_text("".join(blobs))
          (cache/"oleans.sha256").write_text("".join(hashes))
          (cache/"head.txt").write_text(subprocess.check_output(["git","rev-parse","HEAD"],text=True))
          with open(__import__("os").environ["GITHUB_OUTPUT"],"a") as out:
              out.write("count="+str(len(accepted))+"\n")
          print("SAVED_SOURCE_BOUND_PARTIAL_MODULES",len(accepted))
          PY

      - name: Save partial cofinal checkpoint
        if: always() && steps.cofinal-checkpoint.outputs.count != '' && steps.cofinal-checkpoint.outputs.count != '0'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .rh-cofinal-checkpoint
          key: rh-cofinal-partial-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.MATHLIB_SHA }}-${{ env.AEGIS_SHA }}-${{ env.LI_CRITERION_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record exact-head receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-cofinal
          git rev-parse HEAD > evidence-cofinal/formal-conjectures-sha.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence-cofinal/mathlib-sha.txt || true
          lean --version > evidence-cofinal/lean-version.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-cofinal-actual-schur-${{ github.sha }}-${{ github.run_id }}
          path: evidence-cofinal/
          if-no-files-found: warn
          retention-days: 30
