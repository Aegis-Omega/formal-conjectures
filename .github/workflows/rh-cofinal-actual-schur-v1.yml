name: RH cofinal actual Schur kernel join

on:
  pull_request:
    paths:
      - 'AEGISOverlay/RHMomentDecayCofinalJoinV1.lean'
      - 'AEGISOverlay/RHCofinalActualTerminalV1.lean'
      - 'AEGISOverlay/RHCofinalSchurAdapterV1.lean'
      - 'AEGISOverlay/RHTargetPacketMellinGeneralV2.lean'
      - 'AEGISOverlay/RHNarrowFixedDetectorV1.lean'
      - 'AEGISOverlay/RHCrossRepositoryFiveSpineV1.lean'
      - 'AEGISOverlay/RHFeshbachWeilClosureV2.lean'
      - 'AEGISOverlay/RHLocalKreinPartitionV1.lean'
      - 'AEGISOverlay/RHKreinMultiplicativeTransportV1.lean'
      - 'AEGISOverlay/RHFiniteActualGramJoinV1.lean'
      - 'AEGISOverlay/RHBaguaWalshV1.lean'
      - 'AEGISOverlay/RHBaguaActualWeilV1.lean'
      - 'AEGISOverlay/RHTimeSliceWeilV1.lean'
      - 'AEGISOverlay/RHLogThreeSignedPrimeProducerV1.lean'
      - 'AEGISOverlay/RHNarrowDetectingTrigramDenseV1.lean'
      - 'AEGISOverlay/RHActualNarrowGramSignV1.lean'
      - 'AEGISOverlay/RHActualLocalGramCoercivityV1.lean'
      - 'AEGISOverlay/RHActualMixedDefectV1.lean'
      - 'AEGISOverlay/RHActualLogFourV1.lean'
      - 'AEGISOverlay/RHActualElevenLatticeV1.lean'
      - 'AEGISOverlay/RHActualElevenSpectralV1.lean'
      - 'AEGISOverlay/RHFiniteFinePartitionV1.lean'
      - 'AEGISOverlay/RHActualUniversalFineGramV1.lean'
      - 'AEGISOverlay/RHScaleRowCompositionV1.lean'
      - 'AEGISOverlay/RHOptimizedSchurGlobalJoinV1.lean'
      - 'AEGISOverlay/RHHexagram64MellinWeilFusionV1.lean'
      - 'AEGISOverlay/RHFourLogThreeActualPrimeV1.lean'
      - 'AEGISOverlay/RHMellinDetectorCenteredV1.lean'
      - 'AEGISOverlay/RHArchRow29V1.lean'
      - 'AEGISOverlay/RHGlobalizationChainV13.lean'
      - 'AEGISOverlay/AEGIS_RH_Unconditional.lean'
      - 'AEGISOverlay/RHFeshbachScaledErrorV1.lean'
      - 'AEGISOverlay/RHFeshbachScaledWeilV1.lean'
      - 'research/rh/assembly/RHProofGraphExport.lean'
      - 'research/rh/assembly/export_evidence.py'
      - 'scripts/rh_submission_from_checkpoint.py'
      - 'scripts/test_rh_submission_from_checkpoint.py'
      - '.github/workflows/rh-cofinal-actual-schur-v1.yml'
  workflow_dispatch:

# Preserve an already-running, SHA-pinned kernel replay when new commits arrive.
# GitHub keeps at most one pending replay in this PR concurrency group, so
# the latest candidate waits rather than cancelling every expensive proof DAG.
# Every job still checks out and records its own immutable exact source SHA.
concurrency:
  group: rh-cofinal-exact-head-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  AEGIS_SHA: 2c3d041b633147ec97c7ef753aa9d157a47bb9f5
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  cofinal-actual-schur:
    runs-on: ubuntu-24.04
    # The exact Trigram dependency replay exceeded the previous one-hour limit.
    timeout-minutes: 360
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Reject hardcoded negative RH verdicts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/rh_static_verdict_gate.py
          python3 scripts/test_rh_official_target_gate.py

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      - name: Construct and audit finite smooth local partitions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-cofinal .lake/build/lib/lean/AEGISOverlay
          lake env lean -o .lake/build/lib/lean/AEGISOverlay/RHFiniteFinePartitionV1.olean \
            AEGISOverlay/RHFiniteFinePartitionV1.lean \
            2>&1 | tee evidence-cofinal/compile-AEGISOverlay_RHFiniteFinePartitionV1.log
          python3 scripts/verify_rh_overlay_axioms.py \
            AEGISOverlay/RHFiniteFinePartitionV1.lean \
            evidence-cofinal/compile-AEGISOverlay_RHFiniteFinePartitionV1.log

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact LiCriterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          path: .li-provider
          fetch-depth: 1
          persist-credentials: false

      - name: Restore pinned LiCriterion provider build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li-provider/.lake/build
          key: rh-li-provider-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.LI_CRITERION_SHA }}-${{ env.MATHLIB_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}

      - name: Build and stage exact LiCriterion provider
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .li-provider rev-parse HEAD)" = "$LI_CRITERION_SHA"
          test "$(git -C .li-provider hash-object Hadamard/General/Factorization.lean)" = "$FACTORIZATION_SOURCE_BLOB"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path('.li-provider')
          p=root/'lakefile.lean'
          text=p.read_text()
          old=os.environ['LI_CRITERION_ORIGINAL_MATHLIB_SHA']
          new=os.environ['MATHLIB_SHA']
          assert old in text
          p.write_text(text.replace(old,new))
          fp=root/'Hadamard/General/Factorization.lean'
          text=fp.read_text()
          replacements=[
            ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
             'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
            ('have hgz : g z = Q z := ite_eq_left rfl',
             'have hgz : g z = Q z := by simp [g]'),
            ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
             'rw [if_neg heq, hQ_eq_div z (hz heq)]'),
          ]
          for old,new in replacements:
              assert text.count(old)==1
              text=text.replace(old,new)
          fp.write_text(text)
          PY
          # The pinned fork setup already verified Mathlib and fetched ALL
          # transitive dependencies. LiCriterion depends only on Mathlib:
          # reuse the exact same package store rather than cloning it twice.
          # This prevents intermittent GitHub DNS failures in provider setup.
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          cp lake-manifest.json .li-provider/lake-manifest.json
          printf '%s\n' "$LEAN_TOOLCHAIN" > .li-provider/lean-toolchain
          mkdir -p .li-provider/.lake
          if test -e .li-provider/.lake/packages; then
            test "$(readlink -f .li-provider/.lake/packages)" = "$GITHUB_WORKSPACE/.lake/packages"
          else
            ln -s "$GITHUB_WORKSPACE/.lake/packages" .li-provider/.lake/packages
          fi
          test "$(git -C .li-provider/.lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          (
            cd .li-provider
            export PATH="$HOME/.elan/bin:$PATH"
            lake build Hadamard.OrderOne.LogDerivMultiplicity Lc.LiCriterion.XiGrowth Lc.LiCriterion.HadamardSummabilityBridge Lc.LiCriterion.HadamardBridge
          )
          cp -R .li-provider/Lc .
          cp -R .li-provider/Hadamard .
          cp -R .li-provider/FunctionsOfOneComplexVariable .
          mkdir -p .lake/build/lib/lean/Lc .lake/build/lib/lean/Hadamard .lake/build/lib/lean/FunctionsOfOneComplexVariable
          cp -R .li-provider/.lake/build/lib/lean/Lc/. .lake/build/lib/lean/Lc/
          cp -R .li-provider/.lake/build/lib/lean/Hadamard/. .lake/build/lib/lean/Hadamard/
          cp -R .li-provider/.lake/build/lib/lean/FunctionsOfOneComplexVariable/. .lake/build/lib/lean/FunctionsOfOneComplexVariable/

      - name: Restore existing source-locked signed-prime and Abel imports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence-cofinal
          cat > evidence-cofinal/archived-source-lock.txt <<'PINS'
          RHNarrowFourBlockV2 36d07b81dbb67a765b4f3a37c50b16ee87ad1982
          RHNarrowArchV1 705f5524d644bdbbf8fa777dbf2e8810edd4e883
          WeilSignedPrimeKernelV1 4ef031bb4ff987de2687964b92649988acbfbc12
          WeilSignedKernelReductionV1 5c62344e0c659624e30e3843bbda4b4dc5f5a462
          WeilGeneralSignedKernelBoundV1 3cd1cfd5ea2659452aea4b963824e8b08aff6b88
          WeilSignedPrimeEventualBridgeV1 e342ba5a694f58dd59e88818f07637f9a1ec53cd
          RHBoundedKernelLaplaceV14 c1307d86bab3d6a2febcec613a4b00e6a5e03087
          RHBoundedKernelCriterionV14 476eba8d560fba42bef9bce93efd857a82e7bad8
          PINS
          while read -r module blob; do
            source="research/rh/assembly/exact-source-inputs/$module.lean.txt"
            test -f "$source"
            test "$(git hash-object "$source")" = "$blob"
            if test -e "$module.lean"; then
              test "$(git hash-object "$module.lean")" = "$blob"
            fi
            cp "$source" "$module.lean"
          done < evidence-cofinal/archived-source-lock.txt
          archive=research/rh/integration/AEGIS_PR63_ARCHIVED_ABEL_SOURCES_V6.tar.gz
          printf '%s  %s\n' dafcf849489f9b5f5ed7275ca74c53e4d0e6740d14bddbe51b62332d79a40801 "$archive" | sha256sum -c -
          test "$(tar -tzf "$archive" | wc -l)" -eq 4
          tar -xzf "$archive" -C .

      - name: Validate assembly evidence scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/rh/assembly/export_evidence.py
          bash -n research/rh/assembly/RH_EXACT_HEAD_REPLAY.sh

      - name: Stage exact V14 and fine-localization sources from PR721 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          base = pathlib.Path("research/rh/aegis_pr721_fb983fd")
          manifest = json.loads((base / "source_manifest.json").read_text())
          entries = manifest if isinstance(manifest, list) else (
              manifest.get("files") or manifest.get("sources") or manifest.get("modules") or manifest.get("entries"))
          if not isinstance(entries, list):
              raise RuntimeError("UNKNOWN_PR721_MANIFEST_SCHEMA")
          expected = {
              "RHMomentNumericsV14": "98db31d2bb9305bdf4ab4062ed982304e1a8005e",
              "RHWindowNineOver64GlobalizationV14": "a9be154062cf131dd0c07cf6405babffc6b2290c",
              "RHFineMomentPacketV3": "709bd274400ec98c85756c33d002ae88bf0323f7",
              "RHFourBlockPrimeEightV3": "5a2394056d7505774f207ed8e3bbafb0e593ed99",
              "RHRationalNinePacketPrimeWindowV1": "7175f243640df980d9c2effc610cbb6748ffc29b",
              "RHFineDiagonalUpgradeV3": "576d1f3a17851b20d6a5008d79f45e7c067f3e11",
              "RHRationalGapNinePrimeBoundV1": "6f0ce19532bb422649d764a0bea930e3756a8c59",
              "RHRationalGapTenPrimeBoundV1": "c1771ca493a3292d962b77332437c2de3a693ac2",
          }
          for name, sha in expected.items():
              matches = [row for row in entries if row.get("module") == name]
              if len(matches) != 1 or matches[0].get("sha") != sha:
                  raise RuntimeError("ORIGINAL_SOURCE_MANIFEST_MISMATCH " + name)
              src = pathlib.Path(matches[0]["archive"])
              if not src.is_file():
                  raise RuntimeError("MISSING_ARCHIVED_SOURCE " + name)
              actual = subprocess.check_output(["git", "hash-object", str(src)],
                  text=True).strip()
              if actual != sha:
                  raise RuntimeError("SOURCE_BLOB_DRIFT " + name)
              dst = pathlib.Path(name + ".lean")
              if dst.exists() and dst.read_bytes() != src.read_bytes():
                  raise RuntimeError("MODULE_IDENTITY_COLLISION " + name)
              dst.write_bytes(src.read_bytes())
              print("EXACT_ORIGINAL_V14_SOURCE", name, sha)
              if name == "RHFourBlockPrimeEightV3":
                  # Keep the archived PR721 original immutable. Only this staged
                  # compilation copy receives the type-explicit Lean 4.33.1 repair.
                  source = dst.read_text(encoding="utf-8")
                  repairs = [
                      ("  have hp := farthest_mixed_nat_zero_v3 g a hw 8 (by norm_num)\n",
                       "  have hp8 :\n"
                       "      mixed (translatePacket g 0) (translatePacket g (3 * Real.log 2)) (8 : ℝ) = 0 := by\n"
                       "    simpa only [Nat.cast_ofNat] using\n"
                       "      farthest_mixed_nat_zero_v3 g a hw 8 (by norm_num)\n"),
                      ("  rw [hp, farthest_mixed_reciprocal_center_v3, hv]\n",
                       "  rw [hp8, farthest_mixed_reciprocal_center_v3 g, hv]\n"),
                  ]
                  for before, after in repairs:
                      if source.count(before) != 1:
                          raise RuntimeError("PR721_LEAN_REPAIR_SOURCE_DRIFT " + name)
                      source = source.replace(before, after, 1)
                  dst.write_text(source, encoding="utf-8")
                  repaired_blob = subprocess.check_output(
                      ["git", "hash-object", str(dst)], text=True).strip()
                  receipt = {
                      "module": name,
                      "archived_original_blob": sha,
                      "compiled_repair_blob": repaired_blob,
                      "repairs": len(repairs),
                      "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  }
                  pathlib.Path("evidence-cofinal").mkdir(exist_ok=True)
                  pathlib.Path("evidence-cofinal/prime-eight-lean-repair.json").write_text(
                      json.dumps(receipt, indent=2) + "\n")
                  print("PR721_SOURCE_BOUND_LEAN_REPAIR", repaired_blob)
          PY

      - name: Reproduce pinned trigram fifteenth-cell correction
        shell: bash
        run: |
          set -euo pipefail
          gen=research/rh/m8_kernel_v1/cell15_direct/gen.py
          model=research/rh/m8_kernel_v1/cell15_direct/model.py
          out=research/rh/m8_kernel_v1/RHKreinFifteenthCellDirectCorrectionV1.lean
          test "$(git hash-object "$gen")" = "8fc5e3898b30a5047398663334baf083794e673d"
          test "$(git hash-object "$model")" = "834ba9df2213e01c9ec8668038aa7752552c8de2"
          python3 "$gen" "$out"
          test -s "$out"
          sha256sum "$out" | tee evidence-cofinal/trigram-generated-source-sha256.txt

      - name: Restore SHA-pinned Krein proof dependency checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .rh-krein-full
          key: rh-krein-full-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.MATHLIB_SHA }}-${{ env.AEGIS_SHA }}-${{ env.LI_CRITERION_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}

      - name: Restore source-bound partial cofinal checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .rh-cofinal-checkpoint
          key: rh-cofinal-partial-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.MATHLIB_SHA }}-${{ env.AEGIS_SHA }}-${{ env.LI_CRITERION_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rh-cofinal-partial-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.MATHLIB_SHA }}-${{ env.AEGIS_SHA }}-${{ env.LI_CRITERION_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}-

      - name: Compile exact source import DAG and all three joined theorems
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-cofinal .lake/build/lib/lean
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root=pathlib.Path(".aegis/sovereign-omega-v2/formal/bridges/lean")
          overlay=pathlib.Path("AEGISOverlay")
          targets=["AEGISOverlay.RHMellinDetectorCenteredV1","AEGISOverlay.RHBaguaWalshV1","AEGISOverlay.RHBaguaActualWeilV1","AEGISOverlay.RHTimeSliceWeilV1","AEGISOverlay.RHLogThreeSignedPrimeProducerV1","AEGISOverlay.RHNarrowDetectingTrigramDenseV1","AEGISOverlay.AEGIS_RH_Unconditional","RHMomentDecayCofinalJoinV1","RHCofinalActualTerminalV1","RHCofinalSchurAdapterV1","RHLocalKreinPartitionV1","AEGISOverlay.RHKreinMultiplicativeTransportV1","AEGISOverlay.RHFiniteActualGramJoinV1","AEGISOverlay.RHActualNarrowGramSignV1","AEGISOverlay.RHActualLocalGramCoercivityV1","AEGISOverlay.RHActualElevenLatticeV1","AEGISOverlay.RHActualElevenSpectralV1","AEGISOverlay.RHActualMixedDefectV1","AEGISOverlay.RHActualLogFourV1","AEGISOverlay.RHActualUniversalFineGramV1","AEGISOverlay.RHScaleRowCompositionV1","AEGISOverlay.RHOptimizedSchurGlobalJoinV1","AEGISOverlay.RHHexagram64MellinWeilFusionV1","AEGISOverlay.RHFourLogThreeActualPrimeV1","AEGISOverlay.RHBaguaRotatingTwoPairMellinV1","AEGISOverlay.RHArchRow29V1","AEGISOverlay.RHGlobalizationChainV13","AEGISOverlay.RHCrossRepositoryFiveSpineV1","RHFeshbachScaledErrorV1","RHFeshbachScaledWeilV1","RHFourBlockPrimeEightV3","RHFineMomentPacketV3","RHNarrowDiagonalUpgradeV2","RHFourBlockConcreteV3"]
          deps={}; paths={}; seen=set(); active=set(); order=[]
          def locate(m):
              # Trigram uses an existing declaration-free adapter for two
              # import aliases of the SAME correction definitions. Compiling
              # full correction source under the bare alias would duplicate
              # declarations and break the Lean import closure.
              if m in ("RHKreinExplicitCorrectionV1",
                       "AEGISOverlay.RHKreinCorrectionSymbolV1"):
                  return pathlib.Path("research/rh/m8_kernel_v1/CorrectionSymbolAdapter.lean")
              if m.startswith("AEGISOverlay."):
                  p=pathlib.Path(m.replace(".","/")+".lean")
                  if p.is_file(): return p
                  # Preserve exact PR52 sources imported under the AEGISOverlay namespace.
                  if m in ("AEGISOverlay.RHKreinM8AnalyticV1",
                           "AEGISOverlay.RHKreinCorrectionM8BoundV1"):
                      candidate=pathlib.Path("research/rh/m8_kernel_v1")/(m.rsplit(".",1)[1]+".lean")
                      if not candidate.is_file():
                          raise RuntimeError("missing M8 overlay source: "+str(candidate))
                      return candidate
                  return None
              p=pathlib.Path(m.replace(".","/")+".lean")
              if m == "RHNarrowMomentPacketV1":
                  return pathlib.Path("AegisRH/Overlay/RHNarrowMomentPacketV1.lean")
              if m == "RHFeshbachCoreV1":
                  return pathlib.Path("research/rh/krein_ring_v1/RHFeshbachCoreV1.lean")
              # Reuse existing kernel-correct PR606 proof of translatePacket g 0 = g.
              # The earlier AEGIS exact source ends in sorryAx on diagonal equality.
              if m == "WeilTranslationGapInvariantV10":
                  return pathlib.Path("AegisRH/PR606/Source/WeilTranslationGapInvariantV10.lean")
              # Reuse the existing corrected PR606 Mellin filter, preserving the
              # exact archived AEGIS source and checking both Git blob identities.
              # The original AEGIS V10 fails under pinned Lean 4.33.1 at
              # mellin sum grouping, norm of cpow, and multiplier at zero.
              if m == "WeilFiniteDilationFilterV10":
                  return pathlib.Path("AegisRH/PR606/Source/WeilFiniteDilationFilterV10.lean")
              # The original AEGIS seed module fails pinned Lean on
              # complex-exp smoothness and Mellin integral normalization.
              # Restore the existing PR606 repaired source, pin its exact blob.
              if m == "WeilOffLineSeedV10":
                  return pathlib.Path("AegisRH/PR606/Source/WeilOffLineSeedV10.lean")
              if m in ("RHMomentDecayCofinalJoinV1","RHCofinalActualTerminalV1",
                       "RHCofinalSchurAdapterV1","RHFeshbachWeilClosureV2",
                       "RHExistingProofFusionV1"):
                  return overlay/(m+".lean")
              # PR721 exact SHA-staged source takes precedence over older
              # AEGIS checkout ONLY for these manifest-pinned modules.
              # Stage above already verifies each source Git blob.
              if m in ("RHMomentNumericsV14", "RHWindowNineOver64GlobalizationV14",
                       "RHFineMomentPacketV3", "RHFourBlockPrimeEightV3",
                        "RHRationalNinePacketPrimeWindowV1",
                       "RHFineDiagonalUpgradeV3", "RHRationalGapNinePrimeBoundV1",
                       "RHRationalGapTenPrimeBoundV1") and p.is_file():
                  return p
              # The source-sharded PR85 trigram certificate, already on this
              # branch, is outside the repository root and AEGIS checkout.
              # Prefer its exact tracked shards over older module lookalikes.
              if m.startswith("RHKreinTrigramAdaptive"):
                  trigram=pathlib.Path("research/rh/krein_reflective_v1")/(m+".lean")
                  if trigram.is_file(): return trigram
              if (root/(m+".lean")).is_file():
                  return root/(m+".lean")
              if (overlay/(m+".lean")).is_file():
                  return overlay/(m+".lean")
              if p.is_file(): return p
              # All remaining Krein dependencies are existing research files.
              # The generated correction is reproducible from SHA-pinned sources.
              for directory in ("research/rh/krein_reflective_v1",
                                "research/rh/m8_kernel_v1",
                                "research/rh/finite_m8_v1",
                                "research/rh/krein_L105_v1",
                                "research/rh/krein_ring_v1"):
                  candidate=pathlib.Path(directory)/(m+".lean")
                  if candidate.is_file(): return candidate
              return None
          def visit(m):
              if m in seen: return
              if m in active: raise RuntimeError("import cycle: "+m)
              p=locate(m)
              if p is None:
                  # Source-defined versioned RH/Weil modules are never external libraries.
                  # Fail BEFORE the long Lean replay if a historical alias is unmapped.
                  local_versioned=m.rsplit(".",1)[-1]
                  local_versioned=(local_versioned.startswith(("RH","Weil","Zero","Mellin",
                      "Riemann","Krein","Restricted")) and "V" in local_versioned)
                  if m in targets or m.startswith("AEGISOverlay.") or local_versioned:
                      raise RuntimeError("UNRESOLVED_RH_SOURCE_IMPORT "+m)
                  return
              if not p.is_file(): raise RuntimeError("missing pinned source: "+str(p))
