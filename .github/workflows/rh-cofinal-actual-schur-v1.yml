name: RH cofinal actual Schur kernel join

on:
  pull_request:
    paths:
      - 'AEGISOverlay/RHMomentDecayCofinalJoinV1.lean'
      - 'AEGISOverlay/RHCofinalActualTerminalV1.lean'
      - 'AEGISOverlay/RHCofinalSchurAdapterV1.lean'
      - 'AEGISOverlay/RHTargetPacketMellinGeneralV2.lean'
      - 'AEGISOverlay/RHNarrowFixedDetectorV1.lean'
      - 'AEGISOverlay/RHCrossRepositoryFiveSpineV1.lean'
      - 'AEGISOverlay/RHFeshbachWeilClosureV2.lean'
      - '.github/workflows/rh-cofinal-actual-schur-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  AEGIS_SHA: 2c3d041b633147ec97c7ef753aa9d157a47bb9f5
  LI_CRITERION_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_CRITERION_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  FACTORIZATION_SOURCE_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  cofinal-actual-schur:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -Fq "$MATHLIB_SHA" lake-manifest.json
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake update
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact LiCriterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_CRITERION_SHA }}
          path: .li-provider
          fetch-depth: 1
          persist-credentials: false

      - name: Restore pinned LiCriterion provider build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .li-provider/.lake/build
          key: rh-li-provider-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ env.LI_CRITERION_SHA }}-${{ env.MATHLIB_SHA }}-${{ env.FACTORIZATION_SOURCE_BLOB }}

      - name: Build and stage exact LiCriterion provider
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .li-provider rev-parse HEAD)" = "$LI_CRITERION_SHA"
          test "$(git -C .li-provider hash-object Hadamard/General/Factorization.lean)" = "$FACTORIZATION_SOURCE_BLOB"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path('.li-provider')
          p=root/'lakefile.lean'
          text=p.read_text()
          old=os.environ['LI_CRITERION_ORIGINAL_MATHLIB_SHA']
          new=os.environ['MATHLIB_SHA']
          assert old in text
          p.write_text(text.replace(old,new))
          fp=root/'Hadamard/General/Factorization.lean'
          text=fp.read_text()
          replacements=[
            ('eventually_nhdsWithin_of_forall fun w hw => ite_eq_right hw',
             'eventually_nhdsWithin_of_forall fun w hw => if_neg hw'),
            ('have hgz : g z = Q z := ite_eq_left rfl',
             'have hgz : g z = Q z := by simp [g]'),
            ('rw [ite_eq_right heq, hQ_eq_div z (hz heq)]',
             'rw [if_neg heq, hQ_eq_div z (hz heq)]'),
          ]
          for old,new in replacements:
              assert text.count(old)==1
              text=text.replace(old,new)
          fp.write_text(text)
          PY
          rm -f .li-provider/lake-manifest.json
          printf '%s\n' "$LEAN_TOOLCHAIN" > .li-provider/lean-toolchain
          (
            cd .li-provider
            export PATH="$HOME/.elan/bin:$PATH"
            lake update mathlib
            lake exe cache get
            lake build Hadamard.OrderOne.LogDerivMultiplicity Lc.LiCriterion.XiGrowth Lc.LiCriterion.HadamardSummabilityBridge Lc.LiCriterion.HadamardBridge
          )
          cp -R .li-provider/Lc .
          cp -R .li-provider/Hadamard .
          cp -R .li-provider/FunctionsOfOneComplexVariable .
          mkdir -p .lake/build/lib/lean/Lc .lake/build/lib/lean/Hadamard .lake/build/lib/lean/FunctionsOfOneComplexVariable
          cp -R .li-provider/.lake/build/lib/lean/Lc/. .lake/build/lib/lean/Lc/
          cp -R .li-provider/.lake/build/lib/lean/Hadamard/. .lake/build/lib/lean/Hadamard/
          cp -R .li-provider/.lake/build/lib/lean/FunctionsOfOneComplexVariable/. .lake/build/lib/lean/FunctionsOfOneComplexVariable/

      - name: Compile exact source import DAG and all three joined theorems
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence-cofinal .lake/build/lib/lean
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root=pathlib.Path(".aegis/sovereign-omega-v2/formal/bridges/lean")
          overlay=pathlib.Path("AEGISOverlay")
          targets=["RHMomentDecayCofinalJoinV1","RHCofinalActualTerminalV1","RHCofinalSchurAdapterV1","AEGISOverlay.RHCrossRepositoryFiveSpineV1"]
          deps={}; paths={}; seen=set(); active=set(); order=[]
          def locate(m):
              if m.startswith("AEGISOverlay."):
                  p=pathlib.Path(m.replace(".","/")+".lean")
                  return p if p.is_file() else None
              p=pathlib.Path(m.replace(".","/")+".lean")
              if m == "RHFeshbachCoreV1":
                  return pathlib.Path("research/rh/krein_ring_v1/RHFeshbachCoreV1.lean")
              if m in ("RHMomentDecayCofinalJoinV1","RHCofinalActualTerminalV1",
                       "RHCofinalSchurAdapterV1","RHFeshbachWeilClosureV2",
                       "RHExistingProofFusionV1"):
                  return overlay/(m+".lean")
              if (root/(m+".lean")).is_file():
                  return root/(m+".lean")
              if (overlay/(m+".lean")).is_file():
                  return overlay/(m+".lean")
              if p.is_file(): return p
              return None
          def visit(m):
              if m in seen: return
              if m in active: raise RuntimeError("import cycle: "+m)
              p=locate(m)
              if p is None:
                  if m in targets: raise RuntimeError("missing target: "+m)
                  return
              if not p.is_file(): raise RuntimeError("missing pinned source: "+str(p))
              active.add(m); paths[m]=str(p)
              ids=[]
              for line in p.read_text(encoding="utf-8").splitlines():
                  s=line.strip()
                  if s.startswith("import "):
                      ids.extend(s[7:].split())
              deps[m]=ids
              for d in ids: visit(d)
              active.remove(m); seen.add(m); order.append(m)
          for m in targets: visit(m)
          if len(order)>380: raise RuntimeError("source closure exceeds bounded replay")
          original=pathlib.Path("AEGISOverlay/RHMomentDecayCofinalJoinV1.lean").read_bytes()
          hdr_end=original.find(b"-/\n\n")
          if hdr_end<0: raise RuntimeError("missing source wrapper")
          archived=original[hdr_end+4:]
          assert hashlib.sha256(archived).hexdigest()=="b5c8c8ee464027694d711a9882135fa76b0e8261e5dcfda8259dae98915196f1", "archived Lean text changed"
          def git_blob(path):
              return subprocess.check_output(["git","hash-object",str(path)],text=True).strip()
          pinned={
              "AEGISOverlay/RHTargetPacketMellinGeneralV2.lean":"9d87f75caa8711fc858bc594d4701fa8cab8ab17",
              "AEGISOverlay/RHNarrowFixedDetectorV1.lean":"21ea9492a375e45526f2be0d7076a7ba09661e57",
              ".aegis/sovereign-omega-v2/formal/bridges/lean/RHNineFacesV13.lean":"19da141ee9d81c490555364a687fccdca6ae21b5",
          }
          for path, sha in pinned.items():
              actual=git_blob(path)
              if actual!=sha:
                  raise RuntimeError(f"SOURCE_BLOB_DRIFT {path}: {actual} != {sha}")
          print("CROSS_REPOSITORY_SOURCE_BLOBS=PASS")
          records=[]
          for m in order:
              src=pathlib.Path(paths[m])
              dst=pathlib.Path(m.replace(".","/")+".lean")
              payload=src.read_bytes()
              if src != dst:
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  if dst.exists() and dst.read_bytes()!=payload:
                      raise RuntimeError("conflicting module identity: "+str(dst))
                  if not dst.exists(): shutil.copy2(src,dst)
              records.append({"module":m,"source":str(src),"sha256":hashlib.sha256(payload).hexdigest()})
          pathlib.Path("evidence-cofinal/source-manifest.json").write_text(json.dumps(records,indent=2)+"\n")
          pathlib.Path("evidence-cofinal/module-order.txt").write_text("\n".join(order)+"\n")
          print("EXACT_COFINAL_SOURCE_IDENTITY=PASS")
          print("SOURCE_DAG_MODULE_COUNT",len(order))
          for m in order: print("MODULE",m,paths[m])
          PY
          while IFS= read -r m; do
            case "$m" in
              *.*) path="${m//.//}" ;;
              *) path="$m" ;;
            esac
            mkdir -p ".lake/build/lib/lean/$(dirname "$path")"
            echo "COMPILE $m"
            lake env lean -o ".lake/build/lib/lean/$path.olean" "$path.lean" \
              2>&1 | tee "evidence-cofinal/compile-${m//./_}.log"
            ! grep -F 'sorryAx' "evidence-cofinal/compile-${m//./_}.log"
            ! grep -F 'error:' "evidence-cofinal/compile-${m//./_}.log"
          done < evidence-cofinal/module-order.txt
          for thm in corrected_packet_moments_and_decay corrected_autocorrelation_zero_summable \
            scaled_error_of_cofinal_norm_convergence actual_zero_quadratic_nonnegative_of_cofinal_lower_bound; do
            grep -F "AEGIS.RHMomentDecayCofinalJoinV1.$thm" evidence-cofinal/compile-RHMomentDecayCofinalJoinV1.log
          done
          for thm in universal_of_cofinal_lower_certificates riemannHypothesis_of_cofinal_lower_certificates; do
            grep -F "AEGIS.RHCofinalActualTerminalV1.$thm" evidence-cofinal/compile-RHCofinalActualTerminalV1.log
          done
          for thm in cofinal_certificate_of_packet_schur every_packet_certificate_of_schur_norm_families \
            riemannHypothesis_of_schur_norm_families; do
            grep -F "AEGIS.RHCofinalSchurAdapterV1.$thm" evidence-cofinal/compile-RHCofinalSchurAdapterV1.log
          done
          for thm in narrow_packet_moments_and_detection narrow_packet_local_actual_arithmetic_sign \
            narrow_packet_actual_zero_of_cofinal three_nine_faces_of_cofinal; do
            grep -F "AEGIS.RHCrossRepositoryFiveSpineV1.$thm" \
              evidence-cofinal/compile-AEGISOverlay_RHCrossRepositoryFiveSpineV1.log
          done
          echo "COFINAL_ACTUAL_JOIN=KERNEL_PASS; CROSS_REPOSITORY_FIVE_SPINE=KERNEL_PASS; RH_UNCONDITIONAL=NOT_CLAIMED"

      - name: Record exact-head receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > evidence-cofinal/formal-conjectures-sha.txt
          git -C .lake/packages/mathlib rev-parse HEAD > evidence-cofinal/mathlib-sha.txt || true
          lean --version > evidence-cofinal/lean-version.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-cofinal-actual-schur-${{ github.sha }}-${{ github.run_id }}
          path: evidence-cofinal/
          if-no-files-found: warn
          retention-days: 30
