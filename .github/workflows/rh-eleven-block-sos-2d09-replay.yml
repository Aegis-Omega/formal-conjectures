name: AEGIS RH Eleven Block Rational SOS Exact Preflight

on:
  push:
    branches:
      - 'evidence/rh-eleven-block-sos-2d09-replay-v1'
    paths:
      - '.github/workflows/rh-eleven-block-sos-2d09-replay.yml'
  pull_request:
    paths:
      - '.github/workflows/rh-eleven-block-sos-2d09-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 2d09039b05cc57d18673bfb5f87e9b1dbad837d9

jobs:
  verify:
    name: exact-rational eleven-block SOS replay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout witness repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout exact AEGIS source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.SOURCE_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$SOURCE_SHA"
          test -f .aegis/research/rh/eleven_block_sos_preflight_v1.py
          mkdir -p evidence
          sha256sum             .aegis/research/rh/eleven_block_sos_preflight_v1.py             .aegis/research/rh/RH_ELEVEN_BLOCK_SOS_PREFLIGHT_V1.md             | tee evidence/source-sha256.log

      - name: Run exact Fraction certificate
        shell: bash
        run: |
          set -euo pipefail
          python3 .aegis/research/rh/eleven_block_sos_preflight_v1.py             | tee evidence/eleven-block-sos.txt
          grep -Fx 'ELEVEN_BLOCK_RATIONAL_SOS=PASS' evidence/eleven-block-sos.txt
          grep -Fx 'CANDIDATE_MARGIN=106083/118400' evidence/eleven-block-sos.txt
          grep -Fx 'ACTUAL_ELEVEN_PACKET_BINDING=NOT_PROVEN' evidence/eleven-block-sos.txt
          grep -Fx 'RH=NOT_PROVEN' evidence/eleven-block-sos.txt
          grep -Fx 'AUTHORITY_EFFECT=NONE' evidence/eleven-block-sos.txt

      - name: Emit bounded disposition
        shell: bash
        run: |
          cat > evidence/DISPOSITION.txt <<EOF
          SOURCE_SHA=$SOURCE_SHA
          PARENT_GAP10_HEAD=3df9ad4530072b300fbab96ace0c30b16bbd8fd4
          DIAGONAL=5671/3200
          GAPS_1_8=1/100
          GAP_9=57/100
          GAP_10=837/3700
          SOS_MARGIN=106083/118400
          ACTUAL_ELEVEN_PACKET_BINDING=NOT_PROVEN
          RH=NOT_PROVEN
          AUTHORITY_EFFECT=NONE
          EOF

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-eleven-block-sos-2d09-exact-replay
          path: evidence/
          if-no-files-found: error
          retention-days: 30
