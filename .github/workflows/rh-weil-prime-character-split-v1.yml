name: RH Weil prime sum character split V1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - 'proof/rh-weil-prime-character-split-v1'
    paths:
      - 'research/rh/weil_character_split_v1/**'
      - 'AegisRH/PR606/WeilCriterionCompactSmoothV1.lean'
      - '.github/workflows/rh-weil-prime-character-split-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  CRITERION_BLOB: 1223d431c79cada6c7865b83b855e752f280c67c

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -F "$MATHLIB_SHA" lake-manifest.json
          test "$(git hash-object AegisRH/PR606/WeilCriterionCompactSmoothV1.lean)" = "$CRITERION_BLOB"
          ! grep -n -E '\bsorry\b|\badmit\b|^axiom ' research/rh/weil_character_split_v1/WeilPrimeSumCharacterV1.lean

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lean --version

      - name: Compile and audit character split
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/.lake/charsplit"
          mkdir -p "$OUT"
          export LEAN_PATH="$OUT:$(lake env printenv LEAN_PATH)"
          lean -o "$OUT/WeilCriterionCompactSmoothV1.olean" AegisRH/PR606/WeilCriterionCompactSmoothV1.lean
          lean research/rh/weil_character_split_v1/WeilPrimeSumCharacterV1.lean 2>&1 | tee charsplit.log
          python3 - <<'PY'
          import re
          log = open('charsplit.log').read()
          if 'sorryAx' in log:
              raise SystemExit('SORRY_AXIOM')
          for name in ['classTerm_eq_character_average', 'twisted_summable',
                       'classSum_eq_character_average']:
              m = re.search(r"'AEGIS\.WeilPrimeSumCharacterV1\." + name +
                            r"'\s+depends on axioms:\s*\[([^\]]*)\]", log)
              if not m:
                  raise SystemExit(f'AXIOM_AUDIT_MISSING {name}')
              axioms = {x.strip() for x in m.group(1).split(',') if x.strip()}
              if not axioms <= {'propext', 'Classical.choice', 'Quot.sound'}:
                  raise SystemExit(f'UNEXPECTED_AXIOMS {name}: {sorted(axioms)}')
              print(f'AXIOM_AUDIT_PASS {name}: {sorted(axioms)}')
          PY
