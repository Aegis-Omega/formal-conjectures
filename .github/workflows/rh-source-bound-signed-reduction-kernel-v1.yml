name: RH source-bound signed Weil B reduction kernel

on:
  pull_request:
    paths:
      - '.github/workflows/rh-source-bound-signed-reduction-kernel-v1.yml'
      - 'research/rh/checkpoints/20261117_signed_fixedwidth_v1/RHNarrowFourBlockV2.lean'
      - 'research/rh/checkpoints/20261117_signed_fixedwidth_v1/RHNarrowArchV1.lean'
      - 'research/rh/checkpoints/20261117_signed_fixedwidth_v1/WeilSignedKernelReductionV1.lean'
      - 'research/rh/checkpoints/20261117_signed_fixedwidth_v1/WeilSignedPrimeKernelV1.lean'
      - 'research/rh/assembly/exact-source-inputs/*.lean.txt'

permissions:
  contents: read

concurrency:
  group: rh-source-bound-signed-reduction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474

jobs:
  exact-source-reduction:
    if: github.event.pull_request.number == 92
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify HEAD, pins, and unchanged historical sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
          grep -F "$MATHLIB_SHA" lake-manifest.json
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path('research/rh/checkpoints/20261117_signed_fixedwidth_v1')
          historical=Path('research/rh/assembly/exact-source-inputs')
          pinned={
            'WeilSignedPrimeKernelV1':'4ef031bb4ff987de2687964b92649988acbfbc12',
            'RHNarrowFourBlockV2':'36d07b81dbb67a765b4f3a37c50b16ee87ad1982',
            'RHNarrowArchV1':'705f5524d644bdbbf8fa777dbf2e8810edd4e883',
            'WeilSignedKernelReductionV1':'5c62344e0c659624e30e3843bbda4b4dc5f5a462',
          }
          for name,expected in pinned.items():
              path=historical/(name+'.lean.txt')
              actual=subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
              if actual!=expected:
                  raise SystemExit('SOURCE_BLOB_CHANGED '+name+':'+actual)
              if not (root/(name+'.lean')).read_bytes().endswith(path.read_bytes()):
                  raise SystemExit('STAGED_NOT_BYTE_EXACT '+name)
          print('SOURCE_BOUND_FOUR_MODULE_BLOBS_PASS',len(pinned))
          PY
      - name: Restore Lean 4.33.1 and exact Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_SHA"
          lean --version
      - name: Rebuild existing V31 and canonical narrow source imports
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          BASE=research/rh/checkpoints/20261020_row_budget_bridge/window_l65_source
          python3 "$BASE/plan.py" WeilSeparatedArchBridgeV31 RHNarrowMomentPacketV1
          python3 -u "$BASE/build.py" "$(pwd)/.lake/build/lib/lean" 1 || {
            cat .lake/real_status.json || true
            for f in .lake/reallogs/*.log; do tail -n 35 "$f"; done
            exit 1
          }
      - name: Kernel replay all four source-bound signed modules and axioms
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          RING="$(pwd)/.lake/ringout"
          BASE=research/rh/checkpoints/20261117_signed_fixedwidth_v1
          export LEAN_PATH="$RING:$(lake env printenv LEAN_PATH)"
          for mod in WeilSignedPrimeKernelV1 RHNarrowFourBlockV2 RHNarrowArchV1 WeilSignedKernelReductionV1; do
            lean --trust=0 -DwarningAsError=true -o "$RING/$mod.olean" "$BASE/$mod.lean" > "$RUNNER_TEMP/$mod.log" 2>&1 || {
              cat "$RUNNER_TEMP/$mod.log"
              exit 1
            }
            cat "$RUNNER_TEMP/$mod.log"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re,os
          root=Path('research/rh/checkpoints/20261117_signed_fixedwidth_v1')
          temp=Path(os.environ['RUNNER_TEMP'])
          allowed={'propext','Classical.choice','Quot.sound'}
          counts={'WeilSignedPrimeKernelV1':5,'RHNarrowFourBlockV2':4,'RHNarrowArchV1':3,'WeilSignedKernelReductionV1':6}
          seen=0
          for mod,expected_count in counts.items():
              src=(root/(mod+'.lean')).read_text()
              log=(temp/(mod+'.log')).read_text()
              if 'sorryAx' in log or re.search(r'(?m)^\s*(?:sorry|admit|axiom)\b',src):
                  raise SystemExit('FORBIDDEN_PROOF_HOLE '+mod)
              names=re.findall(r'(?m)^#print axioms\s+(\S+)\s*$',src)
              if len(names)!=expected_count:
                  raise SystemExit('AUDIT_COVERAGE_MISMATCH '+mod+' '+str(names))
              for full in names:
                  m=re.search("'"+re.escape(full)+r"' depends on axioms:\s*\[([^\]]*)\]",log)
                  if m:
                      axioms={a.strip() for a in m.group(1).split(',') if a.strip()}
                  elif "'"+full+"' does not depend on any axioms" in log:
                      axioms=set()
                  else:
                      raise SystemExit('AXIOM_AUDIT_MISSING '+full)
                  if not axioms.issubset(allowed):
                      raise SystemExit('UNAUTHORIZED_AXIOMS '+full+' '+str(axioms))
                  seen+=1
          print('AEGIS_SIGNED_B_REDUCTION_KERNEL_T0_PASS',seen)
          PY
