name: AEGIS RH Fork Replay V1

on:
  push:
    branches:
      - 'proof/riemann-hypothesis-aegis-v1'
    paths:
      - '.github/workflows/aegis-rh-fork-replay-v1.yml'
      - 'AegisRH/**'
      - 'FormalConjectures/Millennium/RiemannHypothesis.lean'
  pull_request:
    paths:
      - '.github/workflows/aegis-rh-fork-replay-v1.yml'
      - 'AegisRH/**'
      - 'FormalConjectures/Millennium/RiemannHypothesis.lean'
  workflow_dispatch:

permissions:
  contents: read

env:
  AEGIS_SHA: 589adf0480bd4d7c12c9828027ea6228398377f4
  MATHLIB_SHA: 0df444a360eaa60ab8c11dca51a86af692955474
  LEAN_TOOLCHAIN: leanprover/lean4:v4.33.1
  LI_PROVIDER_SHA: 35df682f3b709ffe5fbcfdd452dfa964bd622b87
  LI_PROVIDER_ORIGINAL_MATHLIB_SHA: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
  LI_FACTORIZATION_BLOB: 10d38a54580ff72d698a30be64fe1c3c44f862a2

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout fork exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout AEGIS exact theorem DAG
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aegis-Omega/AEGIS-OMEGA
          ref: ${{ env.AEGIS_SHA }}
          path: .aegis
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Li-criterion provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: nicholasbulka/li-criterion-rh-equivalence-lean
          ref: ${{ env.LI_PROVIDER_SHA }}
          path: .li
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .aegis rev-parse HEAD)" = "$AEGIS_SHA"
          test "$(git -C .li rev-parse HEAD)" = "$LI_PROVIDER_SHA"
          test "$(git -C .li hash-object Hadamard/General/Factorization.lean)" = "$LI_FACTORIZATION_BLOB"
          grep -F "$MATHLIB_SHA" lake-manifest.json
          grep -F 'leanprover/lean4:v4.33.1' lean-toolchain

      - name: Install pinned elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify source-bound RH compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          REAL=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilDigammaSeriesRealV1.lean"
          HALF=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilDigammaSeriesHalfPlaneV1.lean"
          LAP=".aegis/sovereign-omega-v2/formal/bridges/lean/RestrictedWeilCriterionLaplaceV10.lean"
          grep -F 'MeasureTheory.norm_integral_le_integral_norm' "$REAL"
          grep -F 'Nat.cast_add_one_ne_zero' "$HALF"
          grep -F 'Complex.differentiableOn_tsum_of_summable_norm' "$HALF"
          grep -F 'countable_nontrivialZeroIndex_v10' "$LAP"
          test "$(git -C .aegis status --porcelain)" = ""

      - name: Apply Archimedean correction Lean 4.33 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          ARCH=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilArchimedeanCorrectionV10.lean"
          python3 - "$ARCH" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          original = s

          robust_tendsto = """  have h := (Real.tendsto_log_comp_add_sub_log 1).neg
            convert h using 1 <;> simp [sub_eq_add_neg]"""

          old_tendsto_v1 = """  have h := (Real.tendsto_log_comp_add_sub_log 1).neg
            simpa only [neg_sub, neg_zero] using h"""
          if old_tendsto_v1 in s:
              s = s.replace(old_tendsto_v1, robust_tendsto, 1)

          old_tendsto_v2 = """  simpa only [neg_sub] using
              (Real.tendsto_log_comp_add_sub_log 1).neg"""
          if old_tendsto_v2 in s:
              s = s.replace(old_tendsto_v2, robust_tendsto, 1)

          old_hpoint_v1 = """    have hx' : (1 : ℝ) < x := hx
              have hx0 : x ≠ 0 := by linarith
              have hx1 : x + 1 ≠ 0 := by linarith"""
          new_hpoint = """    have hx' : (1 : ℝ) < x := hx
              have hx0 : x ≠ 0 := ne_of_gt (by linarith [hx'])
              have hx1 : x + 1 ≠ 0 := ne_of_gt (by linarith [hx'])"""
          if old_hpoint_v1 in s:
              s = s.replace(old_hpoint_v1, new_hpoint, 1)

          old_hpoint_v2 = """    intro x hx
              have hx0 : x ≠ 0 := by linarith
              have hx1 : x + 1 ≠ 0 := by linarith"""
          new_hpoint_v2 = """    intro x hx
              have hx' : (1 : ℝ) < x := hx
              have hx0 : x ≠ 0 := ne_of_gt (by linarith [hx'])
              have hx1 : x + 1 ≠ 0 := ne_of_gt (by linarith [hx'])"""
          if old_hpoint_v2 in s:
              s = s.replace(old_hpoint_v2, new_hpoint_v2, 1)

          final_log = "    _ = Real.log 2 := by rw [Real.log_one, show (1 : ℝ) + 1 = 2 by norm_num]; ring"
          s = s.replace("    _ = Real.log 2 := by norm_num", final_log, 1)
          s = s.replace("    _ = Real.log 2 := by simp", final_log, 1)

          assert "convert h using 1 <;> simp [sub_eq_add_neg]" in s
          assert "have hx0 : x ≠ 0 := ne_of_gt (by linarith [hx'])" in s
          assert "have hx1 : x + 1 ≠ 0 := ne_of_gt (by linarith [hx'])" in s
          assert "rw [Real.log_one, show (1 : ℝ) + 1 = 2 by norm_num]; ring" in s

          p.write_text(s, encoding="utf-8")
          print("ARCH_COMPAT_CHANGED", s != original)
          PY

      - name: Apply finite-dilation Lean 4.33 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          DIL=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilFiniteDilationFilterV10.lean"
          python3 - "$DIL" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          original = s

          old = """    simpa [finiteDilationFilterV10, a, b, d2, d4, addPacket]
                using htotal.2"""
          new = """    simpa [finiteDilationFilterV10, a, b, d2, d4, addPacket, hab.2]
                using htotal.2"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """    dsimp [z]
              rw [Complex.norm_cpow_eq_rpow_re_of_pos (by norm_num : (0 : ℝ) < 2)]
              simp"""
          new = """    dsimp [z]
              simpa using
                (Complex.norm_cpow_eq_rpow_re_of_pos
                  (x := (2 : ℝ))
                  (by norm_num : (0 : ℝ) < 2)
                  (-s))"""
          if old in s:
              s = s.replace(old, new, 1)

          old_zero = """theorem finiteDilationMultiplier_zero_v10 :
              finiteDilationMultiplierV10 0 = 0 := by
            simp [finiteDilationMultiplierV10]"""
          new_zero = """theorem finiteDilationMultiplier_zero_v10 :
              finiteDilationMultiplierV10 0 = 0 := by
            rw [finiteDilationMultiplier_factor_v10]
            apply mul_eq_zero.mpr
            left
            norm_num"""
          if old_zero in s:
              s = s.replace(old_zero, new_zero, 1)

          old = """theorem finiteDilationMultiplier_one_v10 :
              finiteDilationMultiplierV10 1 = 0 := by
            rw [finiteDilationMultiplierV10]
            norm_num [Complex.cpow_neg_one]"""
          new = """theorem finiteDilationMultiplier_one_v10 :
              finiteDilationMultiplierV10 1 = 0 := by
            rw [finiteDilationMultiplier_factor_v10]
            apply mul_eq_zero.mpr
            right
            norm_num [Complex.cpow_neg_one]"""
          if old in s:
              s = s.replace(old, new, 1)

          assert "addPacket, hab.2]" in s
          assert "(x := (2 : ℝ))" in s
          assert s.count("rw [finiteDilationMultiplier_factor_v10]") >= 2
          assert "apply mul_eq_zero.mpr" in s
          p.write_text(s, encoding="utf-8")
          print("FINITE_DILATION_COMPAT_CHANGED", s != original)
          PY

      - name: Inventory full PR606 terminal dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".aegis/sovereign-omega-v2/formal/bridges/lean")
          files = {p.stem: p for p in root.glob("*.lean")}
          assert len(files) == 131, len(files)

          targets = [
              "RHMillenniumGateV10",
              "RHZeroKernelLaplaceAnalyticV12",
              "RestrictedWeilCriterionResidueCoefficientV11",
              "RestrictedWeilCriterionPoleIsolationV10",
              "RestrictedWeilCriterionResidueWitnessV11",
              "RestrictedWeilCriterionTargetWitnessV11",
              "MeromorphicIdentityPreconnectedV11",
              "WeilRHImpliesFinalSignV11",
          ]
          for target in targets:
              assert target in files, target

          pat = re.compile(r"^\s*import\s+(.+?)\s*$")
          deps = {}
          for name, path in files.items():
              local = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  m = pat.match(line)
                  if not m:
                      continue
                  for token in m.group(1).split():
                      leaf = token.split(".")[-1]
                      if leaf in files:
                          local.append(leaf)
              deps[name] = sorted(set(local))

          temp, done, order = set(), set(), []
          def visit(name):
              if name in done:
                  return
              if name in temp:
                  raise RuntimeError(f"local import cycle at {name}")
              temp.add(name)
              for dep in deps[name]:
                  visit(dep)
              temp.remove(name)
              done.add(name)
              order.append(name)

          for target in targets:
              visit(target)

          out = Path("evidence")
          (out / "pr606-terminal-targets.txt").write_text(
              "\n".join(targets) + "\n", encoding="utf-8")
          (out / "pr606-terminal-modules.txt").write_text(
              "\n".join(order) + "\n", encoding="utf-8")
          (out / "pr606-terminal-closure-count.txt").write_text(
              str(len(order)) + "\n", encoding="utf-8")
          (out / "pr606-lean-inventory-count.txt").write_text(
              str(len(files)) + "\n", encoding="utf-8")
          (out / "pr606-modules-outside-terminal-closure.txt").write_text(
              "\n".join(sorted(set(files) - set(order))) + "\n", encoding="utf-8")

          print("PR606_LEAN_INVENTORY_COUNT", len(files))
          print("PR606_TERMINAL_DEPENDENCY_CLOSURE_COUNT", len(order))
          print("PR606_TERMINAL_TARGETS", ",".join(targets))
          print("PR606_TERMINAL_MODULES_BEGIN")
          print("\n".join(order))
          print("PR606_TERMINAL_MODULES_END")
          PY
          test -s evidence/pr606-lean-inventory-count.txt
          test -s evidence/pr606-terminal-closure-count.txt
          {
            printf '## PR #606 exact-head Lean inventory\n\n'
            printf -- '- proof source: `%s`\n' "$AEGIS_SHA"
            printf -- '- total local Lean modules: `%s`\n' "$(cat evidence/pr606-lean-inventory-count.txt)"
            printf -- '- terminal dependency closure: `%s`\n' "$(cat evidence/pr606-terminal-closure-count.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore shared Mathlib olean cache
        uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/.cache/mathlib
          key: oleans-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            oleans-${{ hashFiles('lean-toolchain') }}-

      - name: Apply off-line seed Lean 4.33 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          SEED=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilOffLineSeedV10.lean"
          python3 - "$SEED" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          original = s

          def replace_once(old: str, new: str, label: str) -> None:
              global s
              count = s.count(old)
              assert count == 1, f"{label}: expected 1 occurrence, found {count}"
              s = s.replace(old, new, 1)

          replace_once(
              "  have he :\n      ContDiff ℝ ∞\n        (fun u : ℝ => Complex.exp (-s * (u : ℂ))) := by\n    fun_prop",
              "  have hu : ContDiff ℝ ∞ (fun u : ℝ => (u : ℂ)) :=\n"
              "    Complex.ofRealCLM.contDiff\n"
              "  have hlin : ContDiff ℝ ∞ (fun u : ℝ => -s * (u : ℂ)) :=\n"
              "    contDiff_const.mul hu\n"
              "  have he :\n"
              "      ContDiff ℝ ∞\n"
              "        (fun u : ℝ => Complex.exp (-s * (u : ℂ))) :=\n"
              "    Complex.contDiff_exp.comp hlin",
              "seedProfile_contDiff",
          )

          calc_start = s.index("          let A : ℂ := s * (u : ℂ)")
          calc_end_marker = "                  simp)"
          calc_end = s.index(calc_end_marker, calc_start) + len(calc_end_marker)
          new_calc = (
              "          calc\n"
              "            Complex.exp (s * (u : ℂ)) *\n"
              "                (((seedBumpV10 u : ℝ) : ℂ) *\n"
              "                  Complex.exp (-s * (u : ℂ)))\n"
              "              =\n"
              "                ((seedBumpV10 u : ℝ) : ℂ) *\n"
              "                  (Complex.exp (s * (u : ℂ)) *\n"
              "                    Complex.exp (-s * (u : ℂ))) := by ring\n"
              "            _ = ((seedBumpV10 u : ℝ) : ℂ) := by\n"
              "                  rw [← Complex.exp_add]\n"
              "                  simp)"
          )
          s = s[:calc_start] + new_calc + s[calc_end:]

          replace_once(
              "          rw [integral_ofReal]",
              "          exact integral_ofReal",
              "integral_ofReal",
          )

          replace_once(
              "    · let gsum := AEGIS.WeilMixedAlgebraV2.addPacket gs gt\n",
              "    · have hst0 : mellin gs.1 t = 0 := by simpa using hst\n"
              "      have hts0 : mellin gt.1 s = 0 := by simpa using hts\n"
              "      let gsum := AEGIS.WeilMixedAlgebraV2.addPacket gs gt\n",
              "pair-zero-conversion",
          )
          replace_once("        simp [hts]", "        simp [hts0]", "hts-zero")
          replace_once("        simp [hst]", "        simp [hst0]", "hst-zero")

          assert "Complex.contDiff_exp.comp hlin" in s
          assert "let A : ℂ := s * (u : ℂ)" not in s
          assert "exact integral_ofReal" in s
          assert "have hst0 : mellin gs.1 t = 0" in s
          assert "have hts0 : mellin gt.1 s = 0" in s
          assert s != original
          p.write_text(s, encoding="utf-8")
          print("OFFLINE_SEED_COMPAT=PASS")
          PY

      - name: Apply moment-zero detection Lean 4.33 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          MOM=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilMomentZeroDetectionV10.lean"
          python3 - "$MOM" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          original = s

          old_imports = "import ZeroCriticalStripV1\nimport Mathlib.Tactic"
          new_imports = (
              "import ZeroCriticalStripV1\n"
              "import Mathlib.Analysis.Analytic.Order\n"
              "import Mathlib.Analysis.Normed.Module.Connected\n"
              "import Mathlib.Tactic"
          )
          assert s.count(old_imports) == 1
          s = s.replace(old_imports, new_imports, 1)
          s = s.replace("open Complex\n", "open Complex Set\nopen scoped ComplexConjugate\n", 1)

          assert s.count("conj rho.1") >= 1
          old = (
              "  have hmult : analyticOrderNatAt riemannZeta rho.1 ≠ 0 := by\n"
              "    exact analyticOrderNatAt_ne_zero_of_eq_zero rho.2.1"
          )
          new = """  have hmult : analyticOrderNatAt riemannZeta rho.1 ≠ 0 := by
              have hstrip :=
                riemann_zeta_nontrivial_zero_critical_strip_v1
                  rho.2.1 rho.2.2
              have hr1 : rho.1 ≠ 1 := by
                intro h
                have hre := congrArg Complex.re h
                simp at hre
                linarith [hstrip.2]
              have hAnal : AnalyticAt ℂ riemannZeta rho.1 :=
                analyticOn_riemannZeta rho.1 (by simpa using hr1)
              have hOrderNeZero :
                  analyticOrderAt riemannZeta rho.1 ≠ 0 :=
                (hAnal.analyticOrderAt_ne_zero).2 rho.2.1
              have hPre :
                  IsPreconnected ({(1 : ℂ)}ᶜ : Set ℂ) :=
                (isConnected_compl_singleton_of_one_lt_rank
                  (rank_real_complex ▸ Nat.one_lt_ofNat) (1 : ℂ)).isPreconnected
              have h2mem : (2 : ℂ) ∈ ({(1 : ℂ)}ᶜ : Set ℂ) := by simp
              have hrmem : rho.1 ∈ ({(1 : ℂ)}ᶜ : Set ℂ) := by
                simpa using hr1
              have h2Anal : AnalyticAt ℂ riemannZeta (2 : ℂ) :=
                analyticOn_riemannZeta 2 (by simp)
              have hz2 : riemannZeta (2 : ℂ) ≠ 0 :=
                riemannZeta_ne_zero_of_one_le_re (by norm_num)
              have h2ord0 :
                  analyticOrderAt riemannZeta (2 : ℂ) = 0 :=
                (h2Anal.analyticOrderAt_eq_zero).2 hz2
              have h2finite :
                  analyticOrderAt riemannZeta (2 : ℂ) ≠ ⊤ := by
                rw [h2ord0]
                simp
              have hfinite :
                  analyticOrderAt riemannZeta rho.1 ≠ ⊤ :=
                analyticOn_riemannZeta.analyticOrderAt_ne_top_of_isPreconnected
                  hPre h2mem hrmem h2finite
              intro hnat
              have hcast :
                  analyticOrderAt riemannZeta rho.1 = 0 := by
                rw [← Nat.cast_analyticOrderNatAt hfinite]
                simp [hnat]
              exact hOrderNeZero hcast"""
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          old = "  · exact mul_ne_zero h1 (map_ne_zero_of_injective Complex.conj_injective h2)"
          new = """  · apply mul_ne_zero h1
              intro hc
              apply h2
              have hc' := congrArg conj hc
              simpa using hc'"""
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)

          assert "analyticOrderNatAt_ne_zero_of_eq_zero" not in s
          assert "map_ne_zero_of_injective" not in s
          assert "open scoped ComplexConjugate" in s
          assert "conj (mellin g.1" in s
          assert "analyticOrderAt_ne_top_of_isPreconnected" in s
          assert s != original
          p.write_text(s, encoding="utf-8")
          print("MOMENT_ZERO_COMPAT=PASS")
          PY

      - name: Apply actual-zero witness conjugation compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          WIT=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilActualZeroSummandWitnessV10.lean"
          python3 - "$WIT" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          old = "open Complex\n"
          new = "open Complex\nopen scoped ComplexConjugate\n"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          assert "open scoped ComplexConjugate" in s
          p.write_text(s, encoding="utf-8")
          print("ACTUAL_ZERO_WITNESS_CONJ_SCOPE=PASS")
          PY

      - name: Apply translation-gap diagonal compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          GAP=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilTranslationGapInvariantV10.lean"
          python3 - "$GAP" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          old = '  have h :=\n    B_translate_eq_of_gap_v10 g d d 0 0 (by ring)\n  simpa using h'
          new = '  have h :=\n    B_translate_eq_of_gap_v10 g d d 0 0 (by ring)\n  have h0 : translatePacket g 0 = g := by\n    apply Subtype.ext\n    funext x\n    simp [translatePacket_apply]\n  rw [h0] at h\n  exact h'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          assert "have h0 : translatePacket g 0 = g := by" in s
          p.write_text(s, encoding="utf-8")
          print("TRANSLATION_GAP_DIAGONAL_COMPAT=PASS")
          PY

      - name: Apply finite-dilation V11 Lean 4.33 compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          F11=".aegis/sovereign-omega-v2/formal/bridges/lean/WeilFiniteDilationFilterV11.lean"
          python3 - "$F11" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          original = s

          def rep(old: str, new: str, label: str) -> None:
              global s
              n = s.count(old)
              assert n == 1, f"{label}: expected 1 occurrence, found {n}"
              s = s.replace(old, new, 1)

          rep(
              '    have hpos : 0 < x * a := f.2.2.2 hxa\n    nlinarith',
              '    have hpos : 0 < x * a := f.2.2.2 hxa\n    rcases mul_pos_iff.mp hpos with h | h\n    · exact h.1\n    · exfalso\n      linarith [ha, h.2]',
              "dilate positivity",
          )

          rep(
              '  simp [FiniteDilationFilterV11, AEGIS.WeilMixedAlgebraV2.combo]\n  ring',
              '  change\n    (1 : ℂ) * f.1 x +\n        (-3 : ℂ) * f.1 (x * 2) +\n        (2 : ℂ) * f.1 (x * 4) =\n      f.1 x - 3 * f.1 (x * 2) + 2 * f.1 (x * 4)\n  ring',
              "pointwise filter",
          )

          rep(
